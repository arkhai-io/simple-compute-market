[project]
name = "arkhai-vms-buyer"
version = "0.3.4"
license = "MIT"
description = "Buyer-side CLI for the market: discover sellers, negotiate, place orders. Pure HTTP client; no server, no agent runtime."
requires-python = ">=3.12,<3.14"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "PyYAML>=6.0.0",
  "pyinstaller>=6.19.0",
  "eth-account>=0.13.0",
  # Needed by the buyer orchestrator (market buy-sync) for in-process
  # on-chain escrow creation. Imported lazily from the domain-owned
  # escrow client so loading the CLI does not pay the native-binary cost
  # unless the orchestrator actually runs.
  "alkahest-py==1.1.2",
  "arkhai-core-buyer>=0.3.0",
  "arkhai-core>=0.2.0",
  "arkhai-kit-alkahest",
  "arkhai-kit-hosted-settlement==0.1.4",
  "arkhai-kit-identity==0.3.0",
  "arkhai-kit-config",
  "arkhai-kit-policy",
  "arkhai-kit-settlement-runtime==0.1.2",
  "arkhai-vms>=0.3.0",
  "arkhai-vms-listings>=0.1.0",
  "arkhai-vms-negotiation>=0.1.0",
  "arkhai-vms-settlement>=0.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9.0.0",
  "pytest-asyncio>=0.23.8,<1.0.0",
]

[project.optional-dependencies]

# RL negotiation strategy — inference only. Mirrors the storefront's
# [rl] extra: ``uv pip install -e ".[rl]"`` runs trained pufferlib
# checkpoints from domains/vms/negotiation/rl/models/ without
# pulling in pufferlib itself. The model architecture is reproduced
# inline in arkhai_common.ArkhaiInferencePolicy (state-dict compatible).
rl = [
  "torch>=2.7.0",
]

[tool.uv]
# Tests import this package from its installed wheel, not an editable
# install: a directory-mapped package has no editable form that presents it
# under its import path. The Makefile and CI set UV_NO_EDITABLE, and these
# keys make uv rebuild that wheel whenever a module changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "*.py" },
]
# Restrict resolution to platforms we actually run/support for the VM buyer.
# Without this, uv attempts future/platform marker splits and can fail before
# reaching local path sources for internal packages.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# The `market` console script ships from arkhai-core-buyer; this package
# contributes the validated VM market-domain contract.
[project.entry-points."market.buyer_domains"]
vms = "domains.vms.buyer.cli:domain"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# This directory is the `domains.vms.buyer` package, mapped by directory so a
# module added here ships without a packaging edit. The listings, negotiation,
# and settlement modules it imports come from their own wheels.
# `main.py`, the PyInstaller entry point, ships as `domains.vms.buyer.main`.
include = ["/*.py"]

[tool.hatch.build.targets.wheel.sources]
"" = "domains/vms/buyer/"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
