[project]
name = "arkhai-vms"
version = "0.5.0"
license = "MIT"
description = "Shared VM-domain models and helpers used by Arkhai VM buyer and storefront packages."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2",
    "arkhai-core>=0.3.0",
    "arkhai-kit-capability-shape>=0.2.0",
    "arkhai-kit-capability-pricing>=0.1.0",
    # The default shape generator generates only the counts the storefront's
    # configured admissibility default admits.
    "arkhai-kit-capability-admissibility>=0.1.0",
    "arkhai-compute>=0.1.0",
]

[project.optional-dependencies]
storefront = [
    "arkhai-core-storefront>=0.6.0",
]

[project.entry-points."market.storefront_domains"]
vms = "arkhai_vms.domain_runtime:VM_MARKET_DOMAIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_vms"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "arkhai-core-storefront>=0.6.0",
    "pytest>=8.0",
]
