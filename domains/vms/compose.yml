# VM compute (vms.compute) market — domain stack.
#
# The seller side of the VM compute market: two registry/indexer instances,
# Bob's and Alice's storefronts and their provisioning authorities. The
# domain stack has no unconditional chain dependency. An explicit Alkahest
# storefront profile may add Anvil through the root development overlay;
# a payments-only profile composes without it.
#
# Paths below are relative to THIS file's directory (domains/vms/) — Compose
# `include:` resolves an included file's relative paths against its own
# location.
#
# This file holds topology only: service names, ports, container paths, and the
# values the topology fixes. A deployment's identities, configuration files,
# secret overlays and registry and site profiles are bound by its overlay
# (compose.vms-local.yml for development), and nothing here gives one a
# fallback, so without an overlay the registries, storefronts and provisioning
# authorities refuse to start for want of their identities.

services:
  # 1. Registry/Indexer service (vms.compute filter-spec — the image default).
  registry:
    image: arkhai:registry
    # The migration before the application, which refuses a database it has
    # not migrated.
    command: ["sh", "-c", "registry-migrate && exec uvicorn core_registry.main:app --host 0.0.0.0 --port 8080"]
    ports:
      - "8080:8080"
    env_file:
      - ../../core/registry/.env.docker-compose
    volumes:
      - ../../shared-env:/app/shared-env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      # CMD-SHELL form works reliably under both Docker and Podman; the
      # CMD+argv form can be mis-parsed on Podman for non-trivial Python code.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 1b. Second Registry/Indexer — a private registry alongside the public
  # one, exercising authenticated multi-registry publication and discovery.
  registry-b:
    image: arkhai:registry
    command: ["sh", "-c", "registry-migrate && exec uvicorn core_registry.main:app --host 0.0.0.0 --port 8080"]
    ports:
      - "8082:8080"
    # Its read and write gates, admin key and bootstrap key are the deployment's,
    # in its registry profile; never commit a key to this Compose file or the
    # public storefront profile.
    env_file:
      - ../../core/registry/.env.docker-compose
    volumes:
      - ../../shared-env:/app/shared-env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Bob's storefront — the primary test seller.
  # Buyers are pure HTTP clients. The root overlay supplies the one-shot
  # `market` container with separate persistent XDG profile/run directories,
  # public config, and strict provider-secret mounts; this seller stack does
  # not own or inspect buyer profile state.
  bob-storefront:
    image: arkhai:storefront
    platform: linux/amd64
    # entrypoint.sh starts ZeroTier, then the migration command runs before
    # the storefront, which refuses a database it has not migrated.
    command: ["./entrypoint.sh", "sh", "-c", "market-storefront-migrate && exec market-storefront serve"]
    depends_on:
      registry:
        condition: service_healthy
      registry-b:
        condition: service_healthy
      provisioning:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "8001:8001"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Sole config-bearing env var: tell the typed config loader where
      # to find the mounted files, /etc/arkhai/storefront.toml and its secret
      # overlay /etc/arkhai/storefront.secrets.toml, which the overlay binds.
      - XDG_CONFIG_HOME=/etc
      # The storefront's policy discovery needs `domains/` on PYTHONPATH
      # so it can find arkhai_vms_negotiation.rl callables.
      - PYTHONPATH=/app:/app/src
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 2a. Mailpit — receives the storefront's seller-side introduction mail.
  # An off-the-shelf SMTP server with a query API, so a scenario can read
  # what the seller would have been sent.
  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2b. Alice's storefront — exercises heterogeneous registry
  # topology in the multi-registry e2e scenario. Alice's config.toml
  # lists only the public registry, so her listings appear only
  # there, while Bob's fan out to both. This is the only thing that
  # makes the multi-registry scenario non-trivial: without an Alice,
  # every listing has the same registry footprint and the test can't
  # distinguish per-provider config from per-listing config.
  alice-storefront:
    image: arkhai:storefront
    platform: linux/amd64
    # As Bob's: ZeroTier, then the migration command, then the storefront.
    command: ["./entrypoint.sh", "sh", "-c", "market-storefront-migrate && exec market-storefront serve"]
    depends_on:
      registry:
        condition: service_healthy
      alice-provisioning:
        condition: service_healthy
    ports:
      - "8002:8002"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - XDG_CONFIG_HOME=/etc
      - PYTHONPATH=/app:/app/src
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 3. Retained Redis service. Provisioning uses process-local job queues
  # and does not consume this service.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 4. Provisioning service.
  # Configuration is bundled in the compute provisioning service wheel; its
  # `docker` profile names the image's IaC paths. A deployment's overlay points
  # CONFIG_DIRECTORY at its own profiles, its site's identities among them, and
  # extends ACTIVE_PROFILES with them.
  provisioning: &provisioning
    image: arkhai:compute-provisioning
    platform: linux/amd64
    command: ["sh", "-c", "compute-provisioning-migrate && exec compute-provisioning-api"]
    depends_on:
      redis:
        condition: service_healthy
      registry:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - PROVISIONING_DATABASE_URL=sqlite:////app/data/provisioning.db
      - REDIS_URL=redis://redis:6379
      # Real provisioning. The development overlay appends its site profile and
      # the run's mode, `mock` selecting the mock runner in place of Ansible
      # and the /test/* controls the end-to-end scenarios hold jobs through.
      # Never mock in staging or production.
      - ACTIVE_PROFILES=docker
      # Storefront callback target for the lease watchdog.
      # When the watchdog releases a lease, it PATCHes this URL to mark the
      # storefront resource available. Must match the bob-storefront service
      # name and port defined in this compose file.
      - PROVISIONING_STOREFRONT_URL=http://bob-storefront:8001
    volumes:
      - ./provisioning/iac:/opt/domains/vms/provisioning/iac
      - ${HOME}/.ssh/id_ed25519:/home/appuser/.ssh/id_ed25519:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m

  # Each authority keeps its database and in-process job queue in its own
  # container. Neither storefront shares physical authority.
  alice-provisioning:
    <<: *provisioning
    depends_on:
      registry:
        condition: service_healthy
    ports:
      - "8083:8081"
    environment:
      - PROVISIONING_DATABASE_URL=sqlite:////app/data/provisioning.db
      - ACTIVE_PROFILES=docker
      - PROVISIONING_STOREFRONT_URL=http://alice-storefront:8002
