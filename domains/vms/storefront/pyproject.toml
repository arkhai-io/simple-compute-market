[project]
name = "arkhai-vms-storefront"
version = "0.3.0"
license = "MIT"
description = "Provider-side storefront server: hosts /orders, /negotiate, /settle, /alerts/resource endpoints. The provider-side counterpart to arkhai-vms-buyer."
authors = [
    {name = "Your Name", email = "your@email.com"},
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-core-registry-client>=0.11.0",
    "arkhai-core-storefront-client>=0.17.0",
    "arkhai-core-storefront>=0.3.0",
    "arkhai-kit-capacity-publication==0.1.0",
    "arkhai-kit-site-client>=0.2.0",
    "arkhai-kit-resource-pools>=0.2.0",
    "arkhai-core>=0.2.0",
    "arkhai-kit-identity==0.3.0",
    "arkhai-kit-alkahest",
    "arkhai-kit-config",
    "arkhai-kit-policy",
    "arkhai-kit-settlement-runtime>=0.1.0",
    "arkhai-kit-storefront==0.1.0",
    "arkhai-kit-negotiation-runtime==0.1.0",
    "arkhai-kit-hosted-settlement==0.1.0",
    "arkhai-kit-site>=0.3.0",
    "arkhai-bare-metal>=0.2.0",
    "arkhai-bare-metal-storefront==0.2.0",
    "arkhai-vms>=0.2.0",
    "arkhai-compute-provisioning>=0.6.0",
    "arkhai-kit-fulfillment>=0.2.0",
    "opentelemetry-exporter-gcp-trace>=1.9.0,<2.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "fastapi~=0.115.8",
    # [all] carries typing-inspect, which fastapi_utils.cbv imports
    # unconditionally under pydantic v2.
    "fastapi-utils[all]>=0.8.0",
    "uvicorn~=0.34.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    # Required by FastAPI routes that accept UploadFile/File form data.
    "python-multipart>=0.0.20",
    "alkahest-py==1.1.2",
    "web3>=7.14.0",
    "websockets>=15.0.1",
    "httpx>=0.27",
    # CLI surface (`market-storefront` console script).
    "typer>=0.12.0",
    "rich>=13.7.0",
    "eth-account>=0.13.0",
    "dynaconf>=3.0.0",
]

[project.scripts]
market-storefront = "market_storefront.cli:app"

[project.entry-points."market.storefront_contributions"]
vms = "market_storefront.domain_runtime:VM_STOREFRONT_CONTRIBUTION"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "wandb>=0.23.0",
]

[project.optional-dependencies]

# Inference-only — just enough to load and run the trained .pt checkpoints
# in domains/vms/negotiation/rl/models/. The architecture is
# reproduced inline in arkhai_common.ArkhaiInferencePolicy (state-dict
# compatible with checkpoints trained against pufferlib.models.Default,
# verified bit-identical). Training (which still uses pufferlib's C env)
# lives in domains/vms/training and is not exposed as an extra here.
rl = [
    "torch>=2.7.0",
]

jupyter = [
    "jupyter>=1.0.0,<2.0.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "codespell>=2.2.0,<3.0.0",
    "types-pyyaml>=6.0.12.20240917,<7.0.0",
    "types-requests>=2.32.0.20240914,<3.0.0",
]

[tool.uv]
# All internal wheels resolve from the repo's .dist/ via the CLI flag —
# `make init`/`reinit`/`test` and the Dockerfile all pass --find-links.
# No find-links entry here: a relative path can't normalize inside the
# Docker build, where /app is the project root.
# Restrict resolution to platforms that have alkahest_py wheels.
# Restricting the supported environments also keeps internal wheel-only
# dependencies from being resolved for platforms absent from local find-links.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["market_storefront"]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_subclassing_any = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
follow_imports = "silent"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["misc", "no-untyped-call", "no-any-return"]

exclude = [".venv"]

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/*.ipynb"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = ["src", "../../.."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.metadata]
allow-direct-references=true

[tool.hatch.build.targets.wheel]
packages = ["src/market_storefront"]

[tool.hatch.build.targets.wheel.force-include]
"../../__init__.py" = "domains/__init__.py"
"../__init__.py" = "domains/vms/__init__.py"
"../listings/__init__.py" = "domains/vms/listings/__init__.py"
"../listings/buyer_cli.py" = "domains/vms/listings/buyer_cli.py"
"../listings/host_csv_importer.py" = "domains/vms/listings/host_csv_importer.py"
"../listings/listing_mode.py" = "domains/vms/listings/listing_mode.py"
"../listings/models.py" = "domains/vms/listings/models.py"
"../listings/pricing.py" = "domains/vms/listings/pricing.py"
"../listings/pool_descriptors.py" = "domains/vms/listings/pool_descriptors.py"
"../listings/pricing_resolution.py" = "domains/vms/listings/pricing_resolution.py"
"../listings/reconciler.py" = "domains/vms/listings/reconciler.py"
"../listings/resource_csv_importer.py" = "domains/vms/listings/resource_csv_importer.py"
"../listings/resources.py" = "domains/vms/listings/resources.py"
"../listings/strategy.py" = "domains/vms/listings/strategy.py"
"../negotiation/__init__.py" = "domains/vms/negotiation/__init__.py"
"../negotiation/policies.py" = "domains/vms/negotiation/policies.py"
"../negotiation/storefront_round.py" = "domains/vms/negotiation/storefront_round.py"
"../negotiation/rl/__init__.py" = "domains/vms/negotiation/rl/__init__.py"
"../negotiation/rl/arkhai_common.py" = "domains/vms/negotiation/rl/arkhai_common.py"
"../negotiation/rl/torch_arkhai_strategy.py" = "domains/vms/negotiation/rl/torch_arkhai_strategy.py"
"../negotiation/rl/models/arkhai_negotiator_buyer.pt" = "domains/vms/negotiation/rl/models/arkhai_negotiator_buyer.pt"
"../negotiation/rl/models/arkhai_negotiator_seller.pt" = "domains/vms/negotiation/rl/models/arkhai_negotiator_seller.pt"
"../settlement/__init__.py" = "domains/vms/settlement/__init__.py"
"../settlement/compute_lease.py" = "domains/vms/settlement/compute_lease.py"
"../settlement/fulfillment.py" = "domains/vms/settlement/fulfillment.py"
"../settlement/heartbeats.py" = "domains/vms/settlement/heartbeats.py"
"../settlement/proposals.py" = "domains/vms/settlement/proposals.py"
