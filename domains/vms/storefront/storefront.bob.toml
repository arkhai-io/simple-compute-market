# Bob (seller) local Compose profile. Public marketplace identity and EVM
# mechanism address are configuration; signing credentials are injected by
# Compose Secrets through ARKHAI_IDENTITY_CREDENTIAL and
# STOREFRONT_WALLET__PRIVATE_KEY.

agent_id            = "bob"
port                = 8001
base_url            = "http://bob-storefront:8001/"
db_path             = "./src/market_storefront/data/storefront/agent.db"
log_file_path       = "./logs/bob.log"
# Seed the resources table from this CSV on startup when the table is empty.
# The bundled kvm1-machine.csv is the local dev inventory. Bind-mounted into
# the container at /app/resources.csv by `make deploy-storefront`.
# For helm deployments, inject via --set-file (RESOURCES_CSV_FILE) instead —
# the CSV content is delivered through the agent Secret, not a file path.
resources_csv_path  = "/app/resources.csv"

[Identity.principal]
scheme = "eip191"
identifier = "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"

[Identity.administrators.operator]
principal = { scheme = "eip191", identifier = "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc" }

[Identity.service_peers.provisioning_default]
role = "service"
site_id = "default"
principal = { scheme = "eip191", identifier = "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266" }

[Settlement]
schema_version = 1
priority = ["alkahest.v1"]

[Settlement.alkahest]
enabled = true
address_config_path = "/app/src/market_storefront/data/alkahest_anvil_addresses.json"
oracle_gated = false
trusted_oracle_addresses = []
interruptible = false
interruptible_oracle_addresses = []

[Wallet]
address     = "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
ssh_public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDemoPublicKeyForComputeAccess bob@example.com"

[Chains.anvil]
rpc_url = "ws://anvil:8545"
chain_id = 31337

[registry]
# Two registry instances: ``registry`` is the public one,
# ``registry-b`` simulates a private/secondary registry that gates
# read + write access via Authorization: Bearer (both gates on in its
# container). The seller fans publishes/heartbeats out to both;
# buyers discover the union. Drop registry-b from urls + auth to
# fall back to single-public-registry behaviour.
urls                      = ["http://registry:8080", "http://registry-b:8080"]

[registry.authorities."http://registry:8080"]
authority = "registry"
principals = [
  { scheme = "eip191", identifier = "0x90f79bf6eb2c4f870365e785982e1f101e93b906" },
]

[registry.authorities."http://registry-b:8080"]
authority = "registry-b"
principals = [
  { scheme = "eip191", identifier = "0x15d34aaf54267db7d7c367839aaf71a00a2c6a65" },
]

# The private registry bearer token belongs in the mounted
# storefront.secrets.toml under [registry.auth].

# The site authority is hosted by the provisioning service
# (authority_url defaults to provisioning.service_url). Poll fast —
# the suite waits on delta-driven listing reconciliation.
[capacity]
poll_interval    = 1
# Two-phase reserve: acceptance holds capacity until the buyer settles
# (the e2e deals settle within seconds; 900s is headroom, and unsettled
# holds lapse on their own). Deliberately overrides the shipped default
# of 0 — this local profile has no untrusted buyers, and keeping holds
# on here is what keeps the two-phase reserve path under e2e coverage
# while production defaults to placing no pre-settlement hold.
hold_ttl_seconds = 900

[provisioning]
service_url = "http://provisioning:8081"
# Compose-stack default. Tests override via PROVISIONING_MODE shell env
# pulled into compose with ${PROVISIONING_MODE:-http}.
mode        = "http"
# Mock provisioning responds in milliseconds; poll frequently so the
# storefront sees job completion quickly without waiting the 15s production default.
poll_interval = 1

[provisioning.identity]
principals = [
  { scheme = "eip191", identifier = "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266" },
]

[negotiation]
# Ordered policies run per round. Guards short-circuit with
# `reject`/`exit` when their preconditions fail; the terminal policy
# (`bisection` here; `rl` requires torch and isn't installed in the test
# env) always returns a counter/accept/exit. The legacy `policy_mode`
# key still works (synthesizes the same default chain).
policies = ["has_matching_inventory_guard", "escrow_shape_guard", "bisection"]

[pricing]
settlements = [
  { mechanism = "alkahest.v1", asset = "0x9fe46736679d2d9a65f0992f2272de9f3c7fa6e0", rate = "100", per = "hour", mechanism_input = { chain = "anvil", escrow_kind = "erc20_escrow_obligation_default" } },
]
# Defaults applied to inventory rows that don't carry their own
# min_price/token/max_duration_seconds. Per-row CSV columns override.
# default_max_duration_seconds = 0 (or omitted) means "unlimited".
default_min_price            = "100"
default_token_address        = "0x9fe46736679d2d9a65f0992f2272de9f3c7fa6e0"
default_max_duration_seconds = 0
