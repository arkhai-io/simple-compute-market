[project]
name = "arkhai-vms-provisioning-adapter"
version = "0.1.0"
license = "MIT"
description = "VM and Ansible adapter for the compute provisioning service"
requires-python = ">=3.12"
dependencies = [
    "arkhai-compute-provisioning>=0.5.0",
    "arkhai-compute-provisioning-service>=0.1.0",
    "arkhai-vms-provisioning-operator-client>=0.3.0",
    "arkhai-vms>=0.2.0",
    "arkhai-bare-metal>=0.2.0",
    "arkhai-kit-resource-pools>=0.1.0",
    "arkhai-kit-fulfillment>=0.1.0",
    "dependency-injector>=4.41.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vm_provisioning_adapter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=9.0.2"]

[tool.uv.sources]
arkhai-compute-provisioning = { path = "../../../../provisioning/compute", editable = true }
arkhai-compute-provisioning-service = { path = "../../../../provisioning/compute/service", editable = true }
arkhai-vms-provisioning-operator-client = { path = "../client", editable = true }
arkhai-vms = { path = "../../domain", editable = true }
arkhai-bare-metal = { path = "../../../bare_metal", editable = true }