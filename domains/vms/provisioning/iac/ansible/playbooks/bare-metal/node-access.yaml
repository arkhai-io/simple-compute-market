---
- name: Bare-metal Node Access Operations
  hosts: kvm_hosts
  gather_facts: no
  vars:
    target_host: "{{ executor_target | default(host_id | default('localhost')) }}"
    node_host_id: "{{ executor_target | default(host_id | default('')) }}"
    node_action: "{{ executor_action | default(vm_action | default('node_grant_access')) }}"

  roles:
    - ../../roles/bare-metal-access

  post_tasks:
    - name: Summary of bare-metal node access operation
      debug:
        msg: |
          Bare-metal Node Access Summary:
          - Target Host: {{ target_host }}
          - Host ID: {{ node_host_id }}
          - Action Performed: {{ node_action }}
          - Operation completed successfully
