[defaults]
stdout_callback = default
callback_result_format = yaml
log_path = ./ansible.log
host_key_checking = False
display_skipped_hosts = False
display_ok_hosts = True
deprecation_warnings = False
roles_path = ./roles:./playbooks/single-tenant/roles:./playbooks/multi-tenant/roles
# Run against the whole inventory directory (-i inventory/): infrastructure in
# `hosts`, sold hosts in `provisioning-hosts.ini`. Not inventory, and skipped:
# the committed templates, the backups the VM role leaves when it records a
# VM, and the YAML variable files kept alongside (management-vars.yaml, the
# vm-vars example), which playbooks are given with -e.
inventory_ignore_extensions = ~, .orig, .bak, .cfg, .retry, .pyc, .pyo, .swp, .md, .txt, .rst, .example, .yaml, .yml
