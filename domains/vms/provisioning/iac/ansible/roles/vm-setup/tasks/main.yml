---
# VM Setup Role - Main Task Orchestration
# This file coordinates all the sub-tasks for Host Kit installation and VM operations
#
# Task Flow:
# 0. Preconditions - the passthrough override is valid and the CPU offers
#    hardware virtualization, both checked before anything on the host changes
# 1. System Packages - Install basic tools and packages
# 2. GPU Passthrough - Configure GPU passthrough (when a GPU is present, or the
#    operator enables it)
# 3. KVM Setup - Configure KVM virtualization
# 4. KVM Network - Setup KVM networking
# 5. Security Hardening - Apply security configurations
# 6. Golden Image Build - Build golden images (if vm_image_type == "golden")
# 7. GPU Detection Service - Setup GPU detection service (with passthrough)
# 8. Verification - Verify installation

# ============================================
# Preconditions — read-only, before any change to the host
# ============================================

# Tagged `always`, as everything after them may be selected by tag: a run
# limited to one part of the role still refuses a host it cannot prepare.
- name: Validate the GPU passthrough override
  assert:
    that:
      - gpu_passthrough in ['auto', 'enabled', 'disabled']
    fail_msg: >-
      gpu_passthrough is '{{ gpu_passthrough }}'; it must be auto (configure
      passthrough only when a GPU is present), enabled, or disabled. Nothing on
      the host has been changed.
    quiet: true
  tags:
    - always

# A host without KVM would otherwise complete preparation and fail every VM
# later with an unrelated error, or run it under software emulation.
- name: Read the CPU's hardware virtualization extensions
  shell: grep -qwE '(vmx|svm)' /proc/cpuinfo
  register: cpu_virt_support
  changed_when: false
  failed_when: false
  tags:
    - always

- name: Refuse a host without hardware virtualization
  fail:
    msg: >-
      Hardware virtualization is unavailable: the CPU exposes neither vmx nor
      svm, so this host cannot run KVM guests. On a cloud instance, create it
      with nested virtualization enabled. Nothing on the host has been changed.
  when: cpu_virt_support.rc != 0
  tags:
    - always

# ============================================
# Host Kit Installation Tasks
# ============================================

- name: Include system packages installation
  include_tasks:
    file: system-packages.yml
    apply:
      tags:
        - system_setup
        - host_setup
        - always
  tags:
    - system_setup
    - host_setup
    - always

- name: Include GPU passthrough viability audit
  include_tasks:
    file: passthrough-audit.yml
    apply:
      tags:
        - passthrough_audit
        - gpu_passthrough
        - host_setup
  tags:
    - passthrough_audit
    - gpu_passthrough
    - host_setup

# Read-only, and tagged `always` because every passthrough include below is
# conditioned on the decision it makes.
- name: Include GPU presence detection
  include_tasks:
    file: gpu-presence.yml
    apply:
      tags:
        - always
  tags:
    - always

# Passthrough boot configuration changes what a machine reachable only over its
# network boots into, so a host with no GPU present keeps its boot as it was.
- name: Include GPU passthrough configuration
  include_tasks:
    file: gpu-passthrough.yml
    apply:
      tags:
        - gpu_passthrough
        - host_setup
  when: gpu_passthrough_configured | bool
  tags:
    - gpu_passthrough
    - host_setup

- name: Include rescue boot entry installation
  include_tasks:
    file: rescue-boot-entry.yml
    apply:
      tags:
        - rescue_boot
        - gpu_passthrough
        - host_setup
  when: gpu_passthrough_configured | bool
  tags:
    - rescue_boot
    - gpu_passthrough
    - host_setup

- name: Include KVM setup and configuration
  include_tasks:
    file: kvm-setup.yml
    apply:
      tags:
        - kvm_config
        - host_setup
  tags:
    - kvm_config
    - host_setup

- name: Include KVM network configuration
  include_tasks:
    file: kvm-network.yml
    apply:
      tags:
        - kvm_network
        - host_setup
  tags:
    - kvm_network
    - host_setup

- name: Include security hardening
  include_tasks:
    file: security-hardening.yml
    apply:
      tags:
        - security_hardening
        - host_setup
  tags:
    - security_hardening
    - host_setup

- name: Include SSH authorized keys injection
  include_tasks:
    file: ssh-authorized-keys.yml
    apply:
      tags:
        - ssh_keys
        - security_hardening
        - host_setup
  tags:
    - ssh_keys
    - security_hardening
    - host_setup

- name: Install the VM tunnel client when this host's pool uses a relay
  # Conditional, not defaulted. A host with a public address and no relay
  # serves VMs by direct NAT, which is a supported deployment — and the role
  # now asserts an address and a token rather than falling back to a published
  # literal, so including it unconditionally would fail initialization of every
  # host that does not use a relay. The correct behaviour for an absent relay
  # is that no VM tunnel client is installed at all.
  include_tasks:
    file: frp-client.yml
    apply:
      tags:
        - frp_client
        - host_setup
  when: frp_server_addr is defined and frp_server_addr | length > 0
  tags:
    - frp_client
    - host_setup

# ============================================
# Host Kit VM Operations Tasks
# ============================================

- name: Include golden image build (only when vm_image_type == "golden")
  include_tasks:
    file: golden-image-build.yml
    apply:
      tags:
        - golden_image
        - vm_operations
        - build
  when: vm_image_type is defined and vm_image_type == "golden"
  tags:
    - golden_image
    - vm_operations
    - build

- name: Include GPU detection service setup
  include_tasks:
    file: gpu-detection-service.yml
    apply:
      tags:
        - gpu_detection
        - vm_operations
        - build_completion
  when: gpu_passthrough_configured | bool
  tags:
    - gpu_detection
    - vm_operations
    - build_completion

# ============================================
# Verification and Final Notes
# ============================================

- name: Display post-installation notes
  debug:
    msg:
      - "=== KVM Installation & Security Hardening Complete ==="
      - "0. GPU passthrough: {{ 'configured; only GPUs whose entire IOMMU group belongs to the card are bound after the reboot. See the audit report above.' if gpu_passthrough_configured | bool else 'not configured; the boot configuration was left as it was.' }}"
      - "1. Users have been added to libvirt and kvm groups"
      - "2. Hardware virtualization confirmed, /dev/kvm present, nested virtualization enabled"
      - "3. Default libvirt network has been configured"
      - "4. A bridge network setup script has been created at /tmp/setup_bridge.sh"
      - "5. Security hardening applied - VMs blocked from accessing host SSH"
      - "6. Network isolation rules configured and persistent"
      - "7. Fail2ban intrusion prevention system installed and configured"
      - "8. GPU detection service {{ 'configured and enabled' if gpu_passthrough_configured | bool else 'not installed' }}"
      - "9. FRP client installed and configured for remote access"
      - ""
      - "SECURITY FEATURES ACTIVE:"
      - "  ✓ VM-to-host SSH access blocked (iptables + SSH config)"
      - "  ✓ Libvirt security hardening applied"
      - "  ✓ Network isolation service enabled"
      - "  ✓ SSH connection monitoring configured"
      - "  ✓ Fail2ban monitoring and auto-banning suspicious IPs"
      - "  ✓ Custom filters for VM and libvirt attack detection"
      - "  ✓ SSH public key(s) injected into authorized_keys (if supplied)"
      - ""
      - "FAIL2BAN JAILS ACTIVE:"
      - "  - SSH brute force protection (6 attempts, 20 min ban)"
      - "  - VM SSH attack detection (4 attempts, 20 min ban, internal network only)"
      - "  - Bridged SSH attack detection (4 attempts, 20 min ban, all ports except 22)"
      - "  - All jails use iptables-allports (complete IP blocking)"
      - ""
      - "VM TUNNEL CLIENT:"
      - "  - Config: /etc/frp/frpc-vms.toml"
      - "  - Logs: /var/log/frp/frpc-vms.log"
      - "  - Status: sudo systemctl status frpc-vms"
      - "  - View logs: sudo tail -f /var/log/frp/frpc-vms.log"
      - "  - The host management tunnel is a separate unit, written when this"
      - "    host was prepared. No VM operation touches it."
      - ""
      - "IMPORTANT: A reboot is recommended to ensure all changes take effect"
      - "After reboot, you can:"
      - "  - Use virt-manager for GUI VM management"
      - "  - Use virsh for command-line VM operations"
      - "  - Run /tmp/setup_bridge.sh to configure bridge networking (optional)"
      - "  - Use the vm-management role to download cloud images and manage VMs"
      - ""
      - "Security Verification:"
      - "  - Check iptables: sudo iptables -L INPUT | grep 192.168.122"
      - "  - Check SSH config: sudo sshd -T | grep -i deny"
      - "  - Monitor logs: sudo tail -f /var/log/auth.log | grep BLOCKED-VM-SSH"
      - "  - Check fail2ban: sudo fail2ban-client status"
      - "  - View banned IPs: sudo fail2ban-client status sshd"
      - "  - Check bridged attacks: sudo fail2ban-client status bridged-ssh-attacks"
      - "  - Monitor fail2ban logs: sudo tail -f /var/log/fail2ban.log"
      - "  - Monitor bridge SSH logs: sudo tail -f /var/log/kern.log | grep BLOCKED-BRIDGE-SSH"
      - ""
      - "To test: virsh list --all"
  tags: verify_kvm

# ============================================
# Reboot System
# ============================================

# Every prepared host reboots, so each starts from the configuration preparation
# wrote. On a host with passthrough configured, this reboot applies the IOMMU
# kernel parameter and the initramfs rebuild, neither of which binds a device, so
# it cannot remove the host's network path. Device binding happens after it, in
# gpu-bind.yml, with this connection live.
# vfio-bind.service is installed but disabled until a bind has been applied and
# verified here, so no boot replays an unverified bind list. See
# openspec/specs/physical-provisioning/architecture.md.
- name: Reboot the system to apply all changes
  reboot:
    msg: "Rebooting to apply host preparation's configuration changes"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  tags:
    - reboot
    - always

# ============================================
# GPU passthrough, phase two
# ============================================

# After the reboot, not before. The IOMMU only exists on this side of it, so a
# first preparation can classify groups here that it could not classify
# earlier; and binding is applied while this connection is live, so a wrong
# bind list fails a task on a reachable host instead of taking the network away
# during a boot nobody is watching.
#
# Only where passthrough is configured this run: binding writes its list into
# the directory gpu-passthrough.yml creates and applies it through the
# vfio-bind unit installed there. Where it is configured, what is bound is still
# exactly what the audit after the reboot finds bindable. Skipping configuration
# does not undo an earlier one: a unit an earlier preparation enabled stays
# enabled.
- name: Include GPU passthrough binding
  include_tasks:
    file: gpu-bind.yml
    apply:
      tags:
        - gpu_bind
        - gpu_passthrough
        - host_setup
  when: gpu_passthrough_configured | bool
  tags:
    - gpu_bind
    - gpu_passthrough
    - host_setup
