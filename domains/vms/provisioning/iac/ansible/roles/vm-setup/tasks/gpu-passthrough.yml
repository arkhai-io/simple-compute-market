---
# GPU passthrough, phase one: prepare the boot configuration.
#
# This phase changes what the machine boots into and binds nothing. The IOMMU
# kernel parameter needs a reboot to take effect and claims no device, so it
# cannot remove the host's network path. Everything that does claim a device
# happens in gpu-bind.yml, after the reboot, while Ansible holds a live
# connection to the host.
#
# Two things are deliberately absent, and their absence is the point.
#
# There is no `vfio-pci.ids=` on the kernel command line and no `ids=` in
# /etc/modprobe.d/vfio.conf. Both bind by vendor:device, which matches every
# device presenting that ID anywhere in the machine rather than the one the
# decision was made about. Binding is done by PCI address instead.
#
# vfio-bind.service is installed here but not enabled. A unit enabled before
# any evidence that its bind list works on this machine would reapply a wrong
# list on every subsequent boot, with no live connection at the moment it takes
# the network away. Enabling is the last step of phase two, after a bind has
# been applied and verified with the host reachable.

- name: Determine IOMMU kernel parameter for this CPU vendor
  set_fact:
    iommu_cmdline_param: >-
      {{ 'amd_iommu=on iommu=pt'
         if 'AuthenticAMD' in (ansible_processor | join(' '))
         else 'intel_iommu=on iommu=pt' }}
  tags:
    - gpu_passthrough
    - rescue_boot

# The blacklist is all-or-nothing: modprobe blacklists a module, not a device.
# Applying it when the audit deliberately left a GPU on its normal driver would
# strand that card for the host as well, which contradicts the per-address
# decision the audit just made. So it applies only when every detected GPU is
# bindable -- when this host is genuinely dedicating its GPUs to guests.
#
# Its absence does not prevent binding. vfio-bind sets driver_override and
# unbinds the incumbent driver, which succeeds whenever nothing holds the
# device open; the blacklist only removes the race with a driver that would
# otherwise claim it at boot.
- name: Set GPU driver blacklist policy
  set_fact:
    blacklist_host_gpu_drivers: >-
      {{ passthrough_audit.assessable
         and (passthrough_audit.gpus | length) > 0
         and (passthrough_audit.gpus | rejectattr('bindable') | list | length) == 0 }}
  tags: gpu_passthrough

# ============================================
# IOMMU enablement — the one reboot-requiring change
# ============================================

- name: Remove any vendor-ID vfio binding from the GRUB command line
  become: yes
  replace:
    path: /etc/default/grub
    regexp: '\s*vfio-pci\.(ids|disable_vga)=[^\s"]*'
    replace: ''
  register: grub_vfio_removed
  tags: gpu_passthrough

- name: Enable the IOMMU on the GRUB command line
  become: yes
  shell:
    cmd: |
      set -euo pipefail
      line=$(grep '^GRUB_CMDLINE_LINUX_DEFAULT=' /etc/default/grub | sed 's/^GRUB_CMDLINE_LINUX_DEFAULT="//; s/"$//')
      original="${line}"
      for token in {{ iommu_cmdline_param }}; do
        case " ${line} " in
          *" ${token} "*) ;;
          *) line="${line} ${token}" ;;
        esac
      done
      line=$(echo "${line}" | tr -s ' ' | sed 's/^ *//; s/ *$//')
      if [ "${line}" = "${original}" ]; then
        echo "UNCHANGED ${line}"
        exit 0
      fi
      sed -i "s|^GRUB_CMDLINE_LINUX_DEFAULT=.*|GRUB_CMDLINE_LINUX_DEFAULT=\"${line}\"|" /etc/default/grub
      echo "CHANGED ${line}"
    executable: /bin/bash
  register: grub_iommu_result
  # The script reports its own outcome rather than having Ansible re-derive it
  # by comparing a before-image: a changed_when that parses the file twice can
  # disagree with what the script actually did.
  changed_when: grub_iommu_result.stdout is search('^CHANGED')
  tags: gpu_passthrough

# ============================================
# vfio modules and host driver blacklists
# ============================================

- name: Load the vfio modules at boot
  become: yes
  copy:
    dest: /etc/modules-load.d/vfio.conf
    content: |
      vfio
      vfio_iommu_type1
      vfio_pci
    mode: '0644'
  register: vfio_modules_configured
  tags: gpu_passthrough

- name: Remove vendor-ID vfio binding from modprobe configuration
  become: yes
  file:
    path: /etc/modprobe.d/vfio.conf
    state: absent
  register: vfio_modprobe_removed
  tags: gpu_passthrough

- name: Blacklist host NVIDIA drivers
  become: yes
  copy:
    dest: /etc/modprobe.d/blacklist-nvidia.conf
    content: |
      blacklist nouveau
      blacklist nvidia
      blacklist nvidia_drm
      blacklist nvidia_modeset
      blacklist nvidia_uvm
      options nouveau modeset=0
    mode: '0644'
  register: nvidia_blacklisted
  when: blacklist_host_gpu_drivers
  tags: gpu_passthrough

- name: Blacklist host AMD GPU drivers
  become: yes
  copy:
    dest: /etc/modprobe.d/blacklist-amd.conf
    content: |
      blacklist amdgpu
      blacklist radeon
    mode: '0644'
  register: amd_blacklisted
  when: blacklist_host_gpu_drivers
  tags: gpu_passthrough

- name: Remove host GPU driver blacklists when a GPU stays on its own driver
  become: yes
  file:
    path: "/etc/modprobe.d/{{ item }}"
    state: absent
  loop:
    - blacklist-nvidia.conf
    - blacklist-amd.conf
  register: blacklists_removed
  when: not blacklist_host_gpu_drivers
  tags: gpu_passthrough

# A blacklist in /etc/modprobe.d has no effect on a module the initramfs loads
# before the root filesystem is mounted, so the rebuild is what makes the
# blacklist real.
- name: Update initramfs
  become: yes
  command: update-initramfs -u -k all
  when: >-
    grub_iommu_result.changed
    or grub_vfio_removed.changed
    or vfio_modules_configured.changed
    or vfio_modprobe_removed.changed
    or nvidia_blacklisted.changed
    or amd_blacklisted.changed
    or blacklists_removed.changed
  register: initramfs_updated
  tags: gpu_passthrough

- name: Update GRUB
  become: yes
  command: update-grub
  when: grub_iommu_result.changed or grub_vfio_removed.changed
  tags: gpu_passthrough

# ============================================
# Install the bind mechanism, disabled
# ============================================

- name: Create the vfio bind state directory
  become: yes
  file:
    path: "{{ vfio_bind_state_path | dirname }}"
    state: directory
    mode: '0755'
  tags: gpu_passthrough

- name: Install the vfio bind script
  become: yes
  template:
    src: vfio-bind.sh.j2
    dest: "{{ vfio_bind_script_path }}"
    mode: '0755'
  tags: gpu_passthrough

- name: Install the vfio bind service
  become: yes
  template:
    src: vfio-bind.service.j2
    dest: /etc/systemd/system/vfio-bind.service
    mode: '0644'
  register: vfio_bind_unit
  tags: gpu_passthrough

- name: Reload systemd for the vfio bind service
  become: yes
  systemd:
    daemon_reload: yes
  when: vfio_bind_unit.changed
  tags: gpu_passthrough

- name: Report passthrough boot configuration
  debug:
    msg:
      - "=== GPU passthrough: boot configuration ==="
      - "IOMMU parameter: {{ iommu_cmdline_param }}"
      - "Host GPU drivers blacklisted: {{ blacklist_host_gpu_drivers }}"
      - "Reboot required: {{ initramfs_updated.changed | default(false) }}"
      - >-
        No device is bound yet. Binding is applied after the reboot, by
        gpu-bind.yml, while this connection is live.
  tags: gpu_passthrough
