---
# GPU passthrough configuration.
#
# Acts only on GPUs the audit reported bindable. A GPU sharing an IOMMU group
# with a device the host needs is left on its normal driver: passing it would
# require passing that device with it, and there is no configuration that
# avoids the requirement.
#
# Two things are deliberately absent here, and their absence is the point.
#
# There is no `vfio-pci.ids=` on the kernel command line and no `ids=` in
# /etc/modprobe.d/vfio.conf. Both bind by vendor:device, which matches every
# device presenting that ID anywhere in the machine rather than the one the
# decision was made about. Binding is done by PCI address instead, from
# vfio-bind.service.
#
# There is no reboot triggered by a binding decision. The only reboot this role
# performs exists to enable the IOMMU, which binds nothing and therefore cannot
# remove the host's network path. Every decision about which devices go to
# guests takes effect without one, so a wrong decision leaves a reachable
# machine rather than an unreachable one.

- name: Set GPU passthrough availability flag
  set_fact:
    gpu_passthrough_available: >-
      {{ passthrough_audit.assessable
         and (passthrough_audit.bind_addresses | length) > 0 }}
  tags: gpu_passthrough

- name: Determine IOMMU kernel parameter for this CPU vendor
  set_fact:
    iommu_cmdline_param: >-
      {{ 'amd_iommu=on iommu=pt'
         if 'AuthenticAMD' in (ansible_processor | join(' '))
         else 'intel_iommu=on iommu=pt' }}
  tags:
    - gpu_passthrough
    - rescue_boot

# ============================================
# IOMMU enablement — the one reboot-requiring change
# ============================================

- name: Remove any vendor-ID vfio binding from the GRUB command line
  become: yes
  replace:
    path: /etc/default/grub
    regexp: '\s*vfio-pci\.(ids|disable_vga)=[^\s"]*'
    replace: ''
  register: grub_vfio_removed
  tags: gpu_passthrough

- name: Enable the IOMMU on the GRUB command line
  become: yes
  shell:
    cmd: |
      set -euo pipefail
      line=$(grep '^GRUB_CMDLINE_LINUX_DEFAULT=' /etc/default/grub | sed 's/^GRUB_CMDLINE_LINUX_DEFAULT="//; s/"$//')
      original="${line}"
      for token in {{ iommu_cmdline_param }}; do
        case " ${line} " in
          *" ${token} "*) ;;
          *) line="${line} ${token}" ;;
        esac
      done
      line=$(echo "${line}" | tr -s ' ' | sed 's/^ *//; s/ *$//')
      if [ "${line}" = "${original}" ]; then
        echo "UNCHANGED ${line}"
        exit 0
      fi
      sed -i "s|^GRUB_CMDLINE_LINUX_DEFAULT=.*|GRUB_CMDLINE_LINUX_DEFAULT=\"${line}\"|" /etc/default/grub
      echo "CHANGED ${line}"
    executable: /bin/bash
  register: grub_iommu_result
  # The script reports its own outcome rather than having Ansible re-derive it
  # by comparing a before-image: a changed_when that parses the file twice can
  # disagree with what the script actually did.
  changed_when: grub_iommu_result.stdout is search('^CHANGED')
  tags: gpu_passthrough

# ============================================
# vfio modules and host driver blacklists
# ============================================

- name: Load the vfio modules at boot
  become: yes
  copy:
    dest: /etc/modules-load.d/vfio.conf
    content: |
      vfio
      vfio_iommu_type1
      vfio_pci
    mode: '0644'
  register: vfio_modules_configured
  when: gpu_passthrough_available
  tags: gpu_passthrough

- name: Remove vendor-ID vfio binding from modprobe configuration
  become: yes
  file:
    path: /etc/modprobe.d/vfio.conf
    state: absent
  register: vfio_modprobe_removed
  tags: gpu_passthrough

# The blacklists are what make the runtime unbind uncontested: with no host
# driver holding the card, vfio-bind.service does not have to wrestle a driver
# that may be in use. They are written whenever any GPU is bindable, rather
# than only when a particular vendor's GPU is present, because a mixed-vendor
# host still needs both.
- name: Blacklist host NVIDIA drivers
  become: yes
  copy:
    dest: /etc/modprobe.d/blacklist-nvidia.conf
    content: |
      blacklist nouveau
      blacklist nvidia
      blacklist nvidia_drm
      blacklist nvidia_modeset
      blacklist nvidia_uvm
      options nouveau modeset=0
    mode: '0644'
  register: nvidia_blacklisted
  when: gpu_passthrough_available
  tags: gpu_passthrough

- name: Blacklist host AMD GPU drivers
  become: yes
  copy:
    dest: /etc/modprobe.d/blacklist-amd.conf
    content: |
      blacklist amdgpu
      blacklist radeon
    mode: '0644'
  register: amd_blacklisted
  when: gpu_passthrough_available
  tags: gpu_passthrough

# A blacklist in /etc/modprobe.d has no effect on a module the initramfs loads
# before the root filesystem is mounted, so the rebuild is what makes the
# blacklist real.
- name: Update initramfs
  become: yes
  command: update-initramfs -u -k all
  when: >-
    grub_iommu_result.changed
    or grub_vfio_removed.changed
    or vfio_modules_configured.changed
    or vfio_modprobe_removed.changed
    or nvidia_blacklisted.changed
    or amd_blacklisted.changed
  register: initramfs_updated
  tags: gpu_passthrough

- name: Update GRUB
  become: yes
  command: update-grub
  when: grub_iommu_result.changed or grub_vfio_removed.changed
  tags: gpu_passthrough

# ============================================
# Address-scoped binding, applied after boot
# ============================================

- name: Create the vfio bind state directory
  become: yes
  file:
    path: "{{ vfio_bind_state_path | dirname }}"
    state: directory
    mode: '0755'
  tags: gpu_passthrough

# The bind list is data the unit reads, not code it embeds, so re-running the
# role after a topology change rewrites a file rather than a script.
- name: Write the vfio bind list
  become: yes
  copy:
    dest: "{{ vfio_bind_state_path }}"
    content: |
      # PCI addresses bound to vfio-pci by vfio-bind.service.
      # Every address here was reported bindable by the passthrough audit:
      # its entire IOMMU group is this card and its own functions.
      {% for address in passthrough_audit.bind_addresses %}
      {{ address }}
      {% endfor %}
    mode: '0644'
  register: vfio_bind_list
  tags: gpu_passthrough

- name: Install the vfio bind script
  become: yes
  template:
    src: vfio-bind.sh.j2
    dest: "{{ vfio_bind_script_path }}"
    mode: '0755'
  register: vfio_bind_script
  tags: gpu_passthrough

- name: Install the vfio bind service
  become: yes
  template:
    src: vfio-bind.service.j2
    dest: /etc/systemd/system/vfio-bind.service
    mode: '0644'
  register: vfio_bind_unit
  tags: gpu_passthrough

- name: Enable the vfio bind service
  become: yes
  systemd:
    name: vfio-bind
    enabled: yes
    daemon_reload: yes
  tags: gpu_passthrough

# No ignore_errors: a failed bind must be visible. It leaves a running,
# reachable host with one fewer passthrough device, which is a condition worth
# reporting rather than absorbing.
- name: Apply the vfio bindings
  become: yes
  systemd:
    name: vfio-bind
    state: restarted
  when:
    - gpu_passthrough_available
    - not initramfs_updated.changed
  tags: gpu_passthrough

- name: Report GPU passthrough state
  debug:
    msg:
      - "=== GPU passthrough ==="
      - "Bindable GPUs: {{ passthrough_audit.gpus | selectattr('bindable') | list | length }} of {{ passthrough_audit.gpus | length }}"
      - "Skipped GPUs: {{ passthrough_audit.gpus | rejectattr('bindable') | map(attribute='address') | list }}"
      - "Addresses bound to vfio-pci: {{ passthrough_audit.bind_addresses }}"
      - >-
        {% if initramfs_updated.changed %}
        A reboot is required to enable the IOMMU. Binding is applied by
        vfio-bind.service after that reboot; it is not part of the boot
        configuration and cannot make this host unreachable.
        {% else %}
        Bindings applied without a reboot.
        {% endif %}
      - >-
        {% if not passthrough_audit.assessable %}
        WARNING: passthrough could not be assessed and no device was bound.
        {% elif (passthrough_audit.bind_addresses | length) == 0 %}
        WARNING: this host has no passthrough-capable GPU. It was prepared
        successfully and provides no GPU capacity.
        {% endif %}
  tags: gpu_passthrough
