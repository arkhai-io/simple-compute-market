[project]
name = "arkhai-vms-provisioning-operator-client"
version = "0.9.1"
license = "MIT"
description = "VM's provisioning route declarations, wire models, and typed client."
requires-python = ">=3.12"
dependencies = [
    # The family's wire contract, for the job responses VM's operations return.
    # The transport is the family client, which a caller supplies.
    "arkhai-compute-provisioning-contracts>=0.9.0",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vm_provisioning_operator"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
