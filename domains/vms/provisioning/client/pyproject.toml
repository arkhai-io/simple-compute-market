[project]
name = "arkhai-vms-provisioning-operator-client"
version = "0.3.0"
license = "MIT"
description = "VM provisioning operator client and direct VM administration models."
requires-python = ">=3.12"
dependencies = [
    "arkhai-compute-provisioning>=0.6.0",
    "arkhai-kit-identity==0.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vm_provisioning_operator"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
