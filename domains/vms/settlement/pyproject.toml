[project]
name = "arkhai-vms-settlement"
version = "0.4.0"
license = "MIT"
description = "VM settlement terms, proposals, and fulfillment helpers, shared by the VM storefront and buyer."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-vms-listings>=0.4.1",
    "arkhai-kit-alkahest>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_vms_settlement"]
