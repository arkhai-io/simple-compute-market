[project]
name = "arkhai-apicredits-domain"
version = "0.10.0"
license = "MIT"
description = "Shared API-credit domain models, policies, and market-domain contract."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-api>=0.1.0",
    "arkhai-api-contracts>=0.3.0",
    "arkhai-core>=0.4.0",
    "arkhai-kit-policy",
    "arkhai-kit-alkahest>=0.7.0",
    "httpx>=0.27",
    "pydantic>=2",
    "arkhai-kit-settlement-runtime>=0.4.0",
    "arkhai-kit-arkhai-payments>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_apicredits"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # `schema` is a wire key of the vocabulary's issuance and evidence models;
    # see the vocabulary's pyproject.
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.issuance",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.evidence",
    "ignore:Field name \"schema\" in \"Issuance(Request|Result|Response)\" shadows an attribute in parent:UserWarning:pydantic.main",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
    # The principals the pin and trust-pin tests build. Test-only.
    "arkhai-kit-identity==0.4.0",
]
