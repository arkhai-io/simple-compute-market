[project]
name = "arkhai-apicredits-domain"
version = "0.5.0"
license = "MIT"
description = "Shared API-credit domain models, policies, and market-domain contract."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-core>=0.4.0",
    "arkhai-kit-policy",
    "arkhai-kit-alkahest>=0.4.0",
    "arkhai-kit-identity==0.4.0",
    "httpx>=0.27",
    "pydantic>=2",
    "arkhai-kit-settlement-runtime>=0.4.0",
    "arkhai-kit-arkhai-payments>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_apicredits"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # Three contract models carry a field named `schema`, which shadows
    # Pydantic's deprecated `BaseModel.schema()`. The name is the wire key: it
    # is serialized into HTTP request bodies and into the canonical JSON that
    # issuance evidence is digested and signed over, so renaming it is a
    # contract change rather than a rename, and every `model_dump` call would
    # have to start passing `by_alias=True` in step or the emitted key changes
    # silently. Scoped to these two modules so the same shadow appearing
    # anywhere else still surfaces.
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_apicredits.settlement.credits_client",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_apicredits.settlement.issuance_evidence",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
]
