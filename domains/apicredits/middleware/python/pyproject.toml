[project]
name = "arkhai-apicredits-middleware"
version = "0.1.0"
license = "MIT"
description = "Seller-side ASGI middleware gating a downstream app on prepaid API credits from the arkhai credits service."
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27",
]

# Signed authentication to the credits service. Optional because this
# package is embedded in third-party seller applications: an unsigned
# deployment keeps the httpx-only dependency set, and `market_identity`
# is pulled in only where the credits service requires signed requests.
# `GateConfig.build_signing()` reports a missing install as configuration.
[project.optional-dependencies]
signed = [
  "arkhai-kit-identity",
]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]


[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apicredits_middleware"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
