# ---------------------------------------------------------------------------
# API-credits service base defaults.
# This file documents all supported configuration keys and their defaults.
# Do NOT put environment-specific values here.
#
# Override via (highest priority first):
#   1. APICREDITS_* environment variables
#   2. config/config-<profile>.yml  (selected by ACTIVE_PROFILES)
#   3. config/config.yml
#   4. This file
# ---------------------------------------------------------------------------

# HTTP server
host = "0.0.0.0"
port = 8082
log_level = "info"

# Database
# Defaults to SQLite so a fresh checkout works without any setup.
database_url = "sqlite:///apicredits.db"

# Shared secret gating every non-health request (X-Admin-Key). Production
# deployments select storefront_admin_key_file; an inline value remains an
# explicit local-process option and cannot be combined with the file.
storefront_admin_key = ""
storefront_admin_key_file = ""
