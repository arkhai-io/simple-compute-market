[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arkhai-apicredits-service"
version = "0.8.1"
license = "MIT"
description = "API-credits service: keys, credit grants, consumption, and the site quota ledger"
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-injected-time>=0.1.0",
    # The first version exporting the site-declaration reader its tests read the
    # projection through.
    "arkhai-kit-resource-pools-contracts>=0.5.0",
    # The first versions exporting the site's pool-facts port and the pool
    # authority's reader answering it, which this service composes.
    "arkhai-kit-site>=0.15.0",
    "arkhai-kit-resource-pools>=0.11.0",
    "arkhai-kit-identity==0.5.0",
    "arkhai-kit-schema-migrations[sqlalchemy]>=0.1.0",
    "dynaconf>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
]

[project.scripts]
apicredits-service-migrate = "apicredits_service.db.migrate:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
    "httpx>=0.28.1",
    # Test-only, and deliberately in this direction. This service's signed
    # boundary is worth proving against the clients that actually call it
    # rather than against a signer hand-rolled in the test: a test that
    # builds the envelope the way the server expects cannot see the two
    # sides disagreeing, which is exactly how the query-canonicalization
    # defect survived. Neither package is a runtime dependency.
    "arkhai-apicredits-middleware[signed]",
    "arkhai-apicredits-domain>=0.10.0",
    # The capacity half of this service's own boundary. Credits are backed by
    # declared capacity, so the canonical-client test has to register a quota
    # resource before an issuance can succeed -- and registering it through
    # the client a seller actually uses is the point of that test.
    "arkhai-kit-site-client",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src/apicredits_service"]
