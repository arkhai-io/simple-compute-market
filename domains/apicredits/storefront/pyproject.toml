[project]
name = "arkhai-apicredits-storefront"
version = "0.2.0"
license = "MIT"
description = "Seller-side storefront for the API-credits domain: quota-backed listings, sync negotiation with ownership/quota guards, issuance-backed settlement."
requires-python = ">=3.12"
dependencies = [
    "arkhai-core>=0.2.0",
    "arkhai-apicredits-domain>=0.1.0",
    "arkhai-core-registry-client>=0.11.0",
    "arkhai-core-storefront>=0.3.0",
    "arkhai-kit-capacity-publication==0.1.0",
    "arkhai-kit-alkahest",
    "arkhai-kit-config",
    "arkhai-kit-identity==0.3.0",
    "arkhai-kit-policy",
    "arkhai-kit-settlement-runtime>=0.1.0",
    "arkhai-kit-site-client>=0.2.0",
    "alkahest-py==1.1.2",
    "fastapi~=0.115.8",
    # [all] carries typing-inspect, which fastapi_utils.cbv imports
    # unconditionally under pydantic v2.
    "fastapi-utils[all]>=0.8.0",
    "uvicorn~=0.34.0",
    "httpx>=0.27",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "dynaconf>=3.0.0",
]

[project.scripts]
apicredits-storefront = "apicredits_storefront.cli:app"

[project.entry-points."market.storefront_domains"]
apicredits = "apicredits_storefront.domain_runtime:APICREDITS_STOREFRONT_DOMAIN"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
]

[tool.uv]
# Internal wheels come from the repo's .dist/ via the CLI flag — see the
# VM storefront's pyproject for why no find-links entry lives here.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/apicredits_storefront"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
