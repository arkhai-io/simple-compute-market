[project]
name = "arkhai-apicredits-storefront"
version = "0.15.0"
license = "MIT"
description = "Seller-side storefront for the API-credits domain: quota-backed listings, sync negotiation with ownership/quota guards, issuance-backed settlement."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-core>=0.4.0",
    "arkhai-api-client>=0.1.0",
    "arkhai-api-selling>=0.4.0",
    "arkhai-api-selling-alkahest>=0.1.0",
    "arkhai-api-selling-arkhai-payments>=0.1.0",
    "arkhai-apicredits-domain>=0.11.0",
    "arkhai-core-storefront>=0.18.0",
    "arkhai-kit-alkahest>=0.8.0",
    "arkhai-kit-config>=0.4.0",
    "arkhai-kit-identity==0.4.0",
    "arkhai-kit-settlement-runtime>=0.4.0",
    "arkhai-kit-storefront==0.8.0",
    "arkhai-kit-negotiation-runtime==0.6.0",
    "alkahest-py==1.1.2",
    "fastapi~=0.115.8",
    # [all] carries typing-inspect, which fastapi_utils.cbv imports
    # unconditionally under pydantic v2.
    "fastapi-utils[all]>=0.8.0",
    "uvicorn~=0.34.0",
    "httpx>=0.27",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "dynaconf>=3.0.0",
    "arkhai-core-storefront-client>=0.27.0",
]

[project.scripts]
apicredits-storefront = "apicredits_storefront.cli:app"

[project.entry-points."market.storefront_domains"]
apicredits = "apicredits_storefront.domain_runtime:APICREDITS_STOREFRONT_DOMAIN"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
    # The production `market credits negotiate` and `market credits buy`
    # commands, which the negotiation integration tests drive against the
    # served storefront. Test-only; production code never imports it.
    "arkhai-apicredits-buyer>=0.5.0",
    # Buyer orchestration and identity types the same tests drive and stand in
    # for directly: run results and the run log, the publisher-trust refresh,
    # the resolved buyer identity, and registry authorities. Test-only.
    "arkhai-core-buyer>=0.5.0",
    # The resolved pool declarations the listing-binding helper binds listings under. Test-only.
    "arkhai-kit-resource-pools>=0.7.0",
    # The thread store and the quota site's client the negotiation and
    # publication tests stand up. Test-only.
    "arkhai-kit-policy>=0.5.0",
    "arkhai-kit-site-client>=0.9.0",
    # The site event cycle and reconcile context the lifecycle and publication
    # tests drive. Test-only.
    "arkhai-kit-capacity-publication>=0.10.4",
    # The issuance result and evidence models the settlement tests build. Test-only.
    "arkhai-api>=0.1.0",
    # The payment configuration, fake payments client, and receipts the payment
    # tests build. Test-only.
    "arkhai-kit-arkhai-payments>=0.3.0",
]

[tool.uv]
# Internal wheels come from the repo's .dist/ via the CLI flag — see the
# VM storefront's pyproject for why no find-links entry lives here.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/apicredits_storefront"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
