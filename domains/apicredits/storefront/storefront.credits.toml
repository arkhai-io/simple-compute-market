# API-credits seller — local docker-compose stack.
# Anvil default account #3; deterministic local chain. DO NOT use these
# keys on any public network.
#
# Mounted into the credits-storefront container at
# /etc/arkhai/storefront.toml (XDG_CONFIG_HOME=/etc).

agent_id      = "tokenseller"
port          = 8000
base_url      = "http://credits-storefront:8000/"
db_path       = "/app/data/storefront.db"

[identity]
scheme     = "eip191"
identifier = "0x90f79bf6eb2c4f870365e785982e1f101e93b906"

[identity.admin_principals]
identities = [
  { scheme = "eip191", identifier = "0x90f79bf6eb2c4f870365e785982e1f101e93b906" },
]

[wallet]
address     = "0x90F79bf6EB2c4f870365E785982E1f101E93b906"
private_key = "" # APICREDITS_STOREFRONT_WALLET__PRIVATE_KEY secret environment input

[chains.anvil]
rpc_url  = "ws://anvil:8545"
chain_id = 31337
# The same Alkahest address book the VM storefront uses (one anvil
# deployment), bind-mounted into this container.
alkahest_address_config_path = "/app/alkahest_anvil_addresses.json"

[registry]
# Only the api-credits registry: this seller's listings speak the
# api_credits schema, and the buyer plugin's schema filter routes its
# discovery to this registry. (The public vms.compute registry is also
# in the buyer's config — that's what makes the schema filter
# load-bearing.)
urls              = ["http://api-credits-registry:8080"]
discovery_timeout = 5.0

[registry.authorities."http://api-credits-registry:8080"]
authority = "api-credits-registry"
identities = [
  { scheme = "ed25519", identifier = "skkdlQKuKGMKK6yy4MdFEP_N0yjDNP8-E5PnWy0x59w" },
]

[credits]
# The credits service this storefront sells for. It hosts the quota ledger
# selected explicitly below and the separate issuance/keys mechanism API.
service_url         = "http://credits-service:8082"
admin_key_file      = "/run/secrets/arkhai/api-credits-admin-key"
preflight_timeout   = 60
fail_on_unreachable = true

[capacity]
# Poll fast — the suite waits on delta-driven listing reconciliation.
poll_interval = 1
seed_site     = "default"
# Deliberately overrides the shipped default of 0; see storefront.bob.toml.
# Local compose profile with no untrusted buyers, kept on so the
# two-phase reserve path stays under e2e coverage.
hold_ttl_seconds = 900

[capacity.sites.default]
url = "http://credits-service:8082"

[capacity.sites.default.expected_authorities]
identities = [
  { scheme = "ed25519", identifier = "My6-jSfLcyOzpAHBwTtd1kvMwOEOzaHCtdEaA3eaheU" },
]

[negotiation]
# Empty: the API-credits guards (api_credits_round_zero_guard,
# buyer_counter_guard, credit_quota_guard, key_owned_by_buyer_principal,
# escrow_shape_guard) prepend automatically; the terminal default is
# listed_price.
policies = []

[pricing]
# Fallback only — the seeded listing carries its own per-token rate.
default_min_price = "1"

[seed]
# Demo self-seed (e2e): on startup, register this quota resource in the
# credits-service ledger and publish a listing from it, so a fresh
# `compose up` has something to discover. The listing's base_url points
# at the gated sample app the buyer will consume.
resource_id     = "weather-quota"
total_units     = 100
service_name    = "weather-api"
price_per_token = "1"
token           = "0x9fe46736679d2d9a65f0992f2272de9f3c7fa6e0"
chain           = "anvil"
base_url        = "http://sample-app:8085"
openapi_url     = "http://sample-app:8085/openapi.json"
description     = "Prepaid weather-API credits"
