[project]
name = "arkhai-apicredits-sample-app"
version = "0.1.1"
license = "MIT"
description = "Minimal token-gated HTTP service for the API-credits e2e topology."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  # The `signed` extra pulls in arkhai-kit-identity, which the gate needs
  # to sign its calls to the credits service. Required because that service
  # now authenticates every route against a signed envelope; without the
  # extra the gate raises a configuration error naming the missing install.
  "arkhai-apicredits-middleware[signed]",
  # The process's time source, which the gate signs by, and the lane doubles'
  # time control the app serves under injected time.
  "arkhai-injected-time>=0.1.0",
  "lane-double-controls>=0.1.0",
]

[project.scripts]
apicredits-sample-app = "apicredits_sample_app.app:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27",
  # The time-control suite's stand-in credits service verifies and signs as the
  # service does.
  "arkhai-kit-identity>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apicredits_sample_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
