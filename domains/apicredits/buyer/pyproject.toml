[project]
name = "arkhai-apicredits-buyer"
version = "0.8.0"
license = "MIT"
description = "API-credits buyer schema plugin for the core `market` CLI: discover credit listings, negotiate quantity x rate, settle into issued keys."
requires-python = ">=3.12,<3.14"
dependencies = [
  "typer>=0.12.0",
  "arkhai-api-buying>=0.3.0",
  "arkhai-api-buying-alkahest>=0.2.0",
  "arkhai-api-buying-arkhai-payments>=0.1.2",
  "arkhai-apicredits-domain>=0.12.0",
  "arkhai-core-buyer>=0.5.0",
  "arkhai-core>=0.4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

# The `market` console script ships from arkhai-core-buyer; this package
# contributes the validated API-credit market-domain contract.
[project.entry-points."market.buyer_domains"]
apicredits = "arkhai_apicredits_buyer.cli:domain"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  # The configuration, identity, mechanism, and policy types the CLI tests build. Test-only.
  "arkhai-kit-alkahest>=0.8.0",
  "arkhai-kit-config>=0.4.0",
  "arkhai-kit-identity==0.4.0",
  "arkhai-kit-policy>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_apicredits_buyer"]

[tool.pytest.ini_options]
