[project]
name = "arkhai-apicredits-buyer"
version = "0.2.0"
license = "MIT"
description = "API-credits buyer schema plugin for the core `market` CLI: discover credit listings, negotiate quantity x rate, settle into issued keys."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "eth-account>=0.13.0",
  # Needed by the buy/settle path for in-process on-chain escrow
  # creation. Imported lazily from core_buyer.escrow_client so loading
  # the CLI does not pay the native-binary cost unless a deal settles.
  "alkahest-py==1.1.2",
  "arkhai-core-buyer>=0.2.0",
  "arkhai-core>=0.2.0",
  "arkhai-apicredits-domain>=0.1.0",
  "arkhai-kit-alkahest",
  "arkhai-kit-config",
  "arkhai-kit-policy",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

# The `market` console script ships from arkhai-core-buyer; this package
# contributes the validated API-credit market-domain contract.
[project.entry-points."market.buyer_domains"]
apicredits = "domains.apicredits.buyer.cli:domain"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py"]

# Shared schema, listing, negotiation, settlement, and contract modules are
# owned by arkhai-apicredits-domain; this wheel owns only buyer-role modules.
[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "domains/apicredits/buyer/__init__.py"
"buy_cli.py" = "domains/apicredits/buyer/buy_cli.py"
"cli.py" = "domains/apicredits/buyer/cli.py"
"cli_helpers.py" = "domains/apicredits/buyer/cli_helpers.py"
"common.py" = "domains/apicredits/buyer/common.py"
"listing_cli.py" = "domains/apicredits/buyer/listing_cli.py"
"negotiate_cli.py" = "domains/apicredits/buyer/negotiate_cli.py"
"settle_cli.py" = "domains/apicredits/buyer/settle_cli.py"

[tool.pytest.ini_options]
pythonpath = ["."]
