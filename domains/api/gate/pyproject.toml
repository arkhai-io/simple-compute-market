[project]
name = "arkhai-api-gate"
version = "0.1.0"
license = "MIT"
description = "The api family's bearer gate: ASGI middleware gating a downstream app on prepaid credits verified and consumed at the family authority."
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27",
]

# Signed authentication to the authority. Optional because this package is
# embedded in third-party seller applications: an unsigned deployment keeps
# the httpx-only dependency set, and `market_identity` is pulled in only where
# the authority requires signed requests. `GateConfig.build_signing()` reports
# a missing install as configuration.
[project.optional-dependencies]
signed = [
  "arkhai-kit-identity",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  # The parity test holds the gate's local spelling of the routes it calls
  # equal to the contracts' declarations; the gate itself never imports them.
  "arkhai-api-contracts>=0.4.0",
  # The signing tests build responses with the identity kit directly.
  "arkhai-kit-identity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_api_gate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # `schema` is the issuance and evidence wire key; see the vocabulary's pyproject.
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.issuance",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.evidence",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api_contracts.models",
]

# The package allowlist: every distribution this package may declare or import
# beyond the standard library, because its lightness is part of its contract.
# make check-architecture holds it; see docs/development/ARCHITECTURE.md, "Kind".
[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-kit-identity", "httpx"]
