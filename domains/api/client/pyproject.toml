[project]
name = "arkhai-api-client"
version = "0.1.0"
license = "MIT"
description = "The api family authority's typed client, binding and signing each request from the contracts' route declarations."
requires-python = ">=3.12,<3.14"
# The contracts, the identity kit, and an HTTP library: a caller signs and
# verifies against the authority without installing the authority.
dependencies = [
    "arkhai-api-contracts>=0.1.0",
    "arkhai-kit-identity>=0.4.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_api_client"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # `schema` is the issuance request's and result's wire key; see the vocabulary's pyproject.
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.issuance",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.evidence",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api_contracts.models",
    # The label-bound subclasses are built by create_model, so pydantic attributes the same shadow to itself.
    "ignore:Field name \"schema\" in \"Issuance(Request|Result|Response)\" shadows an attribute in parent:UserWarning:pydantic.main",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
    # The tests build issuance requests from the vocabulary; the client itself reads it through contracts.
    "arkhai-api>=0.1.0",
]

# The package allowlist: every distribution this package may declare or import
# beyond the standard library, because its lightness is part of its contract.
# make check-architecture holds it; see docs/development/ARCHITECTURE.md, "Kind".
[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-api-contracts", "arkhai-kit-identity", "httpx"]
