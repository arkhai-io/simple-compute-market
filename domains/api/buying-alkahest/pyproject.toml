[project]
name = "arkhai-api-buying-alkahest"
version = "0.2.0"
license = "MIT"
description = "The api family's buyer-side Alkahest library: the buyer's escrow stage, escrow selection, the escrow codec, and escrow creation."
requires-python = ">=3.12,<3.14"
dependencies = [
    # Imported only when an escrow is created, so loading the CLI does not pay
    # its native-binary cost unless a deal settles.
    "alkahest-py==1.1.2",
    "arkhai-api-buying>=0.3.0",
    "arkhai-core-buyer>=0.5.0",
    "arkhai-kit-alkahest>=0.8.0",
    "arkhai-kit-config>=0.4.0",
    "arkhai-kit-identity>=0.4.0",
    "arkhai-kit-policy>=0.5.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_api_buying_alkahest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
