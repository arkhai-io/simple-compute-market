[project]
name = "arkhai-api"
version = "0.1.0"
license = "MIT"
description = "The api family's vocabulary: the prepaid bearer-access purchase shape, issuance identities and digests, and signed issuance evidence, bound by every API-selling domain."
requires-python = ">=3.12,<3.14"
# A family vocabulary depends only on foundation kits, so a domain binds it
# without installing core, a role, or the family kit.
dependencies = [
    "arkhai-kit-identity>=0.4.0",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # `schema` is the wire key of the issuance request, result, and portable
    # reference, and the key the evidence digest is computed over, so the field
    # keeps the name that shadows Pydantic's deprecated `BaseModel.schema()`.
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.issuance",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.evidence",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# The package allowlist: every distribution this package may declare or import
# beyond the standard library, because its lightness is part of its contract.
# make check-architecture holds it; see docs/development/ARCHITECTURE.md, "Kind".
[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-kit-identity", "pydantic"]
