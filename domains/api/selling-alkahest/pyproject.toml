[project]
name = "arkhai-api-selling-alkahest"
version = "0.1.0"
license = "MIT"
description = "The api family's selling-side Alkahest library: the seller's escrow stage, the accepted escrow artifacts and negotiation step, publication's release conditions, and the escrow lifecycle contributions."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-api-selling>=0.4.0",
    "arkhai-core>=0.4.0",
    "arkhai-kit-alkahest>=0.8.0",
    "arkhai-kit-identity>=0.4.0",
    "arkhai-kit-negotiation-runtime>=0.6.0",
    "arkhai-kit-settlement-runtime>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_api_selling_alkahest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # `schema` is the issuance and evidence wire key; see the vocabulary's pyproject.
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.issuance",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.evidence",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api_contracts.models",
    "ignore:Field name \"schema\" in \"Issuance(Request|Result|Response)\" shadows an attribute in parent:UserWarning:pydantic.main",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
    # The vocabulary's issuance and purchase models, the authority client's
    # error, and the transport errors the stage tests build. Test-only.
    "arkhai-api>=0.1.0",
    "arkhai-api-client>=0.1.0",
    "httpx>=0.27",
    "pydantic>=2",
]
