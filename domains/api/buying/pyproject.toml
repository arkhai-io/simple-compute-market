[project]
name = "arkhai-api-buying"
version = "0.2.0"
license = "MIT"
description = "The api family's buying library: the buyer's listing, buy, negotiate, and settle commands, the negotiation guards, and the settlement composition over each domain's contribution bundle and stage table."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-api>=0.1.0",
    "arkhai-core>=0.4.0",
    "arkhai-core-buyer>=0.5.0",
    "arkhai-kit-config>=0.4.0",
    "arkhai-kit-identity>=0.4.0",
    "arkhai-kit-policy>=0.5.0",
    "arkhai-kit-settlement-runtime>=0.4.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_api_buying"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
