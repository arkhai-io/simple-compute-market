[project]
name = "arkhai-api-authority"
version = "0.1.0"
license = "MIT"
description = "The api family's authority library: the key service and prepaid ledger, quota as capacity, persistence and migrations, framework-free route services, and the route-declaration adapter, composed by each domain's service root."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-api>=0.1.0",
    "arkhai-api-contracts>=0.1.0",
    "arkhai-kit-identity>=0.4.0",
    "arkhai-kit-resource-pools>=0.3.0",
    "arkhai-kit-resource-pools-contracts>=0.2.0",
    "arkhai-kit-site>=0.10.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_api_authority"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # `schema` is the issuance request's and result's wire key; see the vocabulary's pyproject.
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.issuance",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api.evidence",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_api_contracts.models",
    "ignore:Field name \"schema\" in \"Issuance(Request|Result|Response)\" shadows an attribute in parent:UserWarning:pydantic.main",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
