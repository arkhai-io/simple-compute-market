[project]
name = "arkhai-api-buying-arkhai-payments"
version = "0.1.2"
license = "MIT"
description = "The api family's buyer-side Arkhai payments library: the buyer's payment stage, payer selection, and mandate approval."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-api-buying>=0.3.0",
    "arkhai-core>=0.4.0",
    "arkhai-core-buyer>=0.5.0",
    "arkhai-kit-arkhai-payments>=0.3.0",
    "arkhai-kit-config>=0.4.0",
    "arkhai-kit-settlement-runtime>=0.4.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_api_buying_arkhai_payments"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
