[project]
name = "arkhai-bare-metal-storefront"
version = "0.22.0"
license = "MIT"
description = "Seller-side storefront composition for the Arkhai bare-metal domain."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-compute-provisioning-contracts>=0.9.0",
    "arkhai-kit-resource-pools-contracts>=0.2.0",
    "arkhai-bare-metal>=0.13.0",
    "arkhai-kit-delivery==0.2.1",
    "arkhai-kit-delivery-apprise==0.1.1",
    "arkhai-kit-contact-exchange==0.4.0",
    "arkhai-compute-provisioning-client>=0.7.0",
    "arkhai-core>=0.4.0",
    "arkhai-core-registry-client>=0.12.1",
    "arkhai-core-storefront>=0.16.0",
    "arkhai-core-storefront-client>=0.25.0",
    "arkhai-kit-alkahest>=0.10.0",
    "arkhai-kit-config>=0.4.0",
    "arkhai-kit-negotiation-runtime==0.5.2",
    "arkhai-kit-policy>=0.6.0",
    "arkhai-kit-identity==0.4.0",
    "arkhai-kit-site-client>=0.11.0",
    "arkhai-kit-capacity-publication==0.11.0",
    "arkhai-kit-pool-overrides==0.2.1",
    "arkhai-kit-resource-pools>=0.7.0",
    "arkhai-kit-arkhai-payments==0.3.0",
    "arkhai-kit-settlement-runtime>=0.5.0",
    "arkhai-kit-storefront==0.9.0",
    "dynaconf>=3.0.0",
    "fastapi~=0.115.8",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12.0",
    "uvicorn~=0.34.0",
]

[project.scripts]
bare-metal-storefront = "arkhai_bare_metal_storefront.cli:app"

[project.entry-points."market.storefront_contributions"]
bare_metal = "arkhai_bare_metal_storefront.contribution:BARE_METAL_STOREFRONT_CONTRIBUTION"

[dependency-groups]
dev = [
    "arkhai-core-storefront-client>=0.27.0",
    "pytest>=8.3.4,<10.0.0",
    "pytest-asyncio>=0.25,<2.0",
    # The bare-metal fulfillment and introduction routes have typed clients only
    # in the buyer packages, so the storefront's tests drive those routes with the
    # production buyer's own clients; and they run the buyer's introduction and
    # purchase commands against the storefront, through the core buyer
    # application that composes them. Test-only; production code never imports
    # either.
    "arkhai-bare-metal-buyer>=0.6.0",
    "arkhai-core-buyer>=0.6.0",
    # The site's own claim predicate, which the claim and fulfillment-service
    # tests check the storefront's derived claims against. Test-only.
    "arkhai-kit-site>=0.10.0",
    # Validates documents against the generated Helm values schema.
    "jsonschema>=4.0",
]

[tool.uv]
# Internal wheels resolve from the repository's .dist/ through --find-links.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_bare_metal_storefront"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
