[project]
name = "arkhai-bare-metal-storefront"
version = "0.2.5"
license = "MIT"
description = "Seller-side storefront composition for the Arkhai bare-metal domain."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-bare-metal>=0.2.0",
    "arkhai-kit-delivery==0.1.0",
    "arkhai-kit-contact-exchange==0.1.2",
    "arkhai-compute-provisioning>=0.6.0",
    "arkhai-core>=0.2.0",
    "arkhai-core-storefront>=0.3.0",
    "arkhai-hosted-settlement-client==0.4.2",
    "arkhai-kit-alkahest",
    "arkhai-kit-policy",
    "arkhai-kit-identity==0.3.0",
    "arkhai-kit-hosted-settlement==0.1.4",
    "arkhai-kit-site-client>=0.2.0",
    "arkhai-kit-settlement-runtime>=0.1.0",
    "arkhai-kit-storefront==0.1.0",
    "fastapi~=0.115.8",
    "typer>=0.12.0",
    "uvicorn~=0.34.0",
]

[project.scripts]
bare-metal-storefront = "arkhai_bare_metal_storefront.cli:app"

[project.entry-points."market.storefront_contributions"]
bare_metal = "arkhai_bare_metal_storefront.contribution:BARE_METAL_STOREFRONT_CONTRIBUTION"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<10.0.0",
    "pytest-asyncio>=0.25,<2.0",
]

[tool.uv]
# Internal wheels resolve from the repository's .dist/ through --find-links.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_bare_metal_storefront"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
