[project]
name = "arkhai-bare-metal-provisioning-adapter"
version = "0.1.0"
license = "MIT"
description = "Bare-metal adapter for the compute provisioning service"
requires-python = ">=3.12"
dependencies = [
    "arkhai-bare-metal>=0.2.0",
    "arkhai-compute-provisioning>=0.5.0",
    "arkhai-compute-provisioning-service>=0.1.0",
    "arkhai-kit-fulfillment>=0.1.0",
    "arkhai-kit-resource-pools>=0.1.0",
    "arkhai-vms-provisioning-operator-client>=0.3.0",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bare_metal_provisioning_adapter"]

[dependency-groups]
dev = ["pytest>=9.0.2"]

[tool.uv.sources]
arkhai-bare-metal = { path = "../..", editable = true }
arkhai-compute-provisioning = { path = "../../../../provisioning/compute", editable = true }
arkhai-compute-provisioning-service = { path = "../../../../provisioning/compute/service", editable = true }
arkhai-vms-provisioning-operator-client = { path = "../../../vms/provisioning/client", editable = true }
