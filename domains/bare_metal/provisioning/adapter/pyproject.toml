[project]
name = "arkhai-bare-metal-provisioning-adapter"
version = "0.12.0"
license = "MIT"
description = "Bare-metal adapter for the compute provisioning service"
requires-python = ">=3.12"
dependencies = [
    "arkhai-compute-provisioning-contracts>=0.11.0",
    "arkhai-core>=0.4.0",
    "arkhai-bare-metal>=0.13.0",
    "arkhai-compute-provisioning>=0.20.0",
    "arkhai-compute-provisioning-ansible>=0.6.0",
    "arkhai-kit-fulfillment>=0.5.0",
    "arkhai-kit-resource-pools>=0.3.0",
    "pydantic>=2.7",
    # The routes this adapter binds.
    "fastapi>=0.115.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bare_metal_provisioning_adapter"]

[dependency-groups]
dev = [
    # The backing delegates and pool declarations the view tests build pool
    # contexts from.
    "arkhai-kit-resource-pools-contracts>=0.3.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
]

