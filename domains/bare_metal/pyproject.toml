[project]
name = "arkhai-bare-metal"
version = "0.2.0"
license = "MIT"
description = "Bare-metal market schema and domain vocabulary for Arkhai."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "arkhai-core>=0.2.0",
]

[project.optional-dependencies]
storefront = [
    "arkhai-core-storefront>=0.3.0",
]

[project.entry-points."market.storefront_domains"]
bare_metal = "arkhai_bare_metal.domain_runtime:BARE_METAL_MARKET_DOMAIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_bare_metal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "arkhai-core-storefront>=0.3.0",
    "pytest>=8.0",
]
