[project]
name = "arkhai-bare-metal"
version = "0.1.0"
license = "MIT"
description = "Bare-metal market schema and domain vocabulary for Arkhai."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
storefront = [
    "arkhai-core-storefront",
]

[project.entry-points."market.storefront_publication_sources"]
bare_metal = "arkhai_bare_metal.storefront_adapter:bare_metal_publication_adapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_bare_metal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "arkhai-core-storefront",
    "pytest>=8.0",
]
