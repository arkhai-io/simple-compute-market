[project]
name = "arkhai-bare-metal"
version = "0.1.0"
license = "MIT"
description = "Bare-metal market schema and domain vocabulary for Arkhai."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_bare_metal"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
