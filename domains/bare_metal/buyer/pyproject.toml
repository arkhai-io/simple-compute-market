[project]
name = "arkhai-bare-metal-buyer"
version = "0.1.4"
license = "MIT"
description = "Bare-metal buyer contribution for the core Arkhai market CLI."
requires-python = ">=3.12"
dependencies = [
    "arkhai-bare-metal>=0.2.0",
    "arkhai-core>=0.2.0",
    "arkhai-core-buyer==0.3.2",
    "arkhai-core-registry-client==0.11.0",
    "arkhai-hosted-settlement-client==0.4.0",
    "arkhai-kit-alkahest",
    "arkhai-kit-config",
    "arkhai-kit-contact-exchange==0.1.2",
    "arkhai-kit-delivery==0.1.0",
    "arkhai-kit-hosted-settlement==0.1.4",
    "arkhai-kit-identity==0.3.0",
    "arkhai-kit-policy",
    "arkhai-kit-settlement-runtime==0.1.2",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.entry-points."market.buyer_domains"]
bare-metal = "arkhai_bare_metal_buyer.plugin:domain"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_bare_metal_buyer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.3.4,<10.0.0"]
