[project]
name = "arkhai-bare-metal-buyer"
version = "0.5.0"
license = "MIT"
description = "Bare-metal buyer contribution for the core Arkhai market CLI."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-bare-metal>=0.10.0",
    "arkhai-core>=0.4.0",
    "arkhai-core-buyer==0.5.0",
    "arkhai-core-registry-client==0.12.2",
    "arkhai-kit-alkahest>=0.7.0",
    "arkhai-kit-contact-exchange==0.3.0",
    "arkhai-kit-arkhai-payments==0.3.0",
    "arkhai-kit-identity==0.4.0",
    "arkhai-kit-settlement-runtime==0.4.0",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.entry-points."market.buyer_domains"]
bare-metal = "arkhai_bare_metal_buyer.plugin:domain"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_bare_metal_buyer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.3.4,<10.0.0"]

# Internal distributions declared without an import, each with the runtime
# reason it is installed. make check-architecture warns on one without a reason.
[tool.arkhai.architecture.runtime-dependencies]
arkhai-kit-alkahest = "Installs Alkahest's named buyer aggregation policies, which the core buyer discovers through market.buyer_aggregation_policies."
