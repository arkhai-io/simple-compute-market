# Bare-metal seller domain stack.
#
# This stack runs the dedicated wheel-only storefront, one compute-family
# registry, and the ordinary selected-site provisioning authority. The
# provisioning service runs its container profile, real fulfillment with no
# test controller; a deployment's overlay appends its site profile, and the
# end-to-end lane's the run's mode, which may select the mock profile.
#
# This file holds topology only. The root compose.bare-metal.yml wrapper extends
# each service; a deployment's overlay (compose.bare-metal-local.yml for the
# lane) binds its identities, configuration and secret overlay, its registry
# and site profiles, and its host and pool definitions. Nothing here gives one a
# fallback, so without an overlay the registry, the site and the storefront
# refuse to start for want of them.

services:
  bare-metal-registry:
    image: arkhai:registry
    # The migration before the application, which refuses a database it has
    # not migrated.
    command: ["sh", "-c", "registry-migrate && exec uvicorn core_registry.main:app --host 0.0.0.0 --port 8080"]
    ports:
      - "${BARE_METAL_REGISTRY_PORT:-8080}:8080"
    env_file:
      - ../../core/registry/.env.docker-compose
    volumes:
      - ../../shared-env:/app/shared-env:ro
      - bare-metal-registry-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bare-metal-redis:
    image: redis:7-alpine
    volumes:
      - bare-metal-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  bare-metal-provisioning:
    image: arkhai:compute-provisioning
    platform: linux/amd64
    command: ["sh", "-c", "compute-provisioning-migrate && exec compute-provisioning-api"]
    depends_on:
      bare-metal-redis:
        condition: service_healthy
      bare-metal-registry:
        condition: service_healthy
    ports:
      - "${BARE_METAL_PROVISIONING_PORT:-8081}:8081"
    environment:
      # Real provisioning. The lane's overlay appends its site profile and the
      # run's mode, `mock` selecting the mock runner in place of Ansible and the
      # /test/* controls. Never mock in production.
      - ACTIVE_PROFILES=docker
      - PROVISIONING_DATABASE_URL=sqlite:////app/data/provisioning.db
      - REDIS_URL=redis://bare-metal-redis:6379
      - PROVISIONING_STOREFRONT_URL=http://bare-metal-storefront:8000
      - PROVISIONING_POOL_DEFINITIONS_PATH=/run/config/resource-pools.yaml
      # The site's host definitions document, reconciled at startup whenever
      # it changes, after the pool document whose pools its entries name.
      - PROVISIONING_HOST_DEFINITIONS_PATH=/run/config/host-definitions.yaml
    # Both definition documents, at the paths above, and the SSH key the site
    # reaches its hosts with, at /home/appuser/.ssh/id_ed25519, are the
    # deployment's, bound by its overlay.
    volumes:
      - ./provisioning/iac:/opt/domains/bare_metal/provisioning/iac:ro
      - bare-metal-provisioning-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  bare-metal-storefront:
    image: ${BARE_METAL_STOREFRONT_IMAGE:-arkhai:bare-metal-storefront}
    # The migration command runs before the storefront, which refuses a
    # database it has not migrated. Setting the entrypoint drops the image's
    # `serve` command, which this line restates.
    entrypoint: ["sh", "-c", "bare-metal-storefront-migrate && exec bare-metal-storefront serve"]
    depends_on:
      bare-metal-registry:
        condition: service_healthy
      bare-metal-provisioning:
        condition: service_healthy
    # 8000 here and in the healthcheck is the `port` the storefront's
    # configuration states (storefront.dev.toml in the lane); change them together.
    ports:
      - "${BARE_METAL_STOREFRONT_PORT:-8000}:8000"
    environment:
      # The storefront's one configuration-bearing variable: where its loader
      # finds the mounted files, $XDG_CONFIG_HOME/arkhai/ = /etc/arkhai/: the
      # operator's storefront.toml (sites, registries, settlement, terms) and its
      # secret overlay, both bound by the deployment's overlay. Every setting is
      # in those files, never in this environment.
      - XDG_CONFIG_HOME=/etc
    volumes:
      # The storefront's working directory; its database defaults to a file here.
      - bare-metal-storefront-data:/var/lib/arkhai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  bare-metal-registry-data:
  bare-metal-redis-data:
  bare-metal-provisioning-data:
  bare-metal-storefront-data:
