name: E2E

on:
  schedule:
    - cron: '0 7 * * *'   # nightly, ~07:00 UTC
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The docker-compose end-to-end suite, as two lanes in separate jobs so each
# failure's logs stand alone. Each builds the runtime + dev images, brings up its
# stack on a dev chain, and runs its scenarios from a one-shot container on its
# compose network. Far heavier than the per-push Tests workflow, so it runs
# nightly / on demand.
#
# - e2e-vm: the VM and API-credit markets together (`make test-e2e-vm`).
#   COMPOSE_PROJECT_NAME is pinned so its network is
#   `simple-market-service_default`, which the e2e Makefile's test-buyer-machine
#   target expects regardless of the checkout directory name. PROVISIONING_MODE
#   is mock (no real VM hosts).
# - e2e-bare-metal: one mock-profile site, the bare-metal storefront, its
#   registry, and the dev chain (`make test-e2e-bare-metal`). Its compose calls
#   pass their own project name, `simple-market-bare-metal`, overriding the pin.
env:
  COMPOSE_PROJECT_NAME: simple-market-service
  PROVISIONING_MODE: mock

jobs:
  e2e-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.17"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1   # matches FOUNDRY_VERSION in the Makefile
      - name: Build dev stack + run VM e2e scenarios
        # `make test-e2e-vm` = compose down -v -> build-dev (wheels, buyer CLI,
        # runtime/anvil/test images) -> compose up -d --wait -> run the e2e
        # markers from a one-shot container on the compose network.
        run: make -C e2e-tests test-e2e-vm
      - name: Collect compose logs
        if: always()
        # Same interpolation constraint as the teardown below. `tee` rather than
        # a plain redirect so the output lands in the job log as well as the
        # artifact -- a failure that needs a separate artifact download to
        # diagnose is a slow loop.
        run: |
          echo "::group::compose logs"
          make -s --no-print-directory e2e-dev-identities-env > .e2e-identities.env || true
          docker compose --env-file .e2e-identities.env -f docker-compose.yml -f compose.local-identities.yml \
            logs --no-color 2>&1 | tee compose-logs.txt || true
          echo "::endgroup::"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-vm-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        # `|| true` already keeps a cleanup failure from failing the job, but
        # without --env-file this down cannot even read the config: every
        # signer and token mount is a required-variable guard. The env file is
        # written by `make -C e2e-tests test-e2e-vm`; regenerate it here so
        # cleanup works even when the run failed before that point.
        run: |
          make -s --no-print-directory e2e-dev-identities-env > .e2e-identities.env || true
          docker compose --env-file .e2e-identities.env -f docker-compose.yml -f compose.local-identities.yml down -v --remove-orphans || true

  e2e-bare-metal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.17"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1   # matches FOUNDRY_VERSION in the Makefile
      - name: Build dev stack + run bare-metal e2e scenarios
        # Same flow as the VM lane over the bare-metal stack, with values from
        # `make e2e-bare-metal-dev-env`, which also generates the publication
        # deadlines for this run.
        run: make -C e2e-tests test-e2e-bare-metal
      - name: Collect compose logs
        if: always()
        # The env file must be the one the run used, since the deadlines it
        # carries are generated; regenerate it only if the run never wrote it.
        run: |
          echo "::group::compose logs"
          test -f .e2e-bare-metal.env || make -s --no-print-directory e2e-bare-metal-dev-env > .e2e-bare-metal.env || true
          docker compose --env-file .e2e-bare-metal.env -p simple-market-bare-metal \
            -f compose.bare-metal.yml -f compose.dev.yml -f compose.bare-metal-local.yml \
            logs --no-color 2>&1 | tee compose-logs.txt || true
          echo "::endgroup::"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bare-metal-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: |
          test -f .e2e-bare-metal.env || make -s --no-print-directory e2e-bare-metal-dev-env > .e2e-bare-metal.env || true
          docker compose --env-file .e2e-bare-metal.env -p simple-market-bare-metal \
            -f compose.bare-metal.yml -f compose.dev.yml -f compose.bare-metal-local.yml \
            down -v --remove-orphans || true
