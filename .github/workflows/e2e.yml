name: E2E

on:
  schedule:
    - cron: '0 7 * * *'   # nightly, ~07:00 UTC
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The docker-compose end-to-end suite, as four lanes, one market domain each,
# in separate jobs so each failure's logs stand alone and one domain's failure
# never hides another's evidence. Each lane builds only the images its stack
# runs, brings that stack up on its own dev chain, and runs its scenarios from
# a one-shot container on its compose network. Far heavier than the per-push
# Tests workflow, so it runs nightly / on demand.
#
# - e2e-vm: the VM market (`make -C e2e-tests test-e2e-vm`).
# - e2e-bare-metal: one site, the bare-metal storefront, its registry
#   (`make -C e2e-tests test-e2e-bare-metal`).
# - e2e-apicredits: the API-credit market and a compute registry of its own
#   (`make -C e2e-tests test-e2e-apicredits`).
# - e2e-inference: the inference market and the compute and API-credit
#   registries of its own (`make -C e2e-tests test-e2e-inference`).
#
# Beside the lanes, native-ansible-gate runs the IaC's syntax checks and native
# Ansible tests (`make test-provisioning-iac-native`) in the provisioning image
# it builds for itself. It composes no stack, so it is a job rather than a lane;
# it fails rather than skips when the image lacks its Ansible or callback, and
# its output is the job log.
#
# Every lane's stack also runs the lane doubles (`tools/payments-lane-double`,
# `tools/mediation-lane-double`): the stand-in Arkhai Payments service the VM,
# bare-metal and API-credit payment scenarios settle against, and the dispute
# authority each lane's registries recommend. The inference lane settles
# through Alkahest alone.
#
# Each lane's targets name its compose project and files; the log collection
# and teardown below go through the same targets, so a job names none of them
# itself.
#
# PROVISIONING_MODE selects mock provisioning for the compute lanes: the lane
# targets hand it to Compose, whose overlays make it the provisioning services'
# last profile, `mock`, whose `/test` controls the scenarios hold jobs through.
# No storefront reads it, and the API-credit and inference stacks have no
# provisioning service.
env:
  PROVISIONING_MODE: mock

jobs:
  e2e-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.22"
      # Every lane needs it: the dev chain's baked state is generated against Anvil.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1   # matches FOUNDRY_VERSION in the Makefile
      - name: Build VM stack + run VM e2e scenarios
        run: make -C e2e-tests test-e2e-vm
      - name: Collect compose logs
        if: always()
        # `tee` rather than a plain redirect so the output lands in the job log
        # as well as the artifact -- a failure that needs a separate artifact
        # download to diagnose is a slow loop.
        run: |
          echo "::group::compose logs"
          make -s -C e2e-tests e2e-vm-logs 2>&1 | tee compose-logs.txt || true
          echo "::endgroup::"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-vm-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: make -C e2e-tests e2e-vm-down || true

  e2e-bare-metal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.22"
      # Every lane needs it: the dev chain's baked state is generated against Anvil.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1   # matches FOUNDRY_VERSION in the Makefile
      - name: Build bare-metal stack + run bare-metal e2e scenarios
        run: make -C e2e-tests test-e2e-bare-metal
      - name: Collect compose logs
        if: always()
        # `tee` rather than a plain redirect so the output lands in the job log
        # as well as the artifact -- a failure that needs a separate artifact
        # download to diagnose is a slow loop.
        run: |
          echo "::group::compose logs"
          make -s -C e2e-tests e2e-bare-metal-logs 2>&1 | tee compose-logs.txt || true
          echo "::endgroup::"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bare-metal-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: make -C e2e-tests e2e-bare-metal-down || true

  e2e-apicredits:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.22"
      # Every lane needs it: the dev chain's baked state is generated against Anvil.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1   # matches FOUNDRY_VERSION in the Makefile
      - name: Build API-credit stack + run API-credit e2e scenarios
        run: make -C e2e-tests test-e2e-apicredits
      - name: Collect compose logs
        if: always()
        # `tee` rather than a plain redirect so the output lands in the job log
        # as well as the artifact -- a failure that needs a separate artifact
        # download to diagnose is a slow loop.
        run: |
          echo "::group::compose logs"
          make -s -C e2e-tests e2e-apicredits-logs 2>&1 | tee compose-logs.txt || true
          echo "::endgroup::"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-apicredits-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: make -C e2e-tests e2e-apicredits-down || true

  e2e-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.22"
      # Every lane needs it: the dev chain's baked state is generated against Anvil.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1   # matches FOUNDRY_VERSION in the Makefile
      - name: Build inference stack + run the inference e2e scenario
        run: make -C e2e-tests test-e2e-inference
      - name: Collect compose logs
        if: always()
        # `tee` rather than a plain redirect so the output lands in the job log
        # as well as the artifact -- a failure that needs a separate artifact
        # download to diagnose is a slow loop.
        run: |
          echo "::group::compose logs"
          make -s -C e2e-tests e2e-inference-logs 2>&1 | tee compose-logs.txt || true
          echo "::endgroup::"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-inference-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: make -C e2e-tests e2e-inference-down || true

  native-ansible-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.22"
      # The wheels and the provisioning image only: the gate needs no dev chain,
      # so no foundry.
      - name: Build the provisioning image
        run: make build-e2e-native-gate
      - name: Native Ansible gate
        run: make test-provisioning-iac-native
