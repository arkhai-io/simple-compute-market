name: E2E

on:
  schedule:
    - cron: '0 7 * * *'   # nightly, ~07:00 UTC
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The docker-compose end-to-end suite, as three lanes, one market domain each,
# in separate jobs so each failure's logs stand alone and one domain's failure
# never hides another's evidence. Each lane builds only the images its stack
# runs, brings that stack up on its own dev chain, and runs its scenarios from
# a one-shot container on its compose network. Far heavier than the per-push
# Tests workflow, so it runs nightly / on demand.
#
# - e2e-vm: the VM market (`make -C e2e-tests test-e2e-vm`).
# - e2e-bare-metal: one site, the bare-metal storefront, its registry
#   (`make -C e2e-tests test-e2e-bare-metal`).
# - e2e-apicredits: the API-credit market and a compute registry of its own
#   (`make -C e2e-tests test-e2e-apicredits`).
#
# Each lane's targets name its compose project, files, and environment file;
# the log collection and teardown below go through the same targets, so a job
# names none of them itself.
#
# PROVISIONING_MODE selects mock provisioning for the compute lanes: their
# environment targets turn it into the provisioning services' `mock` profile,
# whose `/test` controls the scenarios hold jobs through. No storefront reads
# it, and the API-credit stack has no provisioning service.
env:
  PROVISIONING_MODE: mock

jobs:
  e2e-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.17"
      # Every lane needs it: the dev chain's baked state is generated against Anvil.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1   # matches FOUNDRY_VERSION in the Makefile
      - name: Build VM stack + run VM e2e scenarios
        run: make -C e2e-tests test-e2e-vm
      - name: Collect compose logs
        if: always()
        # `tee` rather than a plain redirect so the output lands in the job log
        # as well as the artifact -- a failure that needs a separate artifact
        # download to diagnose is a slow loop.
        run: |
          echo "::group::compose logs"
          make -s -C e2e-tests e2e-vm-logs 2>&1 | tee compose-logs.txt || true
          echo "::endgroup::"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-vm-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: make -C e2e-tests e2e-vm-down || true

  e2e-bare-metal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.17"
      # Every lane needs it: the dev chain's baked state is generated against Anvil.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1   # matches FOUNDRY_VERSION in the Makefile
      - name: Build bare-metal stack + run bare-metal e2e scenarios
        run: make -C e2e-tests test-e2e-bare-metal
      - name: Collect compose logs
        if: always()
        # `tee` rather than a plain redirect so the output lands in the job log
        # as well as the artifact -- a failure that needs a separate artifact
        # download to diagnose is a slow loop.
        run: |
          echo "::group::compose logs"
          make -s -C e2e-tests e2e-bare-metal-logs 2>&1 | tee compose-logs.txt || true
          echo "::endgroup::"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bare-metal-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: make -C e2e-tests e2e-bare-metal-down || true

  e2e-apicredits:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.17"
      # Every lane needs it: the dev chain's baked state is generated against Anvil.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1   # matches FOUNDRY_VERSION in the Makefile
      - name: Build API-credit stack + run API-credit e2e scenarios
        run: make -C e2e-tests test-e2e-apicredits
      - name: Collect compose logs
        if: always()
        # `tee` rather than a plain redirect so the output lands in the job log
        # as well as the artifact -- a failure that needs a separate artifact
        # download to diagnose is a slow loop.
        run: |
          echo "::group::compose logs"
          make -s -C e2e-tests e2e-apicredits-logs 2>&1 | tee compose-logs.txt || true
          echo "::endgroup::"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-apicredits-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: make -C e2e-tests e2e-apicredits-down || true
