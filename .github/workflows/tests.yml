name: Tests

on:
  push:
    branches: [staging, dev]
  pull_request:
    branches: [staging, dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runs `make test` as a change's validation runs it locally: one job per
# target `make test` is made of, each the same command a developer runs, so a
# suite passes here exactly when it passes there. Integration tests are mocked
# at the boundary and reach no external service. A test asserts that the
# matrix names every one of `make test`'s targets
# (scripts/tests/test_tests_workflow.py).
#
# Not included here: the docker-compose end-to-end suite (e2e-tests/), which
# builds the full image stack and runs in the e2e workflow. tools/issue-discovery
# is also excluded (its bootstrap tests probe the host system).

jobs:
  test:
    name: test · ${{ matrix.target }}
    runs-on: ubuntu-latest
    env:
      # Typer forces Rich's terminal mode whenever GITHUB_ACTIONS is set, which
      # styles CLI output and error panels with escape codes a local run never
      # emits; CLI tests assert on that output's text.
      _TYPER_FORCE_DISABLE_TERMINAL: '1'
    strategy:
      fail-fast: false
      matrix:
        target:
          - test-core
          - test-kits
          - test-compute-provisioning-contracts
          - test-compute-provisioning-client
          - test-compute-provisioning
          - test-compute-provisioning-ansible
          - test-provisioning
          - test-provisioning-iac
          - test-registry
          - test-registry-client
          - test-storefront
          - test-provisioning-adapter
          - test-bare-metal
          - test-compute
          - test-vms-domain
          - test-vms-buyer
          - test-apicredits
          - test-e2e-unit
          - test-deployment-packaging
    steps:
      - uses: actions/checkout@v4
      - name: Use the repository's declared Python version
        run: echo "UV_PYTHON=$(cat .python-version)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.19"
      # The API-credits suite includes the TypeScript and Rust middleware.
      - if: matrix.target == 'test-apicredits'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: matrix.target == 'test-apicredits'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.target == 'test-apicredits'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: domains/apicredits/middleware/rust
      - if: matrix.target == 'test-deployment-packaging'
        uses: azure/setup-helm@v4
        with:
          version: "v4.3.0"
      - name: Build the repository's wheels
        run: make dist-ci
      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}

  arkhai-payments-kit:
    name: build · kit-arkhai-payments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.19"
      - name: Build repository wheels
        run: make dist-ci
      - name: Build the portable wheel
        run: make -C kit/arkhai-payments build

  architecture:
    name: check · architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.19"
      - name: Check package architecture
        run: make check-architecture
