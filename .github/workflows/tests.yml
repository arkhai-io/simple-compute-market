name: Tests

on:
  push:
    branches: [staging, dev]
  pull_request:
    branches: [staging, dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runs `make test` as a change's validation runs it locally: one job per
# target `make test` is made of, each the same command a developer runs, so a
# suite passes here exactly when it passes there. Integration tests are mocked
# at the boundary and reach no external service. A test asserts that the
# matrix names every one of `make test`'s targets
# (scripts/tests/test_tests_workflow.py).
#
# Not included here: the docker-compose end-to-end suite (e2e-tests/), which
# builds the full image stack and runs in the e2e workflow. tools/issue-discovery
# is also excluded (its bootstrap tests probe the host system). The frps
# admission plugin's network-bound gate is its own job below, beside the matrix.

jobs:
  test:
    name: test · ${{ matrix.target }}
    runs-on: ubuntu-latest
    env:
      # Typer forces Rich's terminal mode whenever GITHUB_ACTIONS is set, which
      # styles CLI output and error panels with escape codes a local run never
      # emits; CLI tests assert on that output's text.
      _TYPER_FORCE_DISABLE_TERMINAL: '1'
    strategy:
      fail-fast: false
      matrix:
        target:
          - test-domains
          - test-core
          - test-kits
          - test-compute-provisioning-contracts
          - test-compute-provisioning-client
          - test-compute-provisioning
          - test-compute-provisioning-ansible
          - test-provisioning
          - test-provisioning-iac
          - test-registry
          - test-registry-client
          - test-e2e-unit
          - test-deployment-packaging
          - test-frp-grant-admission
          - test-lane-double-controls
          - test-payments-lane-double
          - test-mediation-lane-double
    steps:
      - uses: actions/checkout@v4
      - name: Use the repository's declared Python version
        run: echo "UV_PYTHON=$(cat .python-version)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.22"
      # The API-credits suite includes the TypeScript and Rust middleware.
      - if: matrix.target == 'test-domains'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: matrix.target == 'test-domains'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.target == 'test-domains'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: domains/apicredits/middleware/rust
      - if: matrix.target == 'test-deployment-packaging'
        uses: azure/setup-helm@v4
        with:
          version: "v4.3.0"
      # The pinned gitleaks, verified against scripts/gitleaks-pins.toml and put on
      # PATH for the steps after it.
      - if: matrix.target == 'test-deployment-packaging'
        name: Install the pinned gitleaks
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make install-gitleaks GITLEAKS_INSTALL_DIR="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the repository's wheels
        run: make dist-ci
      # Where the script suites run, a real-gitleaks case that would skip fails instead.
      - name: make ${{ matrix.target }}
        env:
          GITLEAKS_REQUIRED: ${{ matrix.target == 'test-deployment-packaging' && '1' || '' }}
        run: make ${{ matrix.target }}

  # The frps admission plugin's gate, which needs the network: real frps and frpc,
  # fetched and verified against the tool's pins, and its unit tests with each runtime
  # dependency at its declared floor. Both fail rather than skip.
  frp-grant-admission-gate:
    name: frp · real-frp gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the repository's declared Python version
        run: echo "UV_PYTHON=$(cat .python-version)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.22"
      - name: make test-frp-grant-admission-frp
        run: make test-frp-grant-admission-frp
      # Run whatever the real-frp step concluded, so one run reports both.
      - name: make test-frp-grant-admission-floor
        if: ${{ !cancelled() }}
        run: make test-frp-grant-admission-floor

  arkhai-payments-kit:
    name: build · kit-arkhai-payments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.22"
      - name: Build repository wheels
        run: make dist-ci
      - name: Build the portable wheel
        run: make -C kit/arkhai-payments build

  architecture:
    name: check · architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.22"
      - name: Check package architecture
        run: make check-architecture
