name: Tests

on:
  push:
    branches: [staging, dev]
  pull_request:
    branches: [staging, dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runs every package's unit + integration suite (integration tests are
# mocked at the boundary — no external services), plus the TypeScript and
# Rust middleware suites. Each Python package is tested in isolation with
# `uv run` resolving its workspace deps; `--with pytest[-asyncio]` supplies
# the runner regardless of whether the package declares it.
#
# Not included here: the docker-compose end-to-end suite (e2e-tests/),
# which builds the full image stack and is too heavy for per-push CI — it
# belongs in a separate (e.g. scheduled) workflow. tools/issue-discovery
# is also excluded (its bootstrap tests probe the host system).

jobs:
  python:
    name: py · ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      ACTIVE_PROFILES: mock
      # CI has no controlling TTY, so Rich falls back to COLUMNS for help
      # width; pin it wide so `typer --help` renders option flags
      # un-truncated (several plugin tests assert on flag substrings).
      COLUMNS: '200'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: kit-alkahest,           dir: kit/alkahest, predist: true }
          - { name: kit-config,             dir: kit/config, predist: true }
          - { name: kit-identity,           dir: kit/identity }
          - { name: kit-policy,             dir: kit/policy, predist: true }
          - { name: kit-settlement-runtime, dir: kit/settlement-runtime, predist: true }
          - { name: kit-negotiation-runtime, dir: kit/negotiation-runtime, predist: true }
          - { name: kit-hosted-settlement, dir: kit/hosted-settlement, predist: true, requires_hosted: true }
          - { name: core,                   dir: core }
          - { name: core-buyer,             dir: core/buyer, predist: true }
          - { name: core-storefront,        dir: core/storefront, predist: true }
          - { name: core-storefront-client, dir: core/storefront-client, predist: true }
          - { name: core-registry,          dir: core/registry, predist: true }
          - { name: core-registry-client,   dir: core/registry-client, predist: true }
          - { name: kit-site,              dir: kit/site, predist: true }
          - { name: kit-site-client,       dir: kit/site-client, predist: true }
          - { name: kit-resource-pools,     dir: kit/resource-pools }
          - { name: kit-fulfillment,        dir: kit/fulfillment, predist: true }
          - { name: compute-provisioning,   dir: provisioning/compute, predist: true }
          - { name: bare-metal,            dir: domains/bare_metal, predist: true }
          - { name: bare-metal-storefront, dir: domains/bare_metal/storefront, predist: true, requires_hosted: true }
          # The deselected tests assert that injected/static option flags
          # appear in `typer --help` output; under headless pytest capture
          # in CI the Rich-rendered options panel comes back empty (passes
          # locally with a TTY). Tracked for a test-side fix.
          - { name: vms-buyer,              dir: domains/vms/buyer, predist: true, requires_hosted: true, pytest_args: "--deselect tests/test_plugin_export.py::test_assembled_listing_is_vm_rendering_not_generic_fallback --deselect tests/test_plugin_export.py::test_assembled_listing_uses_typed_resource_query --deselect tests/test_policy_cli_injection.py::test_policy_params_become_flags_and_land_in_kwargs --deselect tests/test_policy_cli_injection.py::test_assembled_buy_and_negotiate_surface_the_default_policy_flags --deselect tests/test_settlement_config_template.py::test_removed_mechanism_and_private_key_flags_are_rejected" }
          # test_alkahest parity tests spawn node via alkahest_py (needs the
          # JS impl); cross-language parity is covered by the ts/rust jobs.
          - { name: vms-storefront,         dir: domains/vms/storefront, predist: true, requires_hosted: true, pytest_args: "--deselect tests/unit/test_alkahest.py::test_rust --deselect tests/unit/test_alkahest.py::test_python" }
          - { name: compute-provisioning-service, dir: provisioning/compute/service, predist: true }
          - { name: apicredits-buyer,        dir: domains/apicredits/buyer, predist: true, requires_hosted: true, pytest_args: "--deselect tests/test_plugin_export.py::test_buy_surface_has_quantity_key_and_scalar_price_flags --deselect tests/test_plugin_export.py::test_listing_surface_is_token_rendering_not_generic_fallback --deselect tests/test_plugin_export.py::test_listing_surface_uses_typed_resource_query" }
          - { name: apicredits-storefront,   dir: domains/apicredits/storefront, predist: true, requires_hosted: true }
          - { name: apicredits-service,      dir: domains/apicredits/service, predist: true }
          - { name: apicredits-middleware,   dir: domains/apicredits/middleware/python }
          - { name: apicredits-sample-app,   dir: domains/apicredits/sample-app }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.17"
      - name: Create wheelhouse
        run: mkdir -p .dist
      # Which producer version this repository compiles against is stated by the
      # pin; which one has been signed is stated by the trust configuration
      # naming it. Nothing else states either, and the two together decide
      # whether there is a release to verify at all.
      - name: Select the hosted client channel
        id: hosted
        if: matrix.requires_hosted
        run: python scripts/select-hosted-client-channel.py >>"$GITHUB_OUTPUT"
      # Same private producer, same reason as in publish-pypi.yml: the
      # workspace token answers a private release with `release not found`.
      # This repository is public, so a pull request from a fork is handed no
      # secret at all -- say which of the two happened rather than letting `gh`
      # report a missing tag for both.
      - name: Download exact hosted release assets
        if: matrix.requires_hosted && steps.hosted.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ secrets.HOSTED_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::HOSTED_RELEASE_TOKEN is unset (forked pull requests receive no secrets); the private producer release cannot be read"
            exit 1
          fi
          mkdir -p .dist
          gh release download "v${{ steps.hosted.outputs.version }}" \
            --repo "${{ steps.hosted.outputs.repository }}" --dir .dist \
            --pattern "${{ steps.hosted.outputs.manifest }}" \
            --pattern "${{ steps.hosted.outputs.wheel }}" \
            --pattern "openapi-v${{ steps.hosted.outputs.version }}.json" \
            --pattern "conformance-v${{ steps.hosted.outputs.version }}.json" \
            --pattern "migrations-v${{ steps.hosted.outputs.schema_version }}.json" \
            --pattern "sbom.spdx.json" \
            --pattern "provenance.intoto.json"
      - name: Verify staged hosted release
        if: matrix.requires_hosted && steps.hosted.outputs.channel == 'release'
        run: make verify-hosted-release HOSTED_RELEASE_TRUST="${{ steps.hosted.outputs.trust }}"
      # An unreleased version has nothing signed to verify. The wheel comes from
      # the producer's access-controlled index instead, and is treated as what
      # it is: something this job can compile against and cite for nothing.
      - name: Authenticate to the internal package index
        id: hosted_auth
        if: matrix.requires_hosted && steps.hosted.outputs.channel == 'internal' && vars.AR_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.AR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.AR_READER_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Stage the development hosted client
        if: matrix.requires_hosted && steps.hosted.outputs.channel == 'internal'
        run: |
          if [ -z "${{ steps.hosted_auth.outputs.access_token }}" ]; then
            echo "::error::hosted client ${{ steps.hosted.outputs.version }} has no signed release, and this run cannot reach the internal package index. Set AR_WORKLOAD_IDENTITY_PROVIDER and AR_READER_SERVICE_ACCOUNT, or release that version."
            exit 1
          fi
          mkdir -p .dist
          python -m pip download --no-deps --quiet --dest .dist \
            --index-url "https://oauth2accesstoken:${{ steps.hosted_auth.outputs.access_token }}@${{ steps.hosted.outputs.index_host }}/simple/" \
            "arkhai-hosted-settlement-client==${{ steps.hosted.outputs.version }}"
          test -f ".dist/${{ steps.hosted.outputs.wheel }}"
      - name: Build sibling wheels into .dist
        # Package ordering and inventory belong to the repository build graph.
        if: matrix.predist
        run: make dist-ci
      - name: Build hosted adapter from verified client contract
        if: matrix.requires_hosted
        run: uv build --no-sources --out-dir .dist kit/hosted-settlement
      - name: pytest
        working-directory: ${{ matrix.dir }}
        env:
          PYTEST_ARGS: ${{ matrix.pytest_args }}
        run: uv run --find-links "$GITHUB_WORKSPACE/.dist" --with pytest --with pytest-asyncio pytest -q $PYTEST_ARGS

  release-deployment:
    name: release · deployment contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.17"
      - uses: azure/setup-helm@v4
      - name: Run release and package boundary tests
        run: make test-release-tooling
      - name: Run Helm schema and render contracts
        run: make -C helm test-render

  ts-middleware:
    name: ts · apicredits-middleware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domains/apicredits/middleware/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: domains/apicredits/middleware/typescript/package-lock.json
      - run: npm ci
      - run: npm run check   # tsc --noEmit + node --test conformance/gate suites

  rust-middleware:
    name: rust · apicredits-middleware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domains/apicredits/middleware/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: domains/apicredits/middleware/rust
      - run: cargo test --locked
