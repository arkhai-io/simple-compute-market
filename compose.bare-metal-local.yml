# Development overlay for the bare-metal end-to-end lane.
#
# Layered over compose.bare-metal.yml and compose.dev.yml, which supplies the
# dev chain:
#
#     docker compose -p simple-market-bare-metal --env-file <file> \
#       -f compose.bare-metal.yml -f compose.dev.yml -f compose.bare-metal-local.yml up -d
#
# `make -C e2e-tests test-e2e-bare-metal` does exactly this, with the values
# `make e2e-bare-metal-dev-env` prints. Every value it binds is a well-known
# development value that must never be used on a public network; see
# dev-env/identities/README.md.
#
# It changes the stack in exactly two ways. The site runs the provisioning mock
# profile, since the lane has no host inventory, which also mounts the /test/*
# controller. And the storefront gets the dev chain for its Alkahest options.
services:
  bare-metal-provisioning:
    environment:
      - ACTIVE_PROFILES=mock

  bare-metal-storefront:
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      - BARE_METAL_STOREFRONT_CHAINS=${BARE_METAL_STOREFRONT_CHAINS_JSON:?set dev chain configuration JSON}
      - BARE_METAL_STOREFRONT_EVM_PRIVATE_KEY=${BARE_METAL_STOREFRONT_EVM_PRIVATE_KEY:?set development seller wallet key}
    volumes:
      # The dev chain's Alkahest address book, generated by `make build-anvil-state`.
      - ./domains/vms/storefront/src/market_storefront/data/alkahest_anvil_addresses.json:/app/alkahest_anvil_addresses.json:ro
