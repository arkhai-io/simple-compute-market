# Development overlay for the bare-metal end-to-end lane.
#
# Layered over compose.bare-metal.yml, compose.dev.yml, which supplies the dev
# chain, and compose.payments-double.yml, which supplies the payments lane double:
#
#     docker compose -p simple-market-bare-metal --env-file <file> \
#       -f compose.bare-metal.yml -f compose.dev.yml \
#       -f compose.payments-double.yml -f compose.bare-metal-local.yml up -d
#
# `make -C e2e-tests test-e2e-bare-metal` does exactly this, with the values
# `make e2e-bare-metal-dev-env` prints. Every value it binds is a well-known
# development value that must never be used on a public network; see
# dev-env/identities/README.md.
#
# It changes the storefront, its registry, and its mail sink. The storefront
# waits for the dev chain, Mailpit and the payments double, mounts the dev
# chain's Alkahest address book where the lane's storefront.toml names it, and
# trusts the lane CA with the seller's payments token in its environment; the
# registry recommends the lane's pinned dispute authority. The storefront's own
# configuration is the lane's development storefront.toml and secrets overlay,
# which the environment file names. Whether the site provisions through its mock
# profile is the run's choice, not this overlay's: the environment file's
# BARE_METAL_PROVISIONING_ACTIVE_PROFILES, from `PROVISIONING_MODE`.
services:
  bare-metal-registry:
    environment:
      - REGISTRY_DESCRIPTOR_RECOMMENDED_DISPUTE_AUTHORITIES=${PAYMENTS_LANE_DISPUTE_AUTHORITIES:?set the lane's recommended dispute authorities}

  bare-metal-storefront:
    depends_on:
      anvil:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      payments-double:
        condition: service_healthy
    environment:
      # Neither is a setting: the payments client reads both from its process
      # environment. The lane CA is the only authority it trusts for the double,
      # and the token is the seller's at the double, under the variable
      # [Settlement.arkhai_payments].api_key_env names.
      - SSL_CERT_FILE=/run/payments-lane-double/lane-ca.pem
      - ARKHAI_PAYMENTS_API_KEY=${PAYMENTS_LANE_SELLER_API_KEY:?set the seller's payments token}
    volumes:
      # The dev chain's Alkahest address book, generated by `make build-anvil-state`.
      - ./kit/alkahest/src/market_alkahest/data/alkahest_anvil_addresses.json:/app/alkahest_anvil_addresses.json:ro
      - ${PAYMENTS_LANE_CA_FILE:?set the payments lane CA file}:/run/payments-lane-double/lane-ca.pem:ro

  # Mailpit receives the storefront's seller-side introduction mail: an
  # off-the-shelf SMTP server with a query API, so a scenario can read what the
  # seller would have been sent, at the lane's MAILPIT.API_URL.
  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
