# Development overlay for the bare-metal end-to-end lane.
#
# Layered over compose.bare-metal.yml and compose.dev.yml, which supplies the
# dev chain:
#
#     docker compose -p simple-market-bare-metal --env-file <file> \
#       -f compose.bare-metal.yml -f compose.dev.yml -f compose.bare-metal-local.yml up -d
#
# `make -C e2e-tests test-e2e-bare-metal` does exactly this, with the values
# `make e2e-bare-metal-dev-env` prints. Every value it binds is a well-known
# development value that must never be used on a public network; see
# dev-env/identities/README.md.
#
# It changes only the storefront: it waits for the dev chain, reads its Alkahest
# address book, and runs a seller chain ending in `bisection`, which counters
# an opening below the listed rate where the default chain would exit, so the
# lane's deal negotiates an open thread; its chains and wallet key arrive
# through the wrapper's inputs. Whether the site provisions through its mock
# profile is the run's choice, not this overlay's: the environment file's
# BARE_METAL_PROVISIONING_ACTIVE_PROFILES, from `PROVISIONING_MODE`.
services:
  bare-metal-storefront:
    environment:
      - BARE_METAL_STOREFRONT_NEGOTIATION_POLICIES=["escrow_shape_guard","bisection"]
    depends_on:
      anvil:
        condition: service_healthy
    volumes:
      # The dev chain's Alkahest address book, generated by `make build-anvil-state`.
      - ./kit/alkahest/src/market_alkahest/data/alkahest_anvil_addresses.json:/app/alkahest_anvil_addresses.json:ro
