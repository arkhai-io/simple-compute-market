# VM compute market with explicit local-EVM effects. Buyer marketplace signing
# uses a selected profile under the separately mounted XDG data directory;
# provider secret files and optional wallet/chain overlays remain distinct.
include:
  - compose.dev.yml
  - domains/vms/compose.yml

# This file composes base topology only. The development signer, wallet, and
# buyer-path bindings live in compose.vms-local.yml, layered with `-f` because
# an including file cannot redefine a service it imported:
#
#     make -s --no-print-directory e2e-vms-dev-env > .e2e-vms.env
#     docker compose --env-file .e2e-vms.env \
#       -f compose.vms.yml -f compose.vms-local.yml up -d
