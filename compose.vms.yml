# VM compute market with explicit local-EVM effects. Buyer marketplace signing
# uses a selected profile under the separately mounted XDG data directory;
# provider secret files and optional wallet/chain overlays remain distinct.
include:
  - compose.dev.yml
  - domains/vms/compose.yml

services:
  registry:
    environment:
      - REGISTRY_AUTHORITY_ID=registry-a
      - REGISTRY_AUTHORITY_SCHEME=eip191
      - REGISTRY_AUTHORITY_IDENTIFIER=0x90f79bf6eb2c4f870365e785982e1f101e93b906
      - REGISTRY_AUTHORITY_CREDENTIAL_FILE=/run/secrets/arkhai/registry-identity/credential
    volumes:
      - ${VMS_REGISTRY_IDENTITY_CREDENTIAL_FILE:?set registry signer credential file}:/run/secrets/arkhai/registry-identity/credential:ro
  registry-b:
    environment:
      - REGISTRY_AUTHORITY_SCHEME=eip191
      - REGISTRY_AUTHORITY_ID=registry-b
      - REGISTRY_AUTHORITY_IDENTIFIER=0x15d34aaf54267db7d7c367839aaf71a00a2c6a65
      - REGISTRY_AUTHORITY_CREDENTIAL_FILE=/run/secrets/arkhai/registry-identity/credential
    volumes:
      - ${VMS_REGISTRY_B_IDENTITY_CREDENTIAL_FILE:?set private registry signer credential file}:/run/secrets/arkhai/registry-identity/credential:ro
  bob-storefront:
    env_file:
      - ${VMS_BOB_EVM_WALLET_ENV_FILE:?set Bob EVM wallet environment file}
      - ${VMS_BOB_IDENTITY_ENV_FILE:?set Bob signer credential environment file}
  alice-storefront:
    env_file:
      - ${VMS_ALICE_IDENTITY_ENV_FILE:?set Alice signer credential environment file}
      - ${VMS_ALICE_EVM_WALLET_ENV_FILE:?set Alice EVM wallet environment file}
  provisioning:
    env_file:
      - ${VMS_PROVISIONING_IDENTITY_ENV_FILE:?set provisioning signer credential environment file}
    environment:
      - PROVISIONING_IDENTITY__SCHEME=eip191
      - PROVISIONING_IDENTITY__IDENTIFIER=0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266
      - PROVISIONING_STOREFRONT_IDENTITY__SCHEME=eip191
      - PROVISIONING_STOREFRONT_IDENTITY__IDENTIFIER=0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc
      - PROVISIONING_STOREFRONT_SITE_ID=default
      - PROVISIONING_ADMIN_IDENTITY__SCHEME=eip191
      - PROVISIONING_ADMIN_IDENTITY__IDENTIFIER=0x9965507d1a55bcc2695c58ba16fb37d819b0a4dc
  buyer-cli:
    image: ${VMS_BUYER_IMAGE:-arkhai:e2e-tests}
    profiles: [buyer]
    user: "${VMS_BUYER_UID:-1000}:${VMS_BUYER_GID:-1000}"
    entrypoint: ["market"]
    command: ["profile", "show"]
    environment:
      XDG_CONFIG_HOME: /etc
      XDG_DATA_HOME: /var/lib/arkhai-buyer
      XDG_STATE_HOME: /var/lib/arkhai-buyer-state
    volumes:
      - ${VMS_BUYER_CONFIG_PATH:?set buyer public config path}:/etc/arkhai/config.toml:ro
      - ${VMS_BUYER_PROFILE_DIR:?set persistent buyer profile directory}:/var/lib/arkhai-buyer/arkhai/buyer:rw
      - ${VMS_BUYER_STATE_DIR:?set persistent buyer run-state directory}:/var/lib/arkhai-buyer-state/arkhai:rw
      - ${VMS_BUYER_CREDENTIAL_FILE:?set strict buyer credential file}:/run/secrets/arkhai/buyer-credential:ro
