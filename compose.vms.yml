# VM compute market with explicit local-EVM effects. Buyer marketplace signing
# uses a selected profile under the separately mounted XDG data directory;
# provider secret files and optional wallet/chain overlays remain distinct.
include:
  - compose.dev.yml
  - domains/vms/compose.yml

# This file composes base topology only, and its services refuse to start alone.
# The development identities, configuration, secret overlays, profiles and
# buyer service live in compose.vms-local.yml, layered with `-f` because an
# including file cannot redefine a service it imported:
#
#     docker compose -f compose.vms.yml -f compose.vms-local.yml up -d
#
# PROVISIONING_MODE=real in the environment provisions for real; the default
# is the mock profile.
