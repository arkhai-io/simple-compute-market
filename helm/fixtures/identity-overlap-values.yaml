# Deterministic local development principals; never use them on a public network.
# Provisioning bootstraps one identity per role; the storefront trust lists
# exercised alongside this fixture allow both schemes.
provisioning:
  storefrontIdentity:
    principals:
      - scheme: eip191
        identifier: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"
  adminIdentity:
    principals:
      - scheme: eip191
        identifier: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"
