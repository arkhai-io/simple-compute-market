# Bob's agent signing with Ed25519 under its own Secret, with no runtime
# overlay, selling under Arkhai payments. Agents are keyed by name, so only what
# differs from Bob's default agent is stated; every principal list is replaced.
# Every principal and account here is a deterministic development value, never
# for a public network.
storefront:
  image:
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  agents:
    bob:
      identity:
        credentialSecret:
          name: payments-bob-marketplace-identity
      internalRegistryTrust:
        principals:
          - scheme: ed25519
            identifier: NLTZBDFWy23PC-sKKUm3VZyUDSvLbb6MU6mzAnjjp0Y
      secret:
        secretName: ''
      config:
        agent_id: payments_bob
        log_file_path: ./logs/payments-bob.log
        Identity:
          principal:
            scheme: ed25519
            identifier: 0EqyMnQrtKs6E2i9RhXk5tAiSrcaAWuvhSCjMsl3hzc
          service_peers:
            provisioning_default:
              principals:
                - scheme: ed25519
                  identifier: xoImN8fTEOxXYnvgC6JZ0lN0n0qvZERwz_vlOjX3MkI
          administrators:
            operator:
              principals:
                - scheme: ed25519
                  identifier: 5zTqbCtiV95yNV5HKqBaTEh-a0Y8Ap7TBt8vAbVja1g
        pricing:
          default_min_price: '100'
          default_max_duration_seconds: 0
          settlements:
            - mechanism: arkhai.payments.v1
              asset: USD/2
              rate: '100'
              per: hour
              mechanism_input:
                payee_account: 22222222-2222-4222-8222-222222222222
                asset: USD/2
        Settlement:
          schema_version: 1
          priority:
            - arkhai.payments.v1
          arkhai_payments:
            enabled: true
            service_url: https://payments.example.test
            service_identity:
              scheme: ed25519
              identifier: 6yzxO_euOl9hQWih-wknLTl3HsS4UjcngV5GbK-O4WM
            fee_bps: 250
            dispute_authority: 33333333-3333-4333-8333-333333333333
            api_key_env: ARKHAI_PAYMENTS_API_KEY
