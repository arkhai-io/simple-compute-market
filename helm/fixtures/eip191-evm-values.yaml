# Bob's agent with its own signer and wallet Secrets, selling under Alkahest on
# the dev-env chart's Anvil with that chart's address book mounted. Agents are
# keyed by name, so only what differs from Bob's default agent is stated. Every
# principal and address here is a deterministic development value, never for a
# public network.
storefront:
  image:
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  agents:
    bob:
      identity:
        credentialSecret:
          name: evm-bob-marketplace-identity
      secret:
        secretName: evm-bob-runtime
      alkahestAddressBook:
        configMapName: arkhai-node-operator-dev-env-alkahest-addresses
        key: alkahest_anvil_addresses.json
        mountPath: /etc/arkhai/alkahest
      config:
        agent_id: evm_bob
        log_file_path: ./logs/evm-bob.log
        Wallet:
          address: '0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc'
          ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDemoPublicKeyForComputeAccess bob@example.com
        Chains:
          anvil:
            rpc_url: http://arkhai-node-operator-dev-env:8545
            chain_id: 31337
        Settlement:
          schema_version: 1
          priority:
            - alkahest.v1
          alkahest:
            enabled: true
            address_books:
              anvil: /etc/arkhai/alkahest/alkahest_anvil_addresses.json
            oracle_gated: false
            trusted_oracle_addresses: []
            interruptible: false
            interruptible_oracle_addresses: []
