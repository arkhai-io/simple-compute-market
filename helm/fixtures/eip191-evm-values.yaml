        principals:
          - scheme: eip191
            identifier: '0x90f79bf6eb2c4f870365e785982e1f101e93b906'
      secret:
        createSecret: false
        secretName: evm-bob-runtime
        configKey: storefront.secrets.toml
      config:
        agent_id: evm_bob
        log_file_path: ./logs/evm-bob.log
        resources_csv_path: /app/src/market_storefront/data/kvm1-machine.csv
        storefront_domains:
          - contribution: vms
            offering_mode: vm
            domain_identity: compute.v1
            contract_version: '1.0'
          - contribution: bare_metal
            offering_mode: bare_metal
            domain_identity: bare_metal.v1
            contract_version: '1.0'
        Identity:
          principal:
            scheme: eip191
            identifier: '0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc'
          service_peers:
            provisioning_default:
              role: service
              site_id: default
              principals:
                - scheme: eip191
                  identifier: '0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266'
          administrators:
            operator:
              principals:
                - scheme: eip191
                  identifier: '0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc'
        provisioning:
          mode: mock
          identity:
            principals:
              - scheme: eip191
                identifier: '0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266'
        negotiation:
          policies:
            - has_matching_inventory_guard
            - escrow_shape_guard
            - bisection
        Wallet:
          address: '0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc'
          ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDemoPublicKeyForComputeAccess bob@example.com
        Chains:
          anvil:
            rpc_url: http://arkhai-node-operator-dev-env:8545
            chain_id: 31337
        Settlement:
          schema_version: 1
          priority:
            - alkahest.v1
          alkahest:
            enabled: true
            address_config_path: /app/alkahest_anvil_addresses.json
            oracle_gated: false
            trusted_oracle_addresses: []
            interruptible: false
            interruptible_oracle_addresses: []
