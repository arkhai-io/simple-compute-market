{{/*
Shared helm-test configuration mounted by smoke-test pods.

Preferred smoke-test mode: global.smokeTests.config.profileFiles renders
complete Dynaconf profile files directly. The generated profile is still kept
when its name does not collide, so non-smoke hooks that mount config-helm.yml
continue to work.
*/}}
{{- $smoke := .Values.global.smokeTests | default dict -}}
{{- $config := $smoke.config | default dict -}}
{{- $rpc := .Values.global.rpc | default dict -}}
{{- $rpcUrl := "" -}}
{{- if $rpc.enabled -}}
  {{- $rpcUrl = (index .Values "validate-contracts").rpcUrl | default "" -}}
  {{- if and (not $rpcUrl) $rpc.host $rpc.port -}}
    {{- $rpcUrl = printf "http://%s:%d" $rpc.host (int $rpc.port) -}}
  {{- end -}}
{{- end -}}
{{- $agents := .Values.storefront.agents | default list -}}
{{- if not $agents -}}
  {{- fail "helm test config requires at least one storefront agent" -}}
{{- end -}}
{{- $provisioningTargetName := .Values.provisioning.storefront.agentName -}}
{{- $provisioningStorefrontFound := false -}}
{{- $provisioningStorefrontTrusted := false -}}
{{- range $agent := $agents -}}
  {{- if eq $agent.name $provisioningTargetName -}}
    {{- $provisioningStorefrontFound = true -}}
    {{- $agentIdentity := include "arkhai.storefrontConfigSection" (dict "doc" ($agent.config | default dict) "name" "identity") | fromYaml -}}
    {{- $agentPrincipal := $agentIdentity.principal | default dict -}}
    {{- range $principal := ($.Values.provisioning.storefrontIdentity.principals | default list) -}}
      {{- if and (eq $principal.scheme ($agentPrincipal.scheme | default "")) (eq $principal.identifier ($agentPrincipal.identifier | default "")) -}}
        {{- $provisioningStorefrontTrusted = true -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if not $provisioningStorefrontFound -}}
  {{- fail "provisioning storefront.agentName must match one configured storefront agent" -}}
{{- end -}}
{{- if not $provisioningStorefrontTrusted -}}
  {{- fail "provisioning storefront principals must include the active storefront signer principal" -}}
{{- end -}}
{{- $storefrontTests := .Values.storefront.tests | default dict -}}
{{- $targetName := $storefrontTests.targetAgentName | default "" -}}
{{- $targetAgent := first $agents -}}
{{- if $targetName -}}
  {{- $found := false -}}
  {{- range $agent := $agents -}}
    {{- if eq $agent.name $targetName -}}
      {{- $targetAgent = $agent -}}
      {{- $found = true -}}
    {{- end -}}
  {{- end -}}
  {{- if not $found -}}
    {{- fail (printf "storefront test targetAgentName %q did not match any agent" $targetName) -}}
  {{- end -}}
{{- end -}}
{{- $targetConfig := $targetAgent.config | default dict -}}
{{- /* Smoke tests talk to the registry the target storefront uses: its first
configured URL and that URL's trust entry, or the internal registry and the
agent's internalRegistryTrust. */ -}}
{{- $targetRegistry := include "arkhai.storefrontConfigSection" (dict "doc" $targetConfig "name" "registry") | fromYaml -}}
{{- $registryURL := printf "http://%s-registry:%d" .Release.Name (int .Values.registry.service.port) -}}
{{- $registryAuthority := $targetAgent.internalRegistryTrust | default dict -}}
{{- if hasKey $targetRegistry "urls" -}}
  {{- $registryURL = first $targetRegistry.urls -}}
  {{- $registryAuthority = index ($targetRegistry.authorities | default dict) $registryURL | default dict -}}
{{- end -}}
{{- $settlementConfig := include "arkhai.storefrontConfigSection" (dict "doc" $targetConfig "name" "settlement") | fromYaml -}}
{{- $alkahestConfig := include "arkhai.storefrontConfigSection" (dict "doc" $settlementConfig "name" "alkahest") | fromYaml -}}
{{- $component := $targetAgent.component | default $targetAgent.name -}}
{{- $generated := dict -}}
{{- $_ := set $generated "settlement" (dict
  "schema_version" ($settlementConfig.schema_version | default 1)
  "priority" ($settlementConfig.priority | default list)
) -}}
{{- if $rpcUrl -}}
{{- $rpcConfig := dict "url" $rpcUrl -}}
{{- if $rpc.chainId -}}
  {{- $_ := set $rpcConfig "chain_id" $rpc.chainId -}}
{{- end -}}
{{- $_ := set $generated "rpc" $rpcConfig -}}
{{- end -}}
{{- $_ := set $generated "registry" (dict
  "api_url" $registryURL
  "authorities" (dict $registryURL (dict
    "authority" (required "storefront test target registry trust requires an authority" $registryAuthority.authority)
    "principals" (required "storefront test target registry trust requires principals" $registryAuthority.principals)
  ))
) -}}
{{- $_ := set $generated $component (dict
  "api_url" (printf "http://%s-storefront-%s:%d" .Release.Name $targetAgent.name (int $targetAgent.port))
  "base_url_override" ((get $targetConfig "base_url") | default "")
  "agent_id" ((get $targetConfig "agent_id") | default "")
) -}}
{{- if and ($alkahestConfig.enabled | default false) $rpc.enabled $rpc.host $rpc.port -}}
{{- $_ := set $generated "buyer" (dict
  "chain_rpc_url" (printf "ws://%s:%d" $rpc.host (int $rpc.port))
) -}}
{{- end -}}
{{- $_ := set $generated "provisioning" (dict
  "api_url" (printf "http://%s-provisioning:%d" .Release.Name (int .Values.provisioning.server.port))
) -}}
{{- $rendered := mergeOverwrite (deepCopy $generated) (deepCopy ($config.values | default dict)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-test-config
  labels:
    {{- include "arkhai-node-operator.labels" . | nindent 4 }}
data:
  {{- if $config.profileFiles }}
  {{- range $profile, $content := $config.profileFiles }}
  config-{{ $profile }}.yml: |
    {{- $content | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- if and $config.profile (not (hasKey ($config.profileFiles | default dict) $config.profile)) }}
  config-{{ $config.profile }}.yml: |
    {{- toYaml $rendered | nindent 4 }}
  {{- end }}
