{{/*
Shared helm-test configuration mounted by smoke-test pods.

Preferred smoke-test mode: global.smokeTests.config.profileFiles renders
complete Dynaconf profile files directly. The generated profile is still kept
when its name does not collide, so non-smoke hooks that mount config-helm.yml
continue to work.
*/}}
{{- $smoke := .Values.global.smokeTests | default dict -}}
{{- $config := $smoke.config | default dict -}}
{{- $rpc := .Values.global.rpc | default dict -}}
{{- $rpcUrl := "" -}}
{{- if $rpc.enabled -}}
  {{- $rpcUrl = (index .Values "validate-contracts").rpcUrl | default "" -}}
  {{- if and (not $rpcUrl) $rpc.host $rpc.port -}}
    {{- $rpcUrl = printf "http://%s:%d" $rpc.host (int $rpc.port) -}}
  {{- end -}}
{{- end -}}
{{- $generated := dict -}}
{{- $_ := set $generated "settlement" (dict "schema_version" 1 "priority" list) -}}
{{- if $rpcUrl -}}
{{- $rpcConfig := dict "url" $rpcUrl -}}
{{- if $rpc.chainId -}}
  {{- $_ := set $rpcConfig "chain_id" $rpc.chainId -}}
{{- end -}}
{{- $_ := set $generated "rpc" $rpcConfig -}}
{{- end -}}
{{- $_ := set $generated "provisioning" (dict
  "api_url" (printf "http://%s-provisioning:%d" .Release.Name (int .Values.provisioning.server.port))
) -}}
{{- $bareMetal := index .Values "bare-metal-storefront" | default dict -}}
{{- if .Values.storefront.enabled -}}
{{- /* A release running the VM storefront: provisioning calls back one of its
agents and must trust that agent's signer, and the smoke tests target an agent
and the registry it publishes to. */ -}}
{{- $agents := .Values.storefront.agents | default dict -}}
{{- if not $agents -}}
  {{- fail "helm test config requires at least one storefront agent" -}}
{{- end -}}
{{- $provisioningTargetName := .Values.provisioning.storefront.agentName -}}
{{- $provisioningStorefrontFound := false -}}
{{- $provisioningStorefrontTrusted := false -}}
{{- range $name, $agent := $agents -}}
  {{- if eq $name $provisioningTargetName -}}
    {{- $provisioningStorefrontFound = true -}}
    {{- $agentIdentity := include "arkhai.storefrontConfigSection" (dict "doc" ($agent.config | default dict) "name" "identity") | fromJson -}}
    {{- $agentPrincipal := include "arkhai.storefrontConfigSection" (dict "doc" $agentIdentity "name" "principal") | fromJson -}}
    {{- $agentScheme := include "arkhai.storefrontConfigValue" (dict "doc" $agentPrincipal "name" "scheme") -}}
    {{- $agentIdentifier := include "arkhai.storefrontConfigValue" (dict "doc" $agentPrincipal "name" "identifier") -}}
    {{- range $principal := ($.Values.provisioning.storefrontIdentity.principals | default list) -}}
      {{- if and (eq $principal.scheme $agentScheme) (eq $principal.identifier $agentIdentifier) -}}
        {{- $provisioningStorefrontTrusted = true -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if not $provisioningStorefrontFound -}}
  {{- fail "provisioning storefront.agentName must match one configured storefront agent" -}}
{{- end -}}
{{- if not $provisioningStorefrontTrusted -}}
  {{- fail "provisioning storefront principals must include the active storefront signer principal" -}}
{{- end -}}
{{- $storefrontTests := .Values.storefront.tests | default dict -}}
{{- $targetName := $storefrontTests.targetAgentName | default (first (keys $agents | sortAlpha)) -}}
{{- if not (hasKey $agents $targetName) -}}
  {{- fail (printf "storefront test targetAgentName %q did not match any agent" $targetName) -}}
{{- end -}}
{{- $targetAgent := merge (dict "name" $targetName) (index $agents $targetName) -}}
{{- $targetConfig := $targetAgent.config | default dict -}}
{{- /* Smoke tests talk to the registry the target storefront uses: its first
configured URL and that URL's trust entry, or the internal registry and the
agent's internalRegistryTrust. */ -}}
{{- $targetRegistry := include "arkhai.storefrontConfigSection" (dict "doc" $targetConfig "name" "registry") | fromJson -}}
{{- $targetUrlsKey := include "arkhai.storefrontConfigKey" (dict "doc" $targetRegistry "name" "urls") -}}
{{- $registryURL := printf "http://%s-registry:%d" .Release.Name (int .Values.registry.service.port) -}}
{{- $registryAuthority := $targetAgent.internalRegistryTrust | default dict -}}
{{- if $targetUrlsKey -}}
  {{- $registryURL = first (index $targetRegistry $targetUrlsKey) -}}
  {{- $targetAuthorities := include "arkhai.storefrontConfigSection" (dict "doc" $targetRegistry "name" "authorities") | fromJson -}}
  {{- $registryAuthority = index $targetAuthorities $registryURL | default dict -}}
{{- end -}}
{{- $settlementConfig := include "arkhai.storefrontConfigSection" (dict "doc" $targetConfig "name" "settlement") | fromJson -}}
{{- $alkahestConfig := include "arkhai.storefrontConfigSection" (dict "doc" $settlementConfig "name" "alkahest") | fromJson -}}
{{- $component := $targetAgent.component | default $targetAgent.name -}}
{{- $schemaVersionKey := include "arkhai.storefrontConfigKey" (dict "doc" $settlementConfig "name" "schema_version") -}}
{{- $priorityKey := include "arkhai.storefrontConfigKey" (dict "doc" $settlementConfig "name" "priority") -}}
{{- $_ := set $generated "settlement" (dict
  "schema_version" ((and $schemaVersionKey (index $settlementConfig $schemaVersionKey)) | default 1)
  "priority" ((and $priorityKey (index $settlementConfig $priorityKey)) | default list)
) -}}
{{- $_ := set $generated "registry" (dict
  "api_url" $registryURL
  "authorities" (dict $registryURL (dict
    "authority" (required "storefront test target registry trust requires an authority" $registryAuthority.authority)
    "principals" (required "storefront test target registry trust requires principals" $registryAuthority.principals)
  ))
) -}}
{{- $_ := set $generated $component (dict
  "api_url" (printf "http://%s-storefront-%s:%d" .Release.Name $targetAgent.name (int $targetAgent.port))
  "base_url_override" ((get $targetConfig (include "arkhai.storefrontConfigKey" (dict "doc" $targetConfig "name" "base_url") | default "base_url")) | default "")
  "agent_id" ((get $targetConfig (include "arkhai.storefrontConfigKey" (dict "doc" $targetConfig "name" "agent_id") | default "agent_id")) | default "")
) -}}
{{- if and (eq (include "arkhai.storefrontConfigValue" (dict "doc" $alkahestConfig "name" "enabled")) "true") $rpc.enabled $rpc.host $rpc.port -}}
{{- $_ := set $generated "buyer" (dict
  "chain_rpc_url" (printf "ws://%s:%d" $rpc.host (int $rpc.port))
) -}}
{{- end -}}
{{- else if and $bareMetal.enabled .Values.provisioning.enabled -}}
{{- /* A release running the dedicated bare-metal storefront and no VM
storefront, such as a seller release publishing to another release's registry:
its provisioning service calls the bare-metal storefront back, so it must trust
that storefront's signer. No VM agent or registry is the smoke tests' target. */ -}}
{{- $bareMetalIdentity := include "arkhai.storefrontConfigSection" (dict "doc" ($bareMetal.config | default dict) "name" "identity") | fromJson -}}
{{- $bareMetalPrincipal := include "arkhai.storefrontConfigSection" (dict "doc" $bareMetalIdentity "name" "principal") | fromJson -}}
{{- $bareMetalScheme := include "arkhai.storefrontConfigValue" (dict "doc" $bareMetalPrincipal "name" "scheme") -}}
{{- $bareMetalIdentifier := include "arkhai.storefrontConfigValue" (dict "doc" $bareMetalPrincipal "name" "identifier") -}}
{{- $bareMetalTrusted := false -}}
{{- range $principal := (.Values.provisioning.storefrontIdentity.principals | default list) -}}
  {{- if and $bareMetalIdentifier (eq $principal.scheme $bareMetalScheme) (eq $principal.identifier $bareMetalIdentifier) -}}
    {{- $bareMetalTrusted = true -}}
  {{- end -}}
{{- end -}}
{{- if not $bareMetalTrusted -}}
  {{- fail "provisioning storefront principals must include the bare-metal storefront's config.Identity.principal" -}}
{{- end -}}
{{- end -}}
{{- $rendered := mergeOverwrite (deepCopy $generated) (deepCopy ($config.values | default dict)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-test-config
  labels:
    {{- include "arkhai-node-operator.labels" . | nindent 4 }}
data:
  {{- if $config.profileFiles }}
  {{- range $profile, $content := $config.profileFiles }}
  config-{{ $profile }}.yml: |
    {{- $content | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- if and $config.profile (not (hasKey ($config.profileFiles | default dict) $config.profile)) }}
  config-{{ $config.profile }}.yml: |
    {{- /* JSON is valid YAML and keeps 0x-prefixed principals as strings;
    Helm's YAML encoder leaves a 160-bit address bare, which a YAML loader
    reads as an integer. */}}
    {{- toPrettyJson $rendered | nindent 4 }}
  {{- end }}
