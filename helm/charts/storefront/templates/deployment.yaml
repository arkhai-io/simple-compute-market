{{/*
One Deployment per agent in .Values.agents, named for its key. Each pod mounts
two files at /etc/arkhai/ — storefront.json (ConfigMap, non-sensitive) and
storefront.secrets.toml (Secret, sensitive) — and points XDG_CONFIG_HOME at /etc
so dynaconf picks them up via its layered discovery and merge. An agent naming
an Alkahest address-book ConfigMap mounts it read-only too. No env-var-based
config.

checksum/config + checksum/secrets annotations force a rollout when
either source object changes, independently — flipping a log level
edits the ConfigMap (no secret rotation), rotating a wallet key edits
the Secret (no ConfigMap churn).

zerotierEnabled (default: true) controls whether ZeroTier networking
infrastructure is included in the pod spec. Set to false for environments
where ZeroTier is unnecessary (e.g. GKE Autopilot, API-gateway-fronted
deployments) or where the required Linux capabilities (NET_ADMIN, SYS_MODULE)
and hostPath volumes are not permitted. The application runtime is unaffected
when zerotier_network is unset in the storefront config — entrypoint.sh is already
fail-soft on daemon startup and the Python runtime skips all ZeroTier paths
when zerotier_network is absent.
*/}}
{{- $agents := dict }}
{{- include "storefront.agents" (dict "root" . "into" $agents) }}
{{- range $name, $entry := $agents }}
{{- /* An agent states no runtime overlay by omitting `secret`. */}}
{{- $agent := mergeOverwrite (dict "secret" (dict)) $entry (dict "name" $name) }}
{{- $addressBook := include "storefront.agentAddressBook" $agent | fromJson }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storefront.agentFullname" (dict "root" $ "agent" $agent) }}
  labels:
    {{- include "storefront.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $agent.component | default $agent.name | quote }}
spec:
  replicas: {{ $.Values.replicaCount }}
  # Recreate is required when persistence.enabled — the per-agent PVC
  # is ReadWriteOnce and rolling updates would deadlock waiting for the
  # old pod to release the volume. Kept on emptyDir setups too: rolling
  # updates over emptyDir would briefly run two pods writing to two
  # different ephemeral SQLite files, which has no value here.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "storefront.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $agent.component | default $agent.name | quote }}
  template:
    metadata:
      labels:
        {{- include "storefront.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $agent.component | default $agent.name | quote }}
      annotations:
        # Force pod rollout when either config source changes. ConfigMap
        # and Secret have independent checksums so non-sensitive edits
        # don't appear as secret rotations and vice versa.
        checksum/config:  {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") $ | sha256sum }}
    spec:
      # Kubernetes would otherwise inject variables for every Service in the
      # namespace, and those for a Service named storefront-... would land in
      # the storefront's STOREFRONT_ override layer as settings.
      enableServiceLinks: false
      # fsGroup matches the container's appuser group so the volume's
      # mount root is owned by gid 1000 — without it, SQLite's first
      # write to /var/lib/arkhai fails with permission denied. Applies
      # whether the volume is a PVC or emptyDir.
      securityContext:
        fsGroup: 1000
      # No init container waits on the registry, a chain, or a site: the
      # storefront starts while they are unreachable, reports them degraded in
      # its system status, and its loops retry until they answer. A wait here
      # would hold the pod back on a dependency the process already tolerates.
      containers:
        - name: market-storefront-{{ $agent.name }}
          image: {{ include "storefront.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # entrypoint.sh starts the ZeroTier daemon then execs the
          # CLI verb. Registration and heartbeating are handled inside
          # `serve` at startup — no separate init container needed.
          command:
            - ./entrypoint.sh
            - market-storefront
            - serve
          ports:
            - name: http
              containerPort: {{ $agent.port }}
              protocol: TCP
          {{- if $.Values.zerotierEnabled }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          {{- end }}
          env:
            # Public identity stays in storefront.json. The credential is
            # injected from a dedicated Secret and is never rendered into a
            # ConfigMap, command argument, or chart-generated Secret.
            - name: XDG_CONFIG_HOME
              value: /etc
            - name: ARKHAI_IDENTITY_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: {{ required "storefront agent identity.credentialSecret.name is required" $agent.identity.credentialSecret.name | quote }}
                  key: {{ required "storefront agent identity.credentialSecret.key is required" $agent.identity.credentialSecret.key | quote }}
          volumeMounts:
            {{- if $.Values.zerotierEnabled }}
            - name: tun-device
              mountPath: /dev/net/tun
            {{- end }}
            - name: arkhai-config
              mountPath: /etc/arkhai/storefront.json
              subPath: storefront.json
              readOnly: true
            {{- if $agent.secret.secretName }}
            - name: arkhai-secrets
              mountPath: /etc/arkhai/storefront.secrets.toml
              subPath: {{ $agent.secret.configKey | default "storefront.secrets.toml" }}
              readOnly: true
            {{- end }}
            - name: arkhai-data
              mountPath: {{ $.Values.persistence.mountPath | quote }}
            {{- if $addressBook.configMapName }}
            - name: alkahest-address-book
              mountPath: {{ $addressBook.mountPath | quote }}
              readOnly: true
            {{- end }}
          # /health performs only a fast SQLite ping — safe as a Kubernetes
          # probe with no outbound calls or blocking I/O. The startup probe
          # holds the liveness and readiness probes off until the process
          # first answers, so a slow start is not judged by them and they need
          # no initial delay.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        {{- if $.Values.zerotierEnabled }}
        - name: tun-device
          hostPath:
            path: /dev/net/tun
        {{- end }}
        - name: arkhai-config
          configMap:
            name: {{ include "storefront.agentConfigMapName" (dict "root" $ "agent" $agent) }}
            items:
              - key: storefront.json
                path: storefront.json
        {{- if $agent.secret.secretName }}
        - name: arkhai-secrets
          secret:
            secretName: {{ $agent.secret.secretName | quote }}
            items:
              - key: {{ $agent.secret.configKey | default "storefront.secrets.toml" }}
                path: storefront.secrets.toml
        {{- end }}
        # SQLite agent.db storage. Three modes:
        #   existingClaim set → mount a Terraform-managed PVC by name
        #   persistence.enabled → chart creates and owns the PVC
        #   neither           → emptyDir (pod-lifetime, CI/local only)
        - name: arkhai-data
          {{- if $.Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $.Values.persistence.existingClaim | quote }}
          {{- else if $.Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "storefront.agentPvcName" (dict "root" $ "agent" $agent) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $addressBook.configMapName }}
        - name: alkahest-address-book
          configMap:
            name: {{ $addressBook.configMapName | quote }}
            items:
              - key: {{ $addressBook.key | quote }}
                path: {{ $addressBook.key | quote }}
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
