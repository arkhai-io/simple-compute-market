{{/*
Helm test pod, one per agent whose configuration has a
[Settlement.arkhai_payments] section and whose tests.paymentsAccount names the
account to read: `market-storefront check-payments`, an authenticated read of
that account's balance from the agent's own image, configuration, Secret overlay
holding the payments key, credential, and CA bundle. Those come from the helpers
the agent's Deployment renders them with, so a mount or variable the storefront
lacks fails here too.

It runs the command directly, not through the image's entrypoint, and leaves out
what the command does not use: the data volume, whose ReadWriteOnce claim a pod
on another node could not attach while the storefront holds it; the /health
probes, since no server starts; and the ZeroTier capabilities and device.
*/}}
{{- $agents := dict }}
{{- include "storefront.agents" (dict "root" . "into" $agents) }}
{{- range $name, $entry := $agents }}
{{- $agent := mergeOverwrite (dict "secret" (dict)) $entry (dict "name" $name) }}
{{- $account := (($agent.tests | default dict).paymentsAccount) | default "" }}
{{- if and $account (include "storefront.agentPaymentsSection" $agent | fromJson) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "storefront.agentFullname" (dict "root" $ "agent" $agent) }}-payments-check
  labels:
    {{- include "storefront.testLabels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  # As the Deployment: Service-link variables named for a Service beginning
  # `storefront` would land in the loader's STOREFRONT_ override layer.
  enableServiceLinks: false
  containers:
    - name: payments-check
      image: {{ include "storefront.image" $ }}
      imagePullPolicy: {{ $.Values.image.pullPolicy }}
      command:
        - market-storefront
        - check-payments
        - --account
        - {{ $account | quote }}
      env:
        {{- include "storefront.agentEnv" (dict "root" $ "agent" $agent) | nindent 8 }}
      volumeMounts:
        {{- include "storefront.agentConfigMounts" (dict "root" $ "agent" $agent) | nindent 8 }}
  volumes:
    {{- include "storefront.agentConfigVolumes" (dict "root" $ "agent" $agent) | nindent 4 }}
---
{{- end }}
{{- end }}
