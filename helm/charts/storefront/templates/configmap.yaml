{{/*
Per-agent ConfigMap holding the public storefront document, storefront.json.
Mounted alongside the Secret overlay, storefront.secrets.toml, at /etc/arkhai/;
the storefront merges the two at startup, the overlay winning.

Kept apart from the Secret so non-sensitive edits (log levels, provisioning
mode, RPC URLs) diff as a ConfigMap, with no secret-rotation noise.
*/}}
{{- range $agent := .Values.agents }}
{{- $component := $agent.component | default $agent.name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "storefront.agentConfigMapName" (dict "root" $ "agent" $agent) }}
  labels:
    {{- include "storefront.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | quote }}
data:
  storefront.json: |
    {{- include "storefront.agentConfigDocument" (dict "root" $ "agent" $agent) | nindent 4 }}
---
{{- end }}
