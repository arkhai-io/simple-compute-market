{{/*
Optional locally generated non-identity runtime overlay. Marketplace signer
credentials and EVM wallet keys are accepted only through pre-existing Secret
references and are never rendered by this chart.
*/}}
{{- range $name, $entry := .Values.agents }}
{{- /* An agent states no runtime overlay by omitting `secret`. */}}
{{- $agent := mergeOverwrite (dict "secret" (dict)) $entry (dict "name" $name) }}
{{- if $agent.secret.createSecret }}
{{- $component := $agent.component | default $agent.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "storefront.agentSecretName" (dict "root" $ "agent" $agent) }}
  labels:
    {{- include "storefront.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | quote }}
type: Opaque
stringData:
  storefront.secrets.toml: |
    {{- include "storefront.agentSecretsToml" (dict "root" $ "agent" $agent) | nindent 4 }}
  config-{{ $component }}-secret.yml: |-
    {{ $component }}: {}
---
{{- end }}
{{- end }}
