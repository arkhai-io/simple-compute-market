global:
  registryIdentity:
    authority: registry-a
    principal:
      scheme: eip191
      identifier: "0x90f79bf6eb2c4f870365e785982e1f101e93b906"
  provisioningIdentity:
    scheme: eip191
    identifier: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"

# Default values for the storefront subchart.
# Overridden by the parent chart's storefront: block in helm/values.yaml.
# Values sourced from global (rpc, registry addresses) are injected in
# the templates and do not appear here.

image:
  repository: ""
  name: arkhai
  tag: storefront
  # Production/release profiles pin sha256:<digest>; local development may use tag.
  digest: ""
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Storefront agent(s). The list models per-process identity, not role —
# only sellers run a storefront, so the typical deploy has one entry.
# Operators running multiple seller identities on one cluster (sharded
# by region, by hardware fleet, etc.) add more entries. Buyers do not
# appear here at all: the buyer-side surface is the `market` CLI, run
# as a one-shot client process (or a Job for E2E tests).
#
# Each entry renders one Deployment and Service. `config` is the storefront's own
# configuration, in its own key names, and passes through to a ConfigMap as
# storefront.json: the chart adds only what the release knows (the agent's port
# and Service URL, the internal registry and provisioning URLs, a `default`
# capacity site, and db_path under persistence.mountPath) where it is absent,
# and the storefront validates the rest when it starts. `config` is public: the
# values schema refuses settings the storefront marks secret, which belong in
# the Secret overlay named by `secret`. Write integers above 2^53 as strings;
# every number in a values file passes through a float.
agents:
  - name: bob
    port: 8001
    component: seller
    identity:
      credentialSecret:
        name: arkhai-bob-identity
        key: credential
    # Trust for the release's internal registry, which the chart writes under
    # that registry's derived URL. Required while `config` names no
    # registry.urls; it must include global.registryIdentity.
    internalRegistryTrust:
      authority: registry-a
      principals:
        - scheme: eip191
          identifier: "0x90f79bf6eb2c4f870365e785982e1f101e93b906"
    # Non-identity runtime secrets remain in a separately managed overlay.
    # The chart never accepts or renders private signing material.
    secret:
      createSecret: false
      secretName: arkhai-bob-runtime
      configKey: storefront.secrets.toml
      # Compute resource inventory as raw CSV content. Injected at startup
      # when the resources table is empty (idempotent — skipped on restart
      # if resources are already present). Use make deploy with
      # RESOURCES_CSV_FILE=/path/to/resources.csv to set this via --set-file.
      # Leave empty to start with no inventory (seed via the import API later).
      resourcesCsvInline: ""
      # Write-scoped API key for the listing registry, rendered into the
      # secrets TOML as [registry.auth] keyed by the first registry URL.
      # Required when the registry sets requireWriteApiKey. Never commit a
      # real token; inject via --set at render/deploy time.
      registryAuthToken: ""
    config:
      agent_id: bob
      log_file_path: ./logs/bob.log
      resources_csv_path: /app/src/market_storefront/data/kvm1-machine.csv
      storefront_domains:
        - contribution: vms
          offering_mode: vm
          domain_identity: compute.v1
          contract_version: "1.0"
        - contribution: bare_metal
          offering_mode: bare_metal
          domain_identity: bare_metal.v1
          contract_version: "1.0"
      Identity:
        principal:
          scheme: eip191
          identifier: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"
        service_peers:
          provisioning_default:
            role: service
            site_id: default
            principals:
              - scheme: eip191
                identifier: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
        administrators:
          operator:
            principals:
              - scheme: eip191
                identifier: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"
      provisioning:
        mode: mock
        identity:
          principals:
            - scheme: eip191
              identifier: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
      negotiation:
        policies:
          - has_matching_inventory_guard
          - escrow_shape_guard
          - bisection
      Settlement:
        priority: []

# ---------------------------------------------------------------------------
# Helm smoke-test configuration.
# targetAgentName empty = first configured agent. activeProfiles empty =
# "helm,<selected-component>-secret". secretName empty = selected agent Secret.
# ---------------------------------------------------------------------------
tests:
  targetAgentName: ""
  activeProfiles: ""
  secretName: ""
  secretKey: ""

# Number of replicas per agent.
replicaCount: 1

# Resource requests/limits – tune per environment.
resources: {}
#  requests:
#    cpu: 100m
#    memory: 128Mi
#  limits:
#    cpu: 500m
#    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Persistence — per-agent ReadWriteOnce PVC backing the SQLite agent.db.
#
# Without this, the SQLite file lives on the container's writable overlay
# and is lost on every pod restart (rolling updates, OOM kills, node
# drains). With persistence.enabled=true, each agent gets its own PVC
# mounted at /var/lib/arkhai and the chart pins the Deployment to a
# Recreate strategy so the RWO volume can detach cleanly across rollouts.
#
# enabled: false falls back to an emptyDir mount at the same path so
# kind/CI and local-iteration setups without a StorageClass keep working
# (state still ephemeral). An agent's config.db_path defaults to agent.db
# under mountPath either way.
#
# storageClass: empty string uses the cluster's default StorageClass.
# Set explicitly when the cluster has multiple classes or you want a
# specific one (e.g. "standard-rwo" on GKE, "gp3" on EKS).
#
# accessMode: ReadWriteOnce only — multi-attach RWO would corrupt SQLite.
# A single-replica constraint is enforced via the Recreate strategy and
# replicaCount above.
#
# The PVC carries helm.sh/resource-policy: keep so `helm uninstall` does
# not reap the volume. Reinstalling the release rebinds the existing
# PVC and recovers prior state.
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce
  # Where the PVC mounts inside the pod. An agent whose config states no
  # db_path gets <mountPath>/agent.db; one that states db_path must keep it
  # under this directory for its state to persist.
  mountPath: /var/lib/arkhai
  # existingClaim: when set, the chart mounts this pre-existing PVC
  # and does not create one of its own. Leave empty to let the
  # chart create a PVC (requires persistence.enabled: true).
  existingClaim: ""

# ---------------------------------------------------------------------------
# zerotierEnabled: controls whether ZeroTier networking infrastructure is
# included in the pod spec (NET_ADMIN/SYS_MODULE capabilities and the
# /dev/net/tun hostPath volume).
#
# true  (default) — full ZeroTier support; required for peer-to-peer overlay
#                   networking between seller and buyer agents.
# false           — ZeroTier daemon still starts via entrypoint.sh (fail-soft)
#                   but the pod requests no privileged capabilities and mounts
#                   no hostPath volumes. Use for GKE Autopilot or any
#                   environment where the agent is reachable via an API gateway
#                   rather than a ZeroTier overlay network.
#
# The application runtime is unaffected when zerotier_network is unset in an
# agent's config — all ZeroTier code paths are conditional on that value.
# ---------------------------------------------------------------------------
zerotierEnabled: true
