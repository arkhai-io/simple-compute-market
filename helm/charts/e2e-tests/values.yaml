# Default values for the e2e-tests subchart.
# This subchart is disabled by default — it is dev/CI infrastructure only
# and should never be enabled in a production deployment.
#
# E2E credentials are always supplied by a pre-existing Kubernetes Secret.
# The chart values and rendered manifests never carry private signing material.

# ---------------------------------------------------------------------------
# Integration test image — same image used by all helm test pods.
# ---------------------------------------------------------------------------
integrationTests:
  repository: ""    # falls back to global.imageRepository
  name: arkhai
  tag: e2e-tests
  digest: ""
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# The Secret must contain config-e2e-secret.yml in the shape consumed by the
# e2e test image. Secret creation is deliberately unsupported by this chart.
# ---------------------------------------------------------------------------
createSecret: false
secretName: arkhai-e2e-credentials

# Public EIP-191 principals used by topology/render checks. The corresponding
# wallet and identity credentials remain in the referenced Secret.
seller:
  identity:
    scheme: eip191
    identifier: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"

buyer:
  identity:
    scheme: eip191
    identifier: "0x70997970c51812dc3a010c7d01b50e0d17dc79c8"
