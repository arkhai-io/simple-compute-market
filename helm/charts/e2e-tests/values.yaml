# Default values for the e2e-tests subchart.
# The umbrella chart's defaults enable this subchart, which is dev/CI
# infrastructure only and should never be enabled in a production deployment.
#
# E2E credentials are always supplied by a pre-existing Kubernetes Secret.
# The chart values and rendered manifests never carry private signing material.

# ---------------------------------------------------------------------------
# Integration test image — same image used by all helm test pods.
# ---------------------------------------------------------------------------
integrationTests:
  repository: ""    # falls back to global.imageRepository
  name: arkhai
  tag: e2e-tests
  digest: ""
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# The Secret must contain config-e2e-secret.yml in the shape consumed by the
# e2e test image. Secret creation is deliberately unsupported by this chart.
# ---------------------------------------------------------------------------
createSecret: false
secretName: arkhai-e2e-credentials

# ---------------------------------------------------------------------------
# The end-to-end scenarios the e2e-scenarios test pod runs inside the release's
# namespace, as a pytest marker expression. Empty renders no such pod; a Helm
# validation sets it to the scenarios it runs.
# ---------------------------------------------------------------------------
scenarios:
  markers: ""

# ---------------------------------------------------------------------------
# The PAYMENTS settings the test pods read, in the keys e2e-tests/settings.toml's
# [default.payments] declares; the umbrella writes them into its shared "helm"
# profile (<release>-helm-profile). That profile is a ConfigMap, so only public
# settings are accepted here: the parties' marketplace credentials, development
# authentication, and any key the schema does not name are refused. Empty adds
# no payments settings.
# ---------------------------------------------------------------------------
payments: {}

# ---------------------------------------------------------------------------
# End-to-end settings, passed through whole as the "e2e-tests" profile
# (config-e2e-tests.yml, this chart's ConfigMap), which the deal and scenarios
# test pods layer between the shared "helm" profile and "e2e-secret", so a
# setting reaches them with no template line of its own and no other test pod
# reads it. It is a ConfigMap, so no credential goes here, and the schema
# refuses a key ending in credential, _key, token or secret, in any case, at any
# depth; a setting that needs one names the e2e-secret key holding it (the
# lane_time parties' `<field>_setting`).
# ---------------------------------------------------------------------------
config: {}

# Public EIP-191 principals used by topology/render checks. The corresponding
# wallet and identity credentials remain in the referenced Secret.
seller:
  identity:
    scheme: eip191
    identifier: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"

buyer:
  identity:
    scheme: eip191
    identifier: "0x70997970c51812dc3a010c7d01b50e0d17dc79c8"
  profileStore:
    existingClaim: arkhai-buyer-profiles
    mountPath: /var/lib/arkhai-buyer
  credentialSecret:
    name: arkhai-buyer-profile-credential
    key: credential
    mountPath: /run/secrets/arkhai/buyer-credential
