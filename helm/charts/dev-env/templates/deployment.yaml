apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-env.fullname" . }}
  labels:
    {{- include "dev-env.labels" . | nindent 4 }}
spec:
  # Anvil maintains in-memory chain state; more than one replica is not useful.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dev-env.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev-env.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: anvil
          image: {{ include "dev-env.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: rpc
              containerPort: {{ .Values.global.rpc.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # Anvil only accepts JSON-RPC POST requests — a bare HTTP GET returns 400
          # so httpGet probes will always fail. The image's own `cast` makes a
          # valid call; the image installs no other client.
          livenessProbe:
            exec:
              command:
                - cast
                - block-number
                - --rpc-url
                - http://localhost:8545
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - cast
                - block-number
                - --rpc-url
                - http://localhost:8545
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}