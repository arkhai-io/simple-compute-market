# Default values for dev-env.
# These are overridden by the parent chart's dev-env: block in values.yaml.
# The RPC port and host are authoritative in global.rpc (parent values.yaml)
# and are not duplicated here.

image:
  repository: ""
  name: arkhai
  tag: dev-env
  pullPolicy: IfNotPresent

service:
  type: NodePort

env:
  ANVIL_IP_ADDR: "0.0.0.0"

# Number of replicas. Anvil is stateful so this should stay at 1.
replicaCount: 1

# Resource requests/limits – tune per environment.
resources: {}
#  requests:
#    cpu: 100m
#    memory: 128Mi
#  limits:
#    cpu: 500m
#    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
# Mailpit: an SMTP server with a query API, for test releases that verify
# seller-side introduction delivery by reading back what was sent. Off by
# default; never part of a production release.
mailpit:
  enabled: false
  image: docker.io/axllent/mailpit:v1.27
  smtpPort: 1025
  apiPort: 8025
