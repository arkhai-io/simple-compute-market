global:
  imageRepository: ""

image:
  repository: ""
  name: arkhai
  tag: bare-metal-storefront
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

identity:
  principal:
    scheme: eip191
    identifier: "0x0000000000000000000000000000000000000000"
  credentialSecret:
    name: bare-metal-storefront-identity
    key: credential

adminPrincipals:
  - scheme: eip191
    identifier: "0x0000000000000000000000000000000000000000"

# Null omits site authority for contact-only settlement composition.
# Existing Secret containing one JSON array under `key`. Each entry is exactly:
# {"site_id":"...","authority_url":"https://...","authority_principal":
#  {"scheme":"eip191|ed25519","identifier":"..."}}.
# URLs and routing topology therefore never enter chart-generated ConfigMaps.
siteBindingsSecret:
  name: bare-metal-storefront-sites
  key: sites.json
sitePlacement: fill_first

publicUrl: http://bare-metal-storefront:8000
sellerEvmAddress: ""
alkahestEnabled: false

# Strict shared Settlement configuration JSON. Hosted credentials remain in the
# independently deployed hosted authority. Contact configuration includes private
# seller contact payloads and must remain in this existing Secret.
settlementConfigSecret:
  name: bare-metal-storefront-settlement
  key: settlement.json
databasePath: /var/lib/arkhai/bare-metal-storefront.db

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /var/lib/arkhai

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Opt-in synthetic introduction publication. Supply an existing ConfigMap file
# and independent registry trust/API-key Secret references; null performs no I/O.
# contactOffers:
#   configMap: {name: synthetic-contact-offers, key: offers.json}
#   registry:
#     url: https://registry.example.invalid
#     authority: synthetic-registry
#     principals: [{scheme: ed25519, identifier: "<canonical public principal>"}]
#     apiKeySecret: {name: contact-registry-write, key: api-key}
contactOffers: null

# Opt-in general declarations; the same reference shape as contactOffers.
# The modes are mutually exclusive. File contents are validated by the runtime.
contactDeclarations: null

# Optional private two-sided contact delivery settings; no default enrollment.
deliveryConfigSecret: null
