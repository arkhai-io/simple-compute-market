global:
  imageRepository: ""

image:
  repository: ""
  name: arkhai
  tag: bare-metal-storefront
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

identity:
  principal:
    scheme: eip191
    identifier: "0x0000000000000000000000000000000000000000"
  credentialSecret:
    name: bare-metal-storefront-identity
    key: credential

adminPrincipals:
  - scheme: eip191
    identifier: "0x0000000000000000000000000000000000000000"

# Existing Secret containing one JSON array under `key`. Each entry is exactly:
# {"site_id":"...","authority_url":"https://...","authority_principal":
#  {"scheme":"eip191|ed25519","identifier":"..."}}.
# URLs and routing topology therefore never enter chart-generated ConfigMaps.
siteBindingsSecret:
  name: bare-metal-storefront-sites
  key: sites.json
sitePlacement: fill_first

# Existing Secret holding the write-scoped registry API key this seller
# publishes with. Leave `name` empty for a registry with open publishing: no
# environment entry is then rendered and publication carries request
# signatures only. Never a literal key — a value placed here is rendered into
# an object that is not a Secret.
registryApiKeySecret:
  name: ""
  key: api-key

publicUrl: http://bare-metal-storefront:8000
sellerEvmAddress: ""
alkahestEnabled: false

# Chain endpoints for Alkahest, as the JSON object the runtime reads: a map of
# chain name to `rpc_url` plus an optional `alkahest_address_config_path`.
# Public routing only. Required when alkahestEnabled; ignored otherwise, so a
# hosted-only role constructs no wallet, RPC, or chain client.
chainsJson: ""

# Deployed contract addresses for a chain that has no published address set,
# such as a local or custom deployment. Mounted read-only; point the matching
# chain's `alkahest_address_config_path` in chainsJson at
# `<mountPath>/<key>`. Without this the runtime resolves no address
# configuration for such a chain and builds no settlement client, so rendering
# chainsJson alone does not make the role able to settle.
chainAddressConfig:
  enabled: false
  secretName: ""
  key: alkahest-addresses.json
  mountPath: /etc/arkhai/chain

# Existing Secret holding the seller's settlement signing key. Never a literal:
# a key placed in chart values is rendered into an object that is not a Secret.
walletSecret:
  name: bare-metal-storefront-wallet
  key: private-key

# Strict shared Settlement configuration JSON. Hosted credentials remain in the
# independently deployed hosted authority; this Secret contains only public
# authority/trust/account references and release pins.
settlementConfigSecret:
  name: bare-metal-storefront-settlement
  key: settlement.json
databasePath: /var/lib/arkhai/bare-metal-storefront.db

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /var/lib/arkhai

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
