apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bare-metal-storefront.fullname" . }}
  labels:
    {{- include "bare-metal-storefront.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bare-metal-storefront.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bare-metal-storefront.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: bare-metal-storefront
          image: {{ include "bare-metal-storefront.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bare-metal-storefront
            - serve
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.service.port | quote }}
          env:
            - name: BARE_METAL_STOREFRONT_IDENTITY_SCHEME
              value: {{ .Values.identity.principal.scheme | quote }}
            - name: BARE_METAL_STOREFRONT_IDENTITY_IDENTIFIER
              value: {{ .Values.identity.principal.identifier | quote }}
            - name: BARE_METAL_STOREFRONT_ADMIN_IDENTITIES
              value: {{ .Values.adminPrincipals | toJson | quote }}
            - name: BARE_METAL_STOREFRONT_PUBLIC_URL
              value: {{ required "bare-metal storefront publicUrl is required" .Values.publicUrl | quote }}
            {{- if .Values.alkahestEnabled }}
            - name: BARE_METAL_STOREFRONT_EVM_ADDRESS
              value: {{ required "sellerEvmAddress is required when Alkahest is enabled" .Values.sellerEvmAddress | quote }}
            # Chain routing and the signing key are rendered together: the
            # runtime treats a configured chain without a key as a missing
            # wallet and refuses to build the settlement client, so a partial
            # render produces a role that starts and cannot settle.
            - name: BARE_METAL_STOREFRONT_CHAINS
              value: {{ required "chainsJson is required when Alkahest is enabled" .Values.chainsJson | quote }}
            - name: BARE_METAL_STOREFRONT_EVM_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "walletSecret.name is required when Alkahest is enabled" .Values.walletSecret.name | quote }}
                  key: {{ required "walletSecret.key is required when Alkahest is enabled" .Values.walletSecret.key | quote }}
            {{- end }}
            - name: BARE_METAL_STOREFRONT_SETTLEMENT
              valueFrom:
                secretKeyRef:
                  name: {{ required "bare-metal settlement config Secret name is required" .Values.settlementConfigSecret.name | quote }}
                  key: {{ required "bare-metal settlement config Secret key is required" .Values.settlementConfigSecret.key | quote }}
            - name: BARE_METAL_STOREFRONT_SITE_PLACEMENT
              value: {{ .Values.sitePlacement | quote }}
            - name: BARE_METAL_STOREFRONT_DB_PATH
              value: {{ .Values.databasePath | quote }}
            - name: ARKHAI_IDENTITY_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: {{ required "bare-metal storefront identity credential Secret name is required" .Values.identity.credentialSecret.name | quote }}
                  key: {{ required "bare-metal storefront identity credential Secret key is required" .Values.identity.credentialSecret.key | quote }}
            - name: BARE_METAL_STOREFRONT_SITES
              valueFrom:
                secretKeyRef:
                  name: {{ required "bare-metal storefront site bindings Secret name is required" .Values.siteBindingsSecret.name | quote }}
                  key: {{ required "bare-metal storefront site bindings Secret key is required" .Values.siteBindingsSecret.key | quote }}
            {{- if .Values.registryApiKeySecret.name }}
            # Publication runs in this container, so the write credential is
            # part of the container environment rather than a command argument
            # that would appear in process listings and shell history.
            - name: BARE_METAL_STOREFRONT_REGISTRY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registryApiKeySecret.name | quote }}
                  key: {{ required "registryApiKeySecret.key is required when registryApiKeySecret.name is set" .Values.registryApiKeySecret.key | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- if .Values.chainAddressConfig.enabled }}
            - name: chain-address-config
              mountPath: {{ .Values.chainAddressConfig.mountPath | quote }}
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.chainAddressConfig.enabled }}
        - name: chain-address-config
          secret:
            secretName: {{ required "chainAddressConfig.secretName is required when enabled" .Values.chainAddressConfig.secretName | quote }}
            items:
              - key: {{ required "chainAddressConfig.key is required when enabled" .Values.chainAddressConfig.key | quote }}
                path: {{ .Values.chainAddressConfig.key | quote }}
        {{- end }}
        - name: data
          {{- if or .Values.persistence.enabled .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ include "bare-metal-storefront.pvcName" . | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
