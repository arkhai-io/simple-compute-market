{{/*
One storefront process. The pod mounts storefront.json (the ConfigMap) and, when
`secret` names one, storefront.secrets.toml (an existing Secret) at
/etc/arkhai/, and points XDG_CONFIG_HOME at /etc so the storefront's loader
finds them. Its environment carries XDG_CONFIG_HOME and the signing credential
only: every setting, the payments key and the CA bundle's path among them,
reaches the storefront through those files. The environment and the configuration
mounts are the payments check test pod's too
(templates/tests/payments-check-test.yaml). Service
links are off because Kubernetes would otherwise inject variables for every
Service in the namespace, and those named for a Service beginning `storefront`
would land in the loader's STOREFRONT_ override layer.

checksum/config rolls the pod when the rendered configuration changes.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bare-metal-storefront.fullname" . }}
  labels:
    {{- include "bare-metal-storefront.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bare-metal-storefront.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bare-metal-storefront.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1001
      containers:
        - name: bare-metal-storefront
          image: {{ include "bare-metal-storefront.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bare-metal-storefront
            - serve
          env:
            {{- include "bare-metal-storefront.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          volumeMounts:
            {{- include "bare-metal-storefront.configMounts" . | nindent 12 }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "bare-metal-storefront.configVolumes" . | nindent 8 }}
        - name: data
          {{- if or .Values.persistence.enabled .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ include "bare-metal-storefront.pvcName" . | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
