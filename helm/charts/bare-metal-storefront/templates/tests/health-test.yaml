apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bare-metal-storefront.fullname" . }}-health-test
  labels:
    {{- include "bare-metal-storefront.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: busybox:1.36
      command:
        - wget
        - -qO-
        - {{ printf "http://%s:%d/health" (include "bare-metal-storefront.fullname" .) (int .Values.port) | quote }}
