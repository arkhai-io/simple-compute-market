{{- /*
  The bootstrap and administrator keys are secret settings, which reach the
  registry in the profile file of a Secret the deployment supplies, never as a
  pod variable from a chart-named Secret key.
*/}}
{{- $auth := .Values.auth | default dict -}}
{{- range $key := list "bootstrapKeySecret" "adminKeySecret" -}}
{{- if (get $auth $key | default dict).name -}}
{{- fail (printf "registry auth.%s is retired: state the key in a Secret's config-<profile>.env and name it with secretProfile" $key) -}}
{{- end -}}
{{- end -}}
{{- $secretProfile := .Values.secretProfile | default dict -}}
{{- if and .Values.config.requireReadApiKey (not .Values.descriptor.accessAcquisitionPointer) -}}
{{- fail "key-gated registry descriptor requires an access acquisition pointer" -}}
{{- end -}}
{{- if and (not .Values.config.requireReadApiKey) .Values.descriptor.accessAcquisitionPointer -}}
{{- fail "public registry descriptor must not configure an access acquisition pointer" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "registry.fullname" . }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate strategy: the indexer.db PVC is ReadWriteOnce; rolling
  # updates would deadlock waiting for the old pod to release it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "registry.selectorLabels" . | nindent 8 }}
      annotations:
        # The settings are in a ConfigMap, which a pod does not reread, so a
        # release that changes one rolls the pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # fsGroup matches the container's appuser (UID 1000); without it
      # the PVC's mount root is root-owned and SQLite can't write.
      securityContext:
        fsGroup: 1000
      containers:
        - name: registry
          image: {{ include "registry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # Only the resolver variables: every setting is in a profile file under
          # the configuration directory, and a pod variable would override it.
          env:
            - name: CONFIG_DIRECTORY
              value: "/app/config"
            - name: ACTIVE_PROFILES
              value: {{ include "registry.activeProfiles" . | quote }}
          volumeMounts:
            - name: arkhai-data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            - name: registry-identity
              mountPath: {{ include "registry.credentialFile" . | dir }}
              readOnly: true
            - name: config
              mountPath: /app/config/config-production.env
              subPath: config-production.env
              readOnly: true
            {{- if $secretProfile.secretName }}
            {{- $profile := include "registry.secretProfileName" . }}
            - name: secret-profile
              mountPath: {{ printf "/app/config/config-%s.env" $profile | quote }}
              subPath: {{ printf "config-%s.env" $profile | quote }}
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # SQLite indexer.db storage. Three modes:
        #   existingClaim set → mount a Terraform-managed PVC by name
        #   persistence.enabled → chart creates and owns the PVC
        #   neither           → emptyDir (pod-lifetime, CI/local only)
        - name: arkhai-data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "registry.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: registry-identity
          secret:
            secretName: {{ required "registry identity credential Secret name is required" .Values.identity.credentialSecret.name | quote }}
            items:
              - key: {{ required "registry identity credential Secret key is required" .Values.identity.credentialSecret.key | quote }}
                path: {{ include "registry.credentialFile" . | base }}
        - name: config
          configMap:
            name: {{ include "registry.configMapName" . | quote }}
        {{- if $secretProfile.secretName }}
        {{- $profile := include "registry.secretProfileName" . }}
        - name: secret-profile
          secret:
            secretName: {{ $secretProfile.secretName | quote }}
            items:
              - key: {{ printf "config-%s.env" $profile | quote }}
                path: {{ printf "config-%s.env" $profile | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
