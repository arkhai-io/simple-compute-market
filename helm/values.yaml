# Global image settings shared across subcharts.
# imageRepository can be set to a registry prefix, e.g. "registry.example.com/arkhai"
# Leave empty ("") to use bare image names (matches local Docker builds).
global:
  imageRepository: ""
  registryIdentity:
    authority: registry-a
    principal:
      scheme: eip191
      identifier: "0x90f79bf6eb2c4f870365e785982e1f101e93b906"
  provisioningIdentity:
    scheme: eip191
    identifier: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
  integrationTests:
    repository: ""
    name: arkhai
    tag: e2e-tests
    digest: ""
    pullPolicy: IfNotPresent

  # ---------------------------------------------------------------------------
  # Optional chain/network configuration. Required only by explicitly selected
  # EVM effects; hosted-only profiles omit this block and disable dev-env.
  # ---------------------------------------------------------------------------
  rpc:
    enabled: true
    chainId: 31337
    host: "arkhai-node-operator-dev-env"
    port: 8545
  # ---------------------------------------------------------------------------
  # Registry service coordinates shared across all subcharts. Empty host
  # derives the release-scoped Service name; set it only for an external
  # registry.
  # ---------------------------------------------------------------------------
  registry:
    host: ""
    port: 8080

  # Provisioning service coordinates. Surfaced in globals so the
  # storefront subchart can compose seller.provisioning.service_url
  # without hardcoding a string.
  provisioning:
    host: "arkhai-node-operator-provisioning"
    port: 8081
  # ---------------------------------------------------------------------------
  # Smoke-test Dynaconf profiles mounted into helm-test pods only. Runtime
  # Deployments keep their existing config paths.
  #
  # config.profileFiles: preferred smoke-test file-driven injection; each key
  # renders as config-<profile>.yml in the shared test ConfigMap.
  # config.profile/config.values: generated values-driven profile. The chart
  # derives service URLs and chain topology, then config.values can override or
  # extend that generated profile. If profileFiles are present, smoke pods use
  # those profile names by default; the generated profile remains available for
  # non-smoke hooks unless profileFiles define the same profile key.
  #
  # secret.enabled: false preserves the local selected-agent secret fallback for
  # storefront smoke tests. Set true to mount a smoke-test secret and append its
  # profile(s) to ACTIVE_PROFILES. create=false points at a pre-existing Secret
  # by name; create=true renders either an internal Secret from values/profileFiles
  # or an ExternalSecret from profileRefs.
  # ---------------------------------------------------------------------------
  smokeTests:
    activeProfiles: ""
    config:
      profileFiles: {}
      profile: helm
      values: {}
    secret:
      enabled: false
      create: true
      type: internal
      name: ""
      profile: seller-secret
      internal:
        profileFiles: {}
        values: {}
      external:
        secretStoreRef:
          name: gcp-secret-manager
          kind: ClusterSecretStore
        refreshInterval: 1h
        profileRefs: {}

# ---------------------------------------------------------------------------
# dev-env subchart
# ---------------------------------------------------------------------------
dev-env:
  enabled: true

  image:
    repository: ""
    name: arkhai
    tag: dev-env
    pullPolicy: IfNotPresent

  service:
    type: NodePort

  env:
    ANVIL_IP_ADDR: "0.0.0.0"

# ---------------------------------------------------------------------------
# registry subchart
# ---------------------------------------------------------------------------
registry:
  enabled: true

  image:
    repository: ""
    name: arkhai
    tag: registry
    pullPolicy: IfNotPresent
    digest: ""
  identity:
    authority: registry-a
    principal:
      scheme: eip191
      identifier: "0x90f79bf6eb2c4f870365e785982e1f101e93b906"
    credentialSecret:
      name: arkhai-registry-identity
      key: credential

  service:
    type: NodePort
    port: 8080

  config:
    databaseUrl: "sqlite:///./indexer.db"
    host: "0.0.0.0"
    enableHealthChecks: true
    healthCheckInterval: 60
    endpointCheckTimeout: 10
    heartbeatTtlSecs: 60
    logLevel: "info"

# ---------------------------------------------------------------------------
# storefront subchart
# ---------------------------------------------------------------------------
storefront:
  enabled: true

  image:
    repository: ""
    name: arkhai
    tag: storefront
    digest: ""
    settlementConfigSchemaVersion: 1
    pullPolicy: IfNotPresent

  # Only sellers run a storefront; the `market` buyer CLI is a pure HTTP
  # client and is invoked as a one-shot process (or a helm-test Job),
  # not deployed alongside the storefront. Add more agents: entries to
  # run multiple seller identities on one cluster.
  # See helm/charts/storefront/values.yaml for the per-agent schema.
  agents:
    - name: bob
      port: 8001
      component: seller
      agentId: ""        # pin after first registration; see charts/storefront/values.yaml
      autoRegister: true # set false once registered to prevent accidental re-registration
      identity:
        principal:
          scheme: eip191
          identifier: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"
        credentialSecret:
          name: arkhai-bob-identity
          key: credential
        servicePeers:
          provisioning_default:
            role: service
            siteId: default
            principals:
              - scheme: eip191
                identifier: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
        administrators:
          operator:
            principals:
              - scheme: eip191
                identifier: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"
      secret:
        createSecret: false
        secretName: arkhai-bob-runtime
        configKey: storefront.secrets.toml
      config:
        storefrontDomains:
          - contribution: vms
            offeringMode: vm
            domainIdentity: compute.v1
            contractVersion: "1.0"
          - contribution: bare_metal
            offeringMode: bare_metal
            domainIdentity: bare_metal.v1
            contractVersion: "1.0"
        registryAuthority:
          authority: registry-a
          principals:
            - scheme: eip191
              identifier: "0x90f79bf6eb2c4f870365e785982e1f101e93b906"
        seller:
          agentId: bob
          dbPath: "./agent.db"
          logFilePath: "./logs/bob.log"
          enableEventQueue: false
          provisioning:
            mode: "mock"
            identity:
              principals:
                - scheme: eip191
                  identifier: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
          negotiation:
            policies:
              - "has_matching_inventory_guard"
              - "escrow_shape_guard"
              - "bisection"
          integrations:
            geminiApiKey: ""
        settlement:
          schema_version: 1
          priority: []
        wallet: {}
        chains: {}


# ---------------------------------------------------------------------------
# provisioning subchart
# ---------------------------------------------------------------------------
provisioning:
  enabled: true
  # Activate MockAnsibleService for dev/CI clusters. Production profiles keep
  # these same Secret references and supply real operator-managed contents.
  mockMode: true

  server:
    image:
      repository: ""
      digest: ""
      name: arkhai
      tag: compute-provisioning
      pullPolicy: IfNotPresent
    replicaCount: 1
    port: 8081
    type: ClusterIP
    host: "0.0.0.0"

  sshKey:
    createSecret: false
    secretName: arkhai-provisioning-ssh

  sshDecryptionKey:
    createSecret: false
    secretName: arkhai-provisioning-runtime

  identity:
    principal:
      scheme: eip191
      identifier: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
    credentialSecret:
      name: arkhai-provisioning-identity
      key: credential

  storefrontIdentity:
    principals:
      - scheme: eip191
        identifier: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"

  adminIdentity:
    principals:
      - scheme: eip191
        identifier: "0x9965507d1a55bcc2695c58ba16fb37d819b0a4dc"

  storefront:
    url: ""          # empty -> http://{release}-storefront-bob:8001
    agentName: "bob"
    port: 8001

  config:
    log_level: "info"
    database_url: "sqlite:////app/data/provisioning.db"
    ansible_timeout_seconds: 1800
    default_vm_host: "kvm1"
    lease_watchdog_enabled: true
    lease_watchdog_poll_interval_seconds: 60
    lease_watchdog_grace_period_seconds: 300
    storefront_site_id: "default"
    enable_rate_limiting: false
    rate_limit_requests_per_minute: 30

  redis:
    image: "redis:7-alpine"
    port: 6379
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# validate-contracts subchart
# Runs the contract validation helm test.
# When dev-env is enabled, tests run against that deployment via global.rpc.
# When dev-env is disabled, set rpcUrl to point at your target endpoint.
# ---------------------------------------------------------------------------
validate-contracts:
  enabled: true
  # Override the RPC endpoint. Leave empty to use global.rpc.host:port
  # (i.e. the dev-env service when that subchart is enabled).
  rpcUrl: ""

integrationTests:
  image:
    repository: ""
    name: arkhai
    tag: e2e-tests
    pullPolicy: IfNotPresent
    digest: ""

# ---------------------------------------------------------------------------
# e2e-tests subchart
# Full buyer-seller deal lifecycle test suite. Dev / CI only — disabled by
# default. Enable with --set e2e-tests.enabled=true or in a CI values overlay.
# Credentials default to the deterministic Anvil test keys; override for other
# environments.
# ---------------------------------------------------------------------------
e2e-tests:
  enabled: true

  integrationTests:
    repository: ""
    name: arkhai
    tag: e2e-tests
    digest: ""
    pullPolicy: IfNotPresent

  # E2E credentials are supplied only by a pre-existing Secret. The chart
  # carries no private key values even for deterministic local-chain profiles.
  createSecret: false
  secretName: arkhai-e2e-credentials
