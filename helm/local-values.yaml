# Overlay for a local development deployment (`make deploy-local`), layered on
# values.yaml. Persistent volumes are not retained when the release is
# uninstalled, so uninstalling and deploying again starts every service from no
# state rather than from whatever an earlier deployment of other code wrote.
#
# Bob also sells here. A storefront with no enabled settlement mechanism refuses
# to start, and the chart defaults enable none, so this overlay enables Alkahest
# on the Anvil chain the dev-env chart deploys, with that chart's address book
# mounted, and contact exchange. Agents are keyed by name and Helm merges maps
# key by key, so only what differs from Bob's agent in values.yaml is stated.
#
# Bob is also configured for Arkhai payments, through the values a deployment
# supplies, as the deployment's rehearsal: [Settlement.arkhai_payments] in his
# configuration, the CA bundle ConfigMap `payments-ca-bundle`, from which the
# chart derives the section's ca_bundle_path, and the payments key as the
# section's api_key in his runtime Secret's overlay, never development
# authentication. The payments service is the payments lane double this overlay
# enables, whose committed fixtures (tools/payments-lane-double/fixtures/, tls/)
# every payments value below restates; a render test holds them equal. Each is a
# public development value, never for a public network. `make -C helm
# topology-secrets` creates the ConfigMap from the committed lane CA and writes
# into the overlay the double's seller token and Bob's [[DisputeCredential]]
# toward the dispute authority the registry below recommends, copied from his
# Compose secret overlay; without it, servicing would report his payment deals
# repair_required. `check-local-secrets` requires the ConfigMap and the
# overlay's Secret, not what the overlay holds: the storefront itself reports a
# Secret written without the token, its payments readiness blocked by
# arkhai_payments.api_key_missing, and `helm test`'s payments check fails at its
# configuration step, naming neither api_key nor api_key_env configured. The
# release serves no payment scenario; that check reads
# Bob's own balance at the double.
payments-lane-double:
  enabled: true
storefront:
  persistence:
    retainOnUninstall: false
  agents:
    bob:
      # The dev-env chart's ConfigMap of its Anvil's contract addresses; both
      # address paths below name the file it mounts.
      alkahestAddressBook:
        configMapName: arkhai-node-operator-dev-env-alkahest-addresses
        key: alkahest_anvil_addresses.json
        mountPath: /etc/arkhai/alkahest
      # The lane CA, the only CA Bob's HTTPS peer, the double, chains to.
      caBundle:
        configMapName: payments-ca-bundle
        key: ca-bundle.pem
      # The double's seller account, whose balance the payments check reads.
      tests:
        paymentsAccount: 00000000-0000-4000-8000-0000000000b2
      config:
        # Development values only, never for a public network: the address is
        # Anvil's deterministic account 2, whose key every Anvil instance
        # publishes, and the chain is the release's own Anvil. The key itself
        # is the one value Alkahest needs that the chart never renders: the
        # agent's Secret overlay, arkhai-bob-runtime, carries it as
        # storefront.secrets.toml's [Wallet] private_key = "<account 2's key>"
        # (`make -C helm topology-secrets` creates it, with the smoke test's
        # config-seller-secret.yml beside it).
        Wallet:
          address: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"
        Chains:
          anvil:
            rpc_url: http://arkhai-node-operator-dev-env:8545
            chain_id: 31337
        pricing:
          # The dev chain's deterministic test token, as the Compose lane sells.
          settlements:
            - mechanism: alkahest.v1
              asset: "0x9fe46736679d2d9a65f0992f2272de9f3c7fa6e0"
              rate: "100"
              per: hour
              mechanism_input:
                chain: anvil
                escrow_kind: erc20_escrow_obligation_default
        Settlement:
          schema_version: 1
          priority:
            - alkahest.v1
            - contact-exchange.v1
            - arkhai.payments.v1
          alkahest:
            enabled: true
            # The dev-env chart's address book, mounted by alkahestAddressBook.
            address_books:
              anvil: /etc/arkhai/alkahest/alkahest_anvil_addresses.json
            release_models: [recipient]
            trusted_oracle_addresses: []
            interruptible_oracle_addresses: []
          # The payments lane double: its Service, its receipt identity, and its
          # fee policy. The key is api_key in the runtime Secret's overlay.
          arkhai_payments:
            enabled: true
            service_url: https://payments-double:8443
            service_identity:
              scheme: ed25519
              identifier: kaKKC3Q4FZOk2UaVeSCJJq_IrYLIg5t2RDWbnrqaSzo
            fee_bps: 250
            livemode: false
          # Offered only on listings whose clauses select it, such as a pool
          # override's. A development contact on a reserved domain.
          contact:
            enabled: true
            origins:
              default:
                contact_payload:
                  email: bob-sales@seller.invalid
            profiles:
              default:
                channel: email
                terms: Quoted per engagement; reply within one business day.
provisioning:
  persistence:
    retainOnUninstall: false
registry:
  persistence:
    retainOnUninstall: false
  # The payments lane double's pinned dispute authority
  # (tools/payments-lane-double/fixtures/dispute-authority.toml), which sellers
  # and buyers take from the registry's recommendations. Nobody can act as it:
  # its origin is under .invalid, which never resolves, its record key has no
  # usable private half, and its account has no token at the double.
  descriptor:
    recommendedDisputeAuthorities:
      - interface: arkhai.mediation.v1
        origin: https://dispute.invalid
        account: 00000000-0000-4000-8000-0000000000d1
        record_key: "ed25519:lMg0OhYvDsBJf2G3MtLHgbPX3spRLUCV20o7HY7AFOI"
        params: {}
        advertisement:
          mechanisms: [arkhai.payments.v1]
          minimum_dispute_window_seconds: 0
  # The registry smoke test signs its reads as the release's development buyer.
  # Its credential is never here: it layers the e2e-tests chart's out-of-band
  # Secret's config-e2e-secret.yml, whose buyer.marketplace_credential
  # ("<Anvil account 1's key>", quoted: YAML reads an unquoted 0x-prefixed value
  # as an integer) the deal test reads too, so one Secret holds the one copy.
  # `make -C helm topology-secrets` creates that Secret from Anvil's
  # deterministic development accounts (never for a public network);
  # `topology-check`, `test`, and `test-module MODULE=registry` require it.
  tests:
    credentialProfile:
      secretName: arkhai-e2e-credentials
      profile: e2e-secret
api-credits-registry:
  persistence:
    retainOnUninstall: false
bare-metal-storefront:
  persistence:
    retainOnUninstall: false
# The PAYMENTS settings the end-to-end test pods read, for the payments lane
# double above, as a Compose lane's runner receives them; the target is the
# release's own, so an unready one fails a payment scenario rather than
# skipping it. Public development values, never for a public network, restated
# from the double's fixtures: no marketplace credential or bearer token is here,
# and the release serves no payment scenario.
e2e-tests:
  payments:
    service_url: https://payments-double:8443
    service_identity: kaKKC3Q4FZOk2UaVeSCJJq_IrYLIg5t2RDWbnrqaSzo
    fee_bps: 250
    livemode: false
    lane_owned: true
    api_key_env: PAYMENTS_BUYER_API_KEY
    buyer_account: 00000000-0000-4000-8000-0000000000b1
    seller_account: 00000000-0000-4000-8000-0000000000b2
