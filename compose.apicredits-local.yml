# Development overlay for the API-credit market: its services' identities,
# admin credential, configuration files, secret overlay and registry profile,
# and the credits buyer service.
#
# Layered over compose.apicredits.yml, which includes compose.dev.yml for the
# dev chain. The API-credit end-to-end lane adds the payments double and
# compose.apicredits-lane.yml, the compute registry its scenario routes
# discovery across:
#
#     docker compose -p simple-market-apicredits \
#       -f compose.apicredits.yml -f compose.apicredits-local.yml \
#       -f compose.payments-double.yml -f compose.apicredits-lane.yml up -d
#
# `make -C e2e-tests test-e2e-apicredits` does exactly this. The full local stack
# layers this file and compose.vms-local.yml over docker-compose.yml instead; see
# that file.
#
# An overlay, applied with `-f`, for the reason compose.vms-local.yml gives.
# Every path is relative to the repository root, the project directory of every
# `-f` file, and every value it binds is committed: a well-known development
# value that must never be used on a public network; see
# dev-env/identities/README.md.

services:
  api-credits-registry:
    environment:
      - CONFIG_DIRECTORY=/etc/arkhai/registry
      - ACTIVE_PROFILES=api-credits-registry
    volumes:
      - ./dev-env/registry:/etc/arkhai/registry:ro
      - ./dev-env/identities/api-credits-registry.ed25519:/run/secrets/arkhai/registry-identity/credential:ro
  credits-service:
    volumes:
      - ./dev-env/identities/api-credits-admin-key:/run/secrets/arkhai/api-credits-admin-key:ro
      - ./dev-env/identities/api-credits-service.ed25519:/run/secrets/arkhai/api-credits-service/credential:ro
  sample-app:
    volumes:
      - ./dev-env/identities/api-credits-admin-key:/run/secrets/arkhai/api-credits-admin-key:ro
      - ./dev-env/identities/api-credits-gated-app.ed25519:/run/secrets/arkhai/api-credits-gated-app/credential:ro
  credits-storefront:
    env_file:
      - ./dev-env/identities/api-credits.identity.env
    volumes:
      - ./domains/apicredits/storefront/storefront.credits.toml:/etc/arkhai/storefront.toml:ro
      # The wallet key, and in the API-credit lane the payments key.
      - ./dev-env/identities/api-credits.storefront.secrets.toml:/etc/arkhai/storefront.secrets.toml:ro
      # The dev chain's deployed Alkahest contract addresses, shipped with the
      # Alkahest kit. A non-Anvil deployment supplies its own address book here.
      - ./kit/alkahest/src/market_alkahest/data/alkahest_anvil_addresses.json:/app/alkahest_anvil_addresses.json:ro
      - ./dev-env/identities/api-credits-admin-key:/run/secrets/arkhai/api-credits-admin-key:ro
  # A one-shot buyer, run by hand, as compose.vms-local.yml's buyer-cli is: its
  # Git-ignored profile and run-state directories must exist, writable by uid
  # and gid 1000, before it runs.
  credits-buyer-cli:
    image: arkhai:e2e-tests
    profiles: [buyer]
    user: "1000:1000"
    entrypoint: ["market"]
    command: ["profile", "show"]
    environment:
      XDG_CONFIG_HOME: /etc
      XDG_DATA_HOME: /var/lib/arkhai-buyer
      XDG_STATE_HOME: /var/lib/arkhai-buyer-state
    volumes:
      - ./dev-env/identities/api-credits-buyer.config.toml:/etc/arkhai/config.toml:ro
      - ./.e2e-buyer/apicredits/profile:/var/lib/arkhai-buyer/arkhai/buyer:rw
      - ./.e2e-buyer/apicredits/state:/var/lib/arkhai-buyer-state/arkhai:rw
      - ./dev-env/identities/buyer.eip191:/run/secrets/arkhai/buyer-credential:ro
