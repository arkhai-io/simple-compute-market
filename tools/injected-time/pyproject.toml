[project]
name = "arkhai-injected-time"
version = "0.1.0"
license = "MIT"
description = "One source of the time of the world per process: wall time, or an injected instant a test sets and moves forward"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/injected_time"]

[tool.pytest.ini_options]
testpaths = ["tests"]
