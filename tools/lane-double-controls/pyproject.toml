[project]
name = "lane-double-controls"
version = "0.1.0"
license = "MIT"
description = "The control contract of the end-to-end lanes' payments and mediation doubles: models, routes, typed client and transport-fault middleware"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Rulings and effects are validated against its vendored contract.
    "arkhai-kit-arkhai-mediation>=0.2.0",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    # The TLS generator's; make check-tls runs it, and the doubles' images run it
    # with their own environments.
    "cryptography>=43",
    "mypy>=1.15,<2",
    "pytest>=8.3.4,<9",
    "types-jsonschema>=4",
    # The fault tests serve an app on loopback: an abandoned response is a
    # server's behaviour, which an in-process transport does not have.
    "uvicorn~=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lane_double_controls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
