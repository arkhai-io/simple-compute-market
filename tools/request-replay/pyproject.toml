[project]
name = "arkhai-request-replay"
version = "0.1.0"
license = "MIT"
description = "Replay refusal, exact-retry resolution and in-flight leasing over an opaque request key, with durable stores"
readme = "README.md"
requires-python = ">=3.10"
# Standard library only, so a consumer over sqlite3 installs nothing with it.
dependencies = []

[project.optional-dependencies]
# request_replay.sqlalchemy_store imports SQLAlchemy at module level; nothing
# else in the package imports that module.
sqlalchemy = ["sqlalchemy>=2.0,<3"]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3.4,<9",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/request_replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
