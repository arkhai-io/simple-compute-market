schema_version: 1
patterns:
  - id: private_key_hex
    regex: "(?i)(private[_-]?key[\"']?\\s*[:=]\\s*[\"']?)(?:0x)?[0-9a-f]{64}"
    replacement: '\1<redacted-private-key>'
  - id: admin_key
    regex: "(?i)((?:x-admin-key|admin[_-]?key)[\"']?\\s*[:=]\\s*[\"']?)[^\"',\\s]+"
    replacement: '\1<redacted-admin-key>'
  - id: bearer_token
    regex: "(?i)(authorization[\"']?\\s*[:=]\\s*[\"']?bearer\\s+)[A-Za-z0-9._~+/=-]+"
    replacement: '\1<redacted-token>'
  - id: generic_secret_assignment
    regex: "(?i)(((?>(?:api[ _-]?key|access[ _-]?token|refresh[ _-]?token|password|passphrase|client[ _-]?secret|credential|private[ _-]?key|ssh[ _-]?private[ _-]?key|seed[ _-]?phrase|mnemonic)[\"']?\\s*[:=]\\s*[\"']?)))(?!<redacted-)[^\"',}\\]]+"
    replacement: '\1<redacted-secret>'
  - id: private_key_pem
    regex: '(?i)-----BEGIN (?:OPENSSH |EC |RSA )?PRIVATE KEY-----'
    replacement: '-----BEGIN <redacted-private-key>-----'
  - id: wallet_account_identity
    regex: '(?i)\b0x[0-9a-f]{40}\b'
    replacement: '<redacted-account>'
  - id: email_account_identity
    regex: '(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'
    replacement: '<redacted-account>'
  - id: gcp_project_identity
    regex: "(?i)((?:project[_ -]?(?:id|number))[\"']?\\s*[:=]\\s*[\"']?)[a-z0-9][a-z0-9:-]{4,63}"
    replacement: '\1<redacted-project>'
  - id: gcp_project_resource
    regex: '(?i)\bprojects/[a-z0-9][a-z0-9-]{4,62}\b'
    replacement: 'projects/<redacted-project>'
  - id: host_identity
    regex: "(?i)((?:host(?:name|_id)?|machine[_ -]?alias)[\"']?\\s*[:=]\\s*[\"']?)[A-Za-z0-9][A-Za-z0-9_.-]{1,127}"
    replacement: '\1<redacted-host>'
  - id: gpu_uuid
    regex: '(?i)\bGPU-[0-9a-f][0-9a-f-]{15,}\b'
    replacement: '<redacted-gpu>'
  - id: pci_bdf
    regex: '(?i)\b(?:[0-9a-f]{4}:)?[0-9a-f]{2}:[0-9a-f]{2}\.[0-7]\b'
    replacement: '<redacted-pci-bdf>'
  - id: private_ipv4
    regex: '\b(?:10(?:\.[0-9]{1,3}){3}|127(?:\.[0-9]{1,3}){3}|169\.254(?:\.[0-9]{1,3}){2}|192\.168(?:\.[0-9]{1,3}){2}|172\.(?:1[6-9]|2[0-9]|3[01])(?:\.[0-9]{1,3}){2})\b'
    replacement: '<redacted-private-ip>'
  - id: private_ipv6
    regex: '(?i)(?<![0-9a-f:])(?:\[(?:::1|f[cd][0-9a-f]{2}(?::[0-9a-f]{0,4}){1,7}|fe[89ab][0-9a-f](?::[0-9a-f]{0,4}){1,7})\]|(?:::1|f[cd][0-9a-f]{2}(?::[0-9a-f]{0,4}){1,7}|fe[89ab][0-9a-f](?::[0-9a-f]{0,4}){1,7}))(?![0-9a-f:])'
    replacement: '<redacted-private-ip>'
  - id: localhost_identity
    regex: '(?i)\b(?:localhost|[a-z0-9.-]+\.localhost)\b'
    replacement: '<redacted-private-host>'
  - id: home_path
    regex: '/home/[^/\s]+'
    replacement: '/home/<user>'
  - id: macos_home_path
    regex: '/Users/[^/\s]+'
    replacement: '/Users/<user>'
