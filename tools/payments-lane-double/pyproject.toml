[project]
name = "payments-lane-double"
version = "0.2.0"
license = "MIT"
description = "An HTTP double of the Arkhai payments service for end-to-end lanes, over the payments kit's engine"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-kit-arkhai-payments>=0.6.0",
    "arkhai-kit-identity>=0.4.0",
    "lane-double-controls>=0.1.0",
    # The lane CA generator's, from tools/lane-double-controls/tls: the image build
    # runs it in this environment to write the leaf key, which is never committed.
    "cryptography>=43",
    "fastapi~=0.115.8",
    "pydantic>=2",
    "starlette>=0.40,<0.47",
    "uvicorn~=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3.4,<9",
    # The lane runner profiles, which tests/integration/test_lane_env.py holds
    # to the fixtures, are YAML.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_lane_double"]

[tool.pytest.ini_options]
testpaths = ["tests"]
