# The dispute authority every lane and the local release pin, rendered into their
# registries' recommended dispute authorities. It is a public development value,
# never to be used on a public network, and nobody can ever act as it:
#
# - its origin is under .invalid, a top-level domain reserved never to resolve, so
#   nothing can answer there;
# - its record key has no usable private half: it was produced once by generating
#   an Ed25519 key and discarding the private half unrecorded, so no signature can
#   ever verify under it;
# - its account has no bearer token at the payments double (fixtures/accounts.toml).

interface = "arkhai.mediation.v1"
origin = "https://dispute.invalid"
account = "00000000-0000-4000-8000-0000000000d1"
record_key = "ed25519:lMg0OhYvDsBJf2G3MtLHgbPX3spRLUCV20o7HY7AFOI"
params = {}

# What the authority advertises. Its minimum dispute window is zero seconds, so
# every lane's payment options meet it.
[advertisement]
mechanisms = ["arkhai.payments.v1"]
minimum_dispute_window_seconds = 0
