[project]
name = "arkhai-eventing"
version = "0.1.0"
license = "MIT"
description = "Declared kinds of event recorded in their producer's transaction and delivered at least once to each consumer's destinations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "sqlglot>=30.35.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
