[project]
name = "frp-grant-admission"
version = "0.1.0"
license = "MIT"
description = "An frps server plugin admitting a proxy only for the remote port a signed grant names"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "PyJWT>=2.8.0",
]

[project.scripts]
frp-grant-admission = "frp_grant_admission.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frp_grant_admission"]

[tool.pytest.ini_options]
testpaths = ["tests"]
