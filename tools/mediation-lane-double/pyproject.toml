[project]
name = "mediation-lane-double"
version = "0.1.0"
license = "MIT"
description = "An HTTP double of an Arkhai mediation dispute authority for end-to-end lanes, answering from programmed rules"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-kit-arkhai-mediation>=0.3.0",
    # The double's payments peer: it extends, reverses and lifts as the authority.
    "arkhai-kit-arkhai-payments>=0.6.0",
    "arkhai-kit-identity>=0.4.0",
    "lane-double-controls>=0.1.0",
    # The lane CA generator's, from tools/lane-double-controls/tls: the image build
    # runs it in this environment to write the leaf key, which is never committed.
    "cryptography>=43",
    "fastapi~=0.115.8",
    "jsonschema>=4.23,<5",
    "pydantic>=2",
    "starlette>=0.40,<0.47",
    "uvicorn~=0.34.0",
]

[dependency-groups]
dev = [
    # The suite files and reads through the kit's real client over the deal
    # lifecycle's authority terms.
    "arkhai-kit-deal-lifecycle>=0.3.0",
    "httpx>=0.27,<1",
    "pytest>=8.3.4,<9",
    # The lanes' runner profile, which tests/unit/test_lane_profile.py holds to
    # the fixture, is YAML.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediation_lane_double"]

[tool.pytest.ini_options]
testpaths = ["tests"]
