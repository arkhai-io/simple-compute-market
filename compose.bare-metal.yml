# Bare-metal marketplace wrapper. Extend individual services so a deployment's
# bindings merge with their topology; an include imports complete resources and
# cannot redefine them here.
#
# Like the domain file, it holds topology only. A deployment's overlay supplies
# every identity, configuration file, secret overlay, registry and site profile
# and definition document, and nothing here gives one a fallback;
# compose.bare-metal-local.yml is the end-to-end lane's.

services:
  bare-metal-registry:
    extends:
      file: domains/bare_metal/compose.yml
      service: bare-metal-registry
    environment:
      # The registry's database, on the named volume the domain file mounts.
      - DATABASE_URL=sqlite:////app/data/indexer.db

  bare-metal-redis:
    extends:
      file: domains/bare_metal/compose.yml
      service: bare-metal-redis

  bare-metal-provisioning:
    extends:
      file: domains/bare_metal/compose.yml
      service: bare-metal-provisioning

  bare-metal-storefront:
    extends:
      file: domains/bare_metal/compose.yml
      service: bare-metal-storefront

volumes:
  bare-metal-registry-data:
  bare-metal-redis-data:
  bare-metal-provisioning-data:
  bare-metal-storefront-data:
