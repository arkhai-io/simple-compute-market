# The VM end-to-end lane's own bindings, beyond the development overlay the full
# local stack shares: Bob's storefront configured to settle against the payments
# lane double, and the dispute authority both VM registries recommend, the
# mediation lane double.
#
# Layered after compose.vms.yml, compose.vms-local.yml and
# compose.payments-double.yml:
#
#     docker compose -p simple-market-service \
#       -f compose.vms.yml -f compose.vms-local.yml \
#       -f compose.payments-double.yml -f compose.vms-lane.yml up -d
#
# `make -C e2e-tests test-e2e-vm` does exactly this. The full local stack never
# layers this file. Paths are relative to the repository root, the project
# directory of every `-f` file, and every value is a public development value
# that must never be used on a public network; see dev-env/identities/README.md,
# "The payments lane double".
#
# Every party of the lane runs injected time, set by the lane-time fixture
# (e2e-tests/config/config-vms-lane.yml names them), from configuration only the
# lanes load: the registries' lane profile (dev-env/registry/config-payments-lane.env),
# the provisioning services' lane profile (dev-env/provisioning/config-lane-time.yml)
# and each storefront's lane configuration, so the full local stack stays on
# wall time.
services:
  # Bob publishes to both registries, and a listing offers only the dispute
  # authorities every one of its destinations recommends, so both layer the
  # lane's profile recommending its mediation double over their own.
  registry:
    environment:
      - ACTIVE_PROFILES=registry-a,rfq-lane,payments-lane
  registry-b:
    environment:
      - ACTIVE_PROFILES=registry-b,payments-lane
  provisioning:
    environment:
      - ACTIVE_PROFILES=docker,vms-bob-site,lane-time,${PROVISIONING_MODE:-mock}
    volumes:
      - ./dev-env/provisioning/config-lane-time.yml:/app/config/config-lane-time.yml:ro
  alice-provisioning:
    environment:
      - ACTIVE_PROFILES=docker,vms-alice-site,lane-time,${PROVISIONING_MODE:-mock}
    volumes:
      - ./dev-env/provisioning/config-lane-time.yml:/app/config/config-lane-time.yml:ro
  alice-storefront:
    volumes:
      # Alice's configuration with the lane's time, in place of the full
      # stack's.
      - ./domains/vms/storefront/storefront.alice.lane.toml:/etc/arkhai/storefront.toml:ro
  bob-storefront:
    depends_on:
      payments-double:
        condition: service_healthy
      mediation-double:
        condition: service_healthy
    volumes:
      # Bob's configuration with payments, in place of the full stack's. Its
      # payments key and dispute credential are in the secret overlay
      # compose.vms-local.yml mounts.
      - ./domains/vms/storefront/storefront.bob.lane.toml:/etc/arkhai/storefront.toml:ro
      # The lane CA, at the ca_bundle_path Bob's lane configuration and his
      # dispute credential both name: the only authority his payments and
      # mediation clients trust for the doubles.
      - ./tools/lane-double-controls/tls/lane-ca.pem:/run/lane-doubles/lane-ca.pem:ro
