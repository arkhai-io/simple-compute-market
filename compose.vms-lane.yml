# The VM end-to-end lane's own bindings, beyond the development overlay the full
# local stack shares: the payments lane double, Bob's storefront configured to
# settle against it, and the dispute authority both VM registries recommend.
#
# Layered after compose.vms.yml, compose.vms-local.yml and
# compose.payments-double.yml:
#
#     docker compose -p simple-market-service --env-file <file> \
#       -f compose.vms.yml -f compose.vms-local.yml \
#       -f compose.payments-double.yml -f compose.vms-lane.yml up -d
#
# `make -C e2e-tests test-e2e-vm` does exactly this, with the values
# `make e2e-vms-dev-env` prints, which also select Bob's lane configuration
# (domains/vms/storefront/storefront.bob.lane.toml). The full local stack never
# layers this file. Every path arrives as an absolute value from the environment
# file, and every value is a public development value that must never be used on
# a public network; see dev-env/identities/README.md, "The payments lane double".
services:
  # Bob publishes to both registries, and a listing offers only the dispute
  # authorities every one of its destinations recommends, so both recommend the
  # lane's pinned authority.
  registry:
    environment:
      - REGISTRY_DESCRIPTOR_RECOMMENDED_DISPUTE_AUTHORITIES=${PAYMENTS_LANE_DISPUTE_AUTHORITIES:?set the lane's recommended dispute authorities}
  registry-b:
    environment:
      - REGISTRY_DESCRIPTOR_RECOMMENDED_DISPUTE_AUTHORITIES=${PAYMENTS_LANE_DISPUTE_AUTHORITIES:?set the lane's recommended dispute authorities}
  bob-storefront:
    depends_on:
      payments-double:
        condition: service_healthy
    environment:
      # The lane CA, the only authority the payments client trusts for the double.
      - SSL_CERT_FILE=/run/payments-lane-double/lane-ca.pem
      # The seller's bearer token at the double, under the variable
      # [Settlement.arkhai_payments].api_key_env names.
      - ARKHAI_PAYMENTS_API_KEY=${PAYMENTS_LANE_SELLER_API_KEY:?set the seller's payments token}
      # The seller's credential toward the pinned dispute authority, under the
      # variable its [[DisputeCredential]] names. Nothing at its .invalid origin
      # ever reads it; it exists so servicing holds a usable credential for the
      # deal's authority and reports the deal running.
      - VM_LANE_DISPUTE_API_KEY=vm-lane-dispute-public-development-credential
    volumes:
      - ${PAYMENTS_LANE_CA_FILE:?set the payments lane CA file}:/run/payments-lane-double/lane-ca.pem:ro
