[project]
name = "arkhai-kit-alkahest"
version = "0.2.0"
license = "MIT"
description = "Alkahest conditional-escrow runtime adapter, codecs, token helpers, and chain probes"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pydantic>=2",
    "arkhai-kit-settlement-runtime>=0.1.0",
    "web3>=7.14.0",
]

[project.scripts]
alkahest-oracle = "market_alkahest.oracle_cli:main"

[project.entry-points."market.buyer_aggregation_policies"]
best_price = "market_alkahest.aggregation:best_price_from_config"
cheapest_first = "market_alkahest.aggregation:cheapest_first"
priceless_last = "market_alkahest.aggregation:priceless_last"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_alkahest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests/unit"]

[dependency-groups]
dev = [
    "alkahest-py==1.1.2",
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
]
