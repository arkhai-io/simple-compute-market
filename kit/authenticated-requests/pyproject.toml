[project]
name = "arkhai-kit-authenticated-requests"
version = "0.1.0"
license = "MIT"
description = "The admission core every marketplace authority authenticates its requests through: version 3 verification, replay reservation, exact-retry resolution, and signed answers"
requires-python = ">=3.10,<3.14"
dependencies = [
    "arkhai-injected-time>=0.1.0",
    "arkhai-kit-identity>=0.6.0",
    "arkhai-kit-schema-migrations>=0.1.0",
    "arkhai-request-replay>=0.1.0",
    "fastapi>=0.115",
    "pydantic>=2",
    "starlette>=0.40",
]

[project.optional-dependencies]
# market_authenticated_requests.sqlalchemy_support imports SQLAlchemy at module
# level; nothing else in the package imports that module.
sqlalchemy = [
    "arkhai-kit-schema-migrations[sqlalchemy]>=0.1.0",
    "arkhai-request-replay[sqlalchemy]>=0.1.0",
    "sqlalchemy>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_authenticated_requests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3.4,<9.0.0",
    "sqlalchemy>=2.0,<3.0",
]

# The package allowlist: every distribution this package may declare or import
# beyond the standard library, because it sits beneath every authority, the
# lightest among them included. make check-architecture holds it; see
# docs/guidance/repository/package-layers.md, "Kind".
[tool.arkhai.architecture]
allowed-dependencies = [
    "arkhai-injected-time",
    "arkhai-kit-identity",
    "arkhai-kit-schema-migrations",
    "arkhai-request-replay",
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "starlette",
]

# Import names that differ from their distributions'.
[tool.arkhai.architecture.import-roots]
injected_time = "arkhai-injected-time"
request_replay = "arkhai-request-replay"
