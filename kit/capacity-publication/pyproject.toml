[project]
name = "arkhai-kit-capacity-publication"
version = "0.10.4"
license = "MIT"
description = "Schema-opaque capacity projection and storefront publication lifecycle."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-core-storefront==0.18.0",
    "arkhai-kit-resource-pools-contracts>=0.2.0",
    "arkhai-kit-site-client>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_capacity_publication"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.25,<2.0",
]
