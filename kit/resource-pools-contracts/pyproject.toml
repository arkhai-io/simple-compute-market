[project]
name = "arkhai-kit-resource-pools-contracts"
version = "0.1.0"
license = "MIT"
description = "Resource-pool wire models, declaration vocabulary, and route declarations, without the pool authority's persistence."
requires-python = ">=3.12"
# Models and declarations only, so a pool client or a projection reader never
# installs the authority's persistence.
dependencies = [
    # Shape hints are validated with the shared capability-shape utility.
    "arkhai-kit-capability-shape>=0.1.0",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_resource_pools_contracts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
]
