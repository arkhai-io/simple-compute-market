[project]
name = "arkhai-kit-identity"
version = "0.6.0"
license = "MIT"
description = "Canonical marketplace identities and authenticated envelopes"
requires-python = ">=3.10,<3.14"
dependencies = [
    "arkhai-injected-time>=0.1.0",
    "cryptography>=43",
    "eth-account>=0.13.0",
    "http-message-signatures>=3.0",
    "http-sf>=1.5",
    "keyring>=25.5",
    "pydantic>=2",
    "rfc8785>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_identity"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests/unit"]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    # Reads a request through Starlette, as an authority does, to verify it.
    "starlette>=0.40",
]

# The package allowlist: every distribution this package may declare or import
# beyond the standard library, because its lightness is part of its contract.
# make check-architecture holds it; see docs/guidance/repository/package-layers.md, "Kind".
[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-injected-time", "cryptography", "eth-account", "http-message-signatures", "http-sf", "keyring", "pydantic", "rfc8785"]

# The time component's import name differs from its distribution's.
[tool.arkhai.architecture.import-roots]
injected_time = "arkhai-injected-time"
