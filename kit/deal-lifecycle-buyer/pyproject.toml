[project]
name = "arkhai-kit-deal-lifecycle-buyer"
version = "0.1.0"
license = "MIT"
description = "Buyer-owned lifecycle evidence, retention and case export."
requires-python = ">=3.12"
dependencies = ["arkhai-kit-deal-lifecycle>=0.1.0", "arkhai-kit-deal-lifecycle-contracts>=0.1.0", "arkhai-kit-identity>=0.4.0", "typer>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_deal_lifecycle_buyer"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[dependency-groups]
dev = ["arkhai-core>=0.5.0", "pytest>=8.3.4,<9.0.0", "pytest-asyncio>=0.25", "arkhai-core-buyer>=0.6.0"]

[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-kit-deal-lifecycle", "arkhai-kit-deal-lifecycle-contracts", "arkhai-kit-identity", "typer"]
