[project]
name = "arkhai-kit-physical-settlement"
version = "0.1.0"
license = "MIT"
description = "Domain-neutral physical-settlement scheduling and fulfillment lifecycle contracts: capacity settlement scheduling, deterministic placement policy, and shared opaque identifiers."
requires-python = ">=3.12"
dependencies = [
    "arkhai-kit-site>=0.2.0",
    "arkhai-kit-resource-pools>=0.1.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "uuid6>=2024.7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_physical_settlement"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
]

[tool.uv.sources]
arkhai-kit-site = { path = "../site", editable = true }
arkhai-kit-resource-pools = { path = "../resource-pools", editable = true }
