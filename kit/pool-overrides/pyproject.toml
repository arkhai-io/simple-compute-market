[project]
name = "arkhai-kit-pool-overrides"
version = "0.1.0"
description = "Storefront pool overrides: a durable, site-scoped store, the live-site write check, and their status"
requires-python = ">=3.12,<3.14"
license = "MIT"
# A storefront-side kit. It depends on universal transport and the site client's
# error types, never on a market: each market supplies its vocabulary through a
# contribution.
dependencies = [
    "arkhai-core-storefront-client>=0.20.0",
    "arkhai-kit-identity==0.3.0",
    "arkhai-kit-site-client",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_pool_overrides"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.25,<2.0",
]
