[project]
name = "arkhai-kit-deal-lifecycle"
version = "0.2.0"
license = "MIT"
description = "Neutral deal lifecycle terms, adapter ports and evidence interfaces."
requires-python = ">=3.10,<3.14"
dependencies = ["arkhai-kit-deal-lifecycle-contracts>=0.1.0", "arkhai-kit-identity>=0.4.0", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_deal_lifecycle"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[dependency-groups]
dev = ["pytest>=8.3.4,<9.0.0", "arkhai-core>=0.5.0"]

[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-kit-deal-lifecycle-contracts", "arkhai-kit-identity", "pydantic"]
