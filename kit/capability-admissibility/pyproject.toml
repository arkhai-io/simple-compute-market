[project]
name = "arkhai-kit-capability-admissibility"
version = "0.1.0"
description = "Which capability shapes a seller will sell for a listing: inline shape constraints, tiered resolution, and whole-shape evaluation"
requires-python = ">=3.12,<3.14"
license = "MIT"
# The shape vocabulary and the standard library only: storefronts, buyers, and
# pool administration all read listing shapes through this, so it must pull
# nothing else in with it.
dependencies = [
    "arkhai-kit-capability-shape>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_capability_admissibility"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]

[dependency-groups]
dev = ["pytest>=8.3.4,<9.0.0"]
