[project]
name = "arkhai-kit-policy"
version = "0.6.0"
description = "Domain-agnostic policy engine for the market — negotiation thread store, action builders, callable registry, and policy evaluation."
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pydantic>=2",
    "arkhai-kit-identity==0.4.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_policy"]

[tool.pytest.ini_options]
pythonpath = ["src", "../..", "../alkahest/src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
]
