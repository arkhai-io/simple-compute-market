[project]
name = "arkhai-kit-hosted-settlement"
version = "0.1.0"
description = "Thin settlement-runtime adapter for the hosted conditional escrow contract"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "arkhai-core==0.2.0",
  "arkhai-hosted-settlement-client==0.1.0",
  "arkhai-kit-settlement-runtime==0.1.0",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_hosted_settlement"]

[tool.pytest.ini_options]
pythonpath = ["src", "../settlement-runtime/src", "../../core/src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8.3.4,<9.0.0", "pytest-asyncio>=0.23"]
