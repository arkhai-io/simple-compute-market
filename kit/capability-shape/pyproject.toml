[project]
name = "arkhai-kit-capability-shape"
version = "0.1.0"
description = "Family-grouped capability shapes: structure, schema-driven flattening, and a canonical digest"
requires-python = ">=3.12,<3.14"
license = "MIT"
# Standard library only: buyers, pool administration, site authorities, and
# domain packages all depend on this, so it must pull nothing in with it.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_capability_shape"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]

[dependency-groups]
dev = ["pytest>=8.3.4,<9.0.0"]
