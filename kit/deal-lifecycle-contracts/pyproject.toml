[project]
name = "arkhai-kit-deal-lifecycle-contracts"
version = "0.1.0"
license = "MIT"
description = "Neutral deal lifecycle wire models and route declarations."
requires-python = ">=3.10,<3.14"
dependencies = ["arkhai-kit-identity>=0.4.0", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_deal_lifecycle_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[dependency-groups]
dev = ["pytest>=8.3.4,<9.0.0"]

[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-kit-identity", "pydantic"]
