[project]
name = "arkhai-kit-arkhai-payments"
version = "0.1.0"
license = "MIT"
description = "Stateless client for the Arkhai payments HTTP API"
requires-python = ">=3.10,<3.14"
dependencies = [
    "arkhai-kit-identity>=0.3.0",
    "httpx>=0.27,<1",
    "pydantic>=2",
    "rfc8785>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_arkhai_payments"]

[tool.hatch.build.targets.wheel.force-include]
"src/market_arkhai_payments/py.typed" = "market_arkhai_payments/py.typed"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
show_error_codes = true
warn_return_any = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",
    "mypy>=1.15.0,<2.0.0",
]
