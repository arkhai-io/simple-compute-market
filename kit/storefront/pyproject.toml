[project]
name = "arkhai-kit-storefront"
version = "0.1.0"
license = "MIT"
description = "Domain-neutral storefront application, lifecycle, route, and reusable service composition."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-core-storefront>=0.3.0",
    "arkhai-kit-alkahest",
    "alkahest-py==1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_storefront_kit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "fastapi~=0.115.8",
    "pytest-asyncio>=0.23",
]
