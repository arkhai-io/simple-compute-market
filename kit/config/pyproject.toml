[project]
name = "arkhai-kit-config"
version = "0.1.2"
license = "MIT"
description = "Shared market configuration loading and registry URL helpers"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cryptography>=42.0",
    "eth-account>=0.13.0",
    "arkhai-kit-settlement-runtime==0.1.2",
    "pydantic>=2.7",
    "tomlkit>=0.13,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_config"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests/unit"]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
]
