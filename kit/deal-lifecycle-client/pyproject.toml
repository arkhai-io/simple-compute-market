[project]
name = "arkhai-kit-deal-lifecycle-client"
version = "0.1.0"
license = "MIT"
description = "Signed buyer client for the storefront lifecycle API."
requires-python = ">=3.12"
dependencies = ["arkhai-kit-deal-lifecycle-contracts>=0.1.0", "arkhai-kit-identity>=0.4.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_deal_lifecycle_client"]

[dependency-groups]
dev = ["pytest>=8.3.4,<9"]

[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-kit-deal-lifecycle-contracts", "arkhai-kit-identity", "httpx"]
