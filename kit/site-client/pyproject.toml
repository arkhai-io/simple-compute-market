[project]
name = "arkhai-kit-site-client"
version = "0.2.0"
license = "MIT"
description = "Typed async clients for a site authority's capacity API: buyer-facing read/reserve/commit (SiteCapacityClient) and operator resource registration/update (SiteCapacityAdminClient)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "arkhai-kit-identity==0.3.0",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_site_client"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
]
