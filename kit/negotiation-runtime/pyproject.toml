[project]
name = "arkhai-kit-negotiation-runtime"
version = "0.1.0"
license = "MIT"
description = "Schema-opaque signed negotiation lifecycle, persistence, and recovery orchestration."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-kit-identity==0.3.0",
    "arkhai-kit-policy==0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_negotiation_runtime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
]
