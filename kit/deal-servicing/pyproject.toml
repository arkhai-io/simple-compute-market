[project]
name = "arkhai-kit-deal-servicing"
version = "0.1.0"
license = "MIT"
description = "Seller evidence, delivery-end journals and lifecycle observation."
requires-python = ">=3.12"
dependencies = ["arkhai-kit-deal-lifecycle>=0.1.0", "arkhai-kit-deal-lifecycle-contracts>=0.1.0", "arkhai-kit-identity>=0.4.0", "pydantic>=2.7", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_deal_servicing"]

[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-kit-deal-lifecycle", "arkhai-kit-deal-lifecycle-contracts", "arkhai-kit-identity", "pydantic", "fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = ["pytest>=8.3.4,<9", "pytest-asyncio>=0.25,<1", "arkhai-kit-deal-lifecycle-client>=0.1.0", "httpx>=0.27", "arkhai-kit-arkhai-mediation>=0.2.0", "arkhai-kit-arkhai-payments>=0.1.0", "mypy>=1.15,<2"]
