[project]
name = "arkhai-kit-deal-servicing"
version = "0.1.0"
license = "MIT"
description = "Seller evidence, delivery-end journals and lifecycle observation."
requires-python = ">=3.12"
dependencies = ["arkhai-kit-deal-lifecycle>=0.1.0", "arkhai-kit-deal-lifecycle-contracts>=0.1.0", "arkhai-kit-identity>=0.4.0", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_deal_servicing"]

[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-kit-deal-lifecycle", "arkhai-kit-deal-lifecycle-contracts", "arkhai-kit-identity", "pydantic"]

[dependency-groups]
dev = ["arkhai-kit-arkhai-mediation>=0.1.0", "arkhai-kit-arkhai-payments>=0.1.0"]
