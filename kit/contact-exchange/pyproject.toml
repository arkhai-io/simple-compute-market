[project]
name = "arkhai-kit-contact-exchange"
version = "0.3.0"
description = "Introduction-only settlement: contact exchange with no payment and no provisioning"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "arkhai-core==0.4.1",
  "arkhai-kit-identity==0.4.0",
  "arkhai-kit-settlement-runtime==0.4.0",
  "pydantic>=2.7",
  "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_contact_exchange"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8.3.4,<9.0.0", "pytest-asyncio>=0.23"]

# The package's lightness is part of its contract: every distribution it may
# declare or import beyond the standard library. make check-architecture holds
# it; see docs/development/ARCHITECTURE.md, "Kind".
[tool.arkhai.architecture]
allowed-dependencies = ["arkhai-core", "arkhai-kit-identity", "arkhai-kit-settlement-runtime", "pydantic", "typer"]
