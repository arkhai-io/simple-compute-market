[project]
name = "arkhai-kit-contact-exchange"
version = "0.1.2"
description = "Introduction-only settlement: contact exchange with no payment and no provisioning"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "arkhai-core==0.2.0",
  "arkhai-kit-identity==0.3.0",
  "arkhai-kit-settlement-runtime==0.1.2",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_contact_exchange"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8.3.4,<9.0.0", "pytest-asyncio>=0.23"]
