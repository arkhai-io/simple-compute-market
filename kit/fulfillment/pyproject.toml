[project]
name = "arkhai-kit-fulfillment"
version = "0.2.0"
license = "MIT"
description = "Domain-neutral fulfillment scheduling and fulfillment lifecycle contracts: capacity settlement scheduling, deterministic placement policy, and shared opaque identifiers."
requires-python = ">=3.12"
dependencies = [
    "arkhai-kit-site>=0.3.0",
    "arkhai-kit-resource-pools>=0.2.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "uuid6>=2024.7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_fulfillment"]

[tool.uv]
find-links = ["../../.dist"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23",
]
