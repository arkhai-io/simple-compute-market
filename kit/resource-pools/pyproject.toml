[project]
name = "arkhai-kit-resource-pools"
version = "0.5.0"
license = "MIT"
description = "Provider-neutral resource-pool administration: persistence, YAML reconciliation, and the pool-config handler protocol."
requires-python = ">=3.12"
dependencies = [
    # Listing-shape hints, inline constraints included, are validated by the
    # shape admissibility kit's structural split; asking-rate shapes by the
    # capability-shape utility directly.
    "arkhai-kit-capability-admissibility>=0.1.0",
    "arkhai-kit-capability-shape>=0.1.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_resource_pools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
]
