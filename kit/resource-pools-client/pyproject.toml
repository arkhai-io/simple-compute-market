[project]
name = "arkhai-kit-resource-pools-client"
version = "0.1.0"
license = "MIT"
description = "Typed resource-pool administration methods over any transport offering authenticated_request."
requires-python = ">=3.12"
# The contracts alone: the caller supplies the signing transport, so this
# client installs neither the pool authority nor any service's own client.
dependencies = [
    "arkhai-kit-resource-pools-contracts>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_resource_pools_client"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.23",
]
