[project]
name = "arkhai-kit-delivery"
version = "0.2.1"
description = "Recipient-side delivery of revealed marketplace events to locally configured sinks"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "arkhai-kit-identity==0.4.0",
  "pydantic>=2.7",
]

[project.entry-points."market.delivery_sinks"]
file = "market_delivery.builtin.file_sink:FILE_SINK"
command = "market_delivery.builtin.command_sink:COMMAND_SINK"
webhook = "market_delivery.builtin.webhook_sink:WEBHOOK_SINK"
smtp = "market_delivery.builtin.smtp_sink:SMTP_SINK"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_delivery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8.3.4,<9.0.0", "pytest-asyncio>=0.23"]
