[project]
name = "arkhai-kit-arkhai-mediation"
version = "0.2.0"
license = "MIT"
description = "Stateless Arkhai mediation client and lifecycle dispute adapter"
requires-python = ">=3.12"
dependencies = [
    "arkhai-kit-deal-lifecycle>=0.1.0",
    "arkhai-kit-deal-lifecycle-contracts>=0.1.0",
    "arkhai-kit-identity>=0.4.0",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_arkhai_mediation"]

[dependency-groups]
dev = ["arkhai-kit-arkhai-payments>=0.1.0", "datamodel-code-generator==0.83.0", "pytest>=8.3.4,<9", "mypy>=1.15,<2", "types-jsonschema>=4"]
