[project]
name = "arkhai-compute-provisioning-ansible"
version = "0.1.0"
license = "MIT"
description = "Ansible implementation of compute provisioning execution: the ssh connection codec and Ansible job mechanics"
requires-python = ">=3.12"
dependencies = [
    "arkhai-compute-provisioning>=0.8.0",
    "arkhai-kit-config>=0.1.2",
    "arkhai-kit-resource-pools>=0.3.0",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_provisioning_ansible"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]

[dependency-groups]
dev = [
    # The tests generate throwaway Fernet keys.
    "cryptography>=42.0",
    "pytest>=8.3.4",
]
