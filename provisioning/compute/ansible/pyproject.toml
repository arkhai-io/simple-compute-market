[project]
name = "arkhai-compute-provisioning-ansible"
version = "0.10.0"
license = "MIT"
description = "Ansible implementation of compute provisioning execution: the ssh connection codec and Ansible job mechanics"
requires-python = ">=3.12"
dependencies = [
    # The failure envelope a classified run reports.
    "arkhai-compute-provisioning-contracts>=0.18.0",
    # ConfigurationRefusedError and the job authority's own failure classes.
    "arkhai-compute-provisioning>=0.31.0",
    "arkhai-core>=0.4.0",
    "arkhai-kit-config>=0.2.0",
    # The ssh codec names Fernet's InvalidToken when a protected key does not
    # decrypt.
    "cryptography>=42.0",
    "pydantic>=2",
]

[project.optional-dependencies]
# The failure-records callback under callback_plugins/ imports Ansible. Ansible
# loads it by path in its own interpreter, which the service image installs
# apart from the app's environment, so the kit's own modules never import it. The
# range is the one provisioning/compute/service/Dockerfile installs.
ansible = ["ansible-core>=2.17,<2.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_provisioning_ansible"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    # The callback's Ansible, which the integration tests run and the inventory
    # test's SSH plugin comes from, as the service image ships it.
    "arkhai-compute-provisioning-ansible[ansible]",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23",
    # The tests read rendered variables files back.
    "pyyaml>=6.0",
]
