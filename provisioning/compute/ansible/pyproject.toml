[project]
name = "arkhai-compute-provisioning-ansible"
version = "0.9.0"
license = "MIT"
description = "Ansible implementation of compute provisioning execution: the ssh connection codec and Ansible job mechanics"
requires-python = ">=3.12"
dependencies = [
    "arkhai-compute-provisioning-contracts>=0.11.0",
    # The job run's report_starting, called before a playbook is spawned.
    "arkhai-compute-provisioning>=0.30.0",
    "arkhai-core>=0.4.0",
    "arkhai-kit-config>=0.2.0",
    # The ssh codec names Fernet's InvalidToken when a protected key does not
    # decrypt.
    "cryptography>=42.0",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_provisioning_ansible"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    # Run the inventory test against the SSH plugin shipped in the service image.
    "ansible-core>=2.17,<2.20",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23",
    # The tests read rendered variables files back.
    "pyyaml>=6.0",
]
