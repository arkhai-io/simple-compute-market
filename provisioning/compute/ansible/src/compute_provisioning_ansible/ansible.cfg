# Defaults for every playbook the provisioning service runs, whichever domain's.
# A domain's playbooks name their own roles by relative path, so nothing here
# is specific to one; operators running a domain's playbooks by hand use that
# domain's own ansible.cfg.
[defaults]
stdout_callback = default
callback_result_format = yaml
log_path = ./ansible.log
host_key_checking = False
display_skipped_hosts = False
display_ok_hosts = True
deprecation_warnings = False
