[project]
name = "arkhai-compute-provisioning-client"
version = "0.4.0"
license = "MIT"
description = "Typed async and sync clients for the compute provisioning family's routes."
requires-python = ">=3.12"
# The wire contract, the signing vocabulary, and an HTTP client: a caller of the
# provisioning service installs none of its service code.
dependencies = [
    "arkhai-compute-provisioning-contracts>=0.5.0",
    # VersionedEnvelope, which fulfillment results arrive in.
    "arkhai-core>=0.4.0",
    "arkhai-kit-identity==0.3.0",
    "httpx>=0.27",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_provisioning_client"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23",
]
