[project]
name = "arkhai-compute-provisioning"
version = "0.22.0"
license = "MIT"
description = "Shared helpers for cross-domain compute provisioning services"
requires-python = ">=3.12"
dependencies = [
    "arkhai-compute-provisioning-contracts>=0.11.0",
    "arkhai-core>=0.4.0",
    "arkhai-kit-site>=0.10.0",
    "arkhai-kit-resource-pools>=0.3.0",
    # The pool declarations a resource view's pool context carries.
    "arkhai-kit-resource-pools-contracts>=0.3.0",
    "arkhai-kit-fulfillment>=0.6.0",
    "pydantic>=2",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_provisioning"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]

[dependency-groups]
dev = [
    "fastapi>=0.115.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23",
]
