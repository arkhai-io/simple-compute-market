[project]
name = "arkhai-compute-provisioning"
version = "0.31.0"
license = "MIT"
description = "Shared helpers for cross-domain compute provisioning services"
requires-python = ">=3.12"
dependencies = [
    # The job view carrying its structured failure, and ProvisioningErrorEnvelope.
    "arkhai-compute-provisioning-contracts>=0.18.0",
    "arkhai-core>=0.4.0",
    # The operator event kinds the lease lifecycle and the job engine record.
    "arkhai-eventing>=0.1.0",
    "arkhai-injected-time>=0.1.0",
    "arkhai-kit-config",
    # The first version exporting the deliverable-hosts report the relay
    # report implements, the site's event recorder and a release failure's
    # prepared event.
    "arkhai-kit-site>=0.15.0",
    # The first version exporting the pool reader the site ledger is built
    # with, which this package's tests compose.
    "arkhai-kit-resource-pools>=0.11.0",
    # The pool declarations a resource view's pool context carries.
    "arkhai-kit-resource-pools-contracts>=0.3.0",
    "arkhai-kit-fulfillment>=0.6.0",
    # The migration type the host, job, and relay baselines are exported as.
    "arkhai-kit-schema-migrations>=0.1.0",
    "cryptography>=42.0",
    "pydantic>=2",
    # The host and relay definitions documents' YAML.
    "pyyaml>=6.0",
    # Imported to serialize a relay grant's header and claims.
    "rfc8785>=0.1.4",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_provisioning"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]

[dependency-groups]
dev = [
    "fastapi>=0.115.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23",
]
