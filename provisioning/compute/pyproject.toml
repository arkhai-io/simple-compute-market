[project]
name = "arkhai-compute-provisioning"
version = "0.5.0"
license = "MIT"
description = "Shared helpers for cross-domain compute provisioning services"
requires-python = ">=3.12"
dependencies = [
    "arkhai-kit-site>=0.2.0",
    "arkhai-kit-resource-pools>=0.1.0",
    "arkhai-kit-fulfillment>=0.1.0",
    "arkhai-kit-identity==0.3.0",
    "httpx>=0.27",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_provisioning"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]

[dependency-groups]
dev = [
    "fastapi>=0.115.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
arkhai-kit-site = { path = "../../kit/site", editable = true }
arkhai-kit-resource-pools = { path = "../../kit/resource-pools", editable = true }
