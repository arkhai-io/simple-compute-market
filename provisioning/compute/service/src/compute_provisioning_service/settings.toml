# ---------------------------------------------------------------------------
# Provisioning service base defaults.
# This file documents all supported configuration keys and their defaults.
# Do NOT put environment-specific values here.
#
# Override via (highest priority first):
#   1. PROVISIONING_* environment variables
#   2. config/config-<profile>.yml  (selected by ACTIVE_PROFILES)
#   3. config/config.yml
#   4. This file
#
# For local development: copy config/config-local.yml.example to
# config/config-local.yml and set ACTIVE_PROFILES=local in .env.
# ---------------------------------------------------------------------------

# HTTP server
host = "0.0.0.0"
port = 8081
log_level = "info"

# Database
# Defaults to SQLite so a fresh checkout works without any setup.
# Override to PostgreSQL for production via config-production.yml.
database_url = "sqlite:///provisioning.db"

# Ansible
# Path to an ansible.cfg exported as ANSIBLE_CONFIG at startup. Empty means
# the Ansible distribution's own defaults, which belong to no domain.
ansible_cfg = ""
ansible_timeout_seconds = 1800

# Ansible filesystem paths.
# Set to absolute paths via your active profile or PROVISIONING_* env vars.
# The Dockerfile bakes in the /opt paths; local dev overrides via config-local.yml.
# Each domain's playbook setting is named for its domain. Startup refuses the
# retired `playbook_path`, naming `vm_playbook_path`, rather than ignoring it.
vm_playbook_path = "/opt/domains/vms/provisioning/iac/ansible/playbooks/single-tenant/vm-operations.yaml"
bare_metal_playbook_path = "/opt/domains/bare_metal/provisioning/iac/ansible/playbooks/node-access.yaml"
management_vars_path = "/opt/domains/vms/provisioning/iac/ansible/inventory/management-vars.yaml"

# Bare-metal account policy, frozen at grant for bounded working data.
# Options:
#   remove_lease_key — remove only the SSH key recorded for the lease.
#   lock_user        — remove the lease key and lock the account.
#   delete_user      — delete the tenant account and home directory.
#   bounded_working_data — use protected reservation identity and bounded cleanup.
bare_metal_reclaim_policy = "remove_lease_key"
# Required only for bounded_working_data; must match the protected host policy.
bare_metal_working_data_policy_id = ""

# Golden image credentials.
# Used when image_setup_type=golden. Set via config-production.yml or env vars.
# Never commit real values here.
golden_root_ssh_filename = ""
golden_root_ssh_password = ""
golden_image_name = ""
golden_gcs_bucket = ""
golden_gcs_project = ""

# Worker concurrency
max_concurrent_jobs = 5

# Retry
default_max_retries = 3
retry_backoff_initial_seconds = 60
retry_backoff_multiplier = 2.0
retry_backoff_max_seconds = 3600
# How often the retry scheduler sweeps for queued jobs whose backoff delay
# has elapsed and re-enqueues them. Keep well below retry_backoff_initial_seconds.
retry_scheduler_poll_interval_seconds = 10

# Further failure messages that are never retried. The Ansible executor
# already refuses to retry transport failures (an unreachable host, refused
# authentication), and each domain's codec its own (a VM that does not exist);
# substrings listed here are added to those, matched case-insensitively.
additional_non_retryable_errors = []

# Bootstrap admission token for a relay established from the relay definition
# document. Read only when a relay is created, and never afterwards: a token
# rotated through the relay controller is authoritative from that point, and
# re-reading this value would let a redeployment silently revert a rotation.
# Stored encrypted on the relay row under ssh_decryption_key; nothing reads
# this setting at dispatch.
#
# Empty by default. A deployment with no relay serves VMs by direct NAT, so an
# absent token is a valid state; what fails is a relay configured without one.
relay_token = ""

# How long a relay port lease's grants outlive the reservation's scheduled lease
# end. A relay admits a proxy whose grant is unexpired, and teardown is what
# revokes access, so the grace must cover the lease watchdog's grace period
# (lease_watchdog_grace_period_seconds) and a teardown job's retries
# (default_max_retries and the retry backoff) with their runs; the default
# covers the defaults with room. The expiry is fixed when the port is leased.
# The service refuses to start with a negative value.
relay_grant_expiry_grace_seconds = 3600

# How long a released relay port is held past its last grant's expiry before it
# is leased again, so a grant copied from the host that held it cannot register
# the port for another host. A relay checks a grant's expiry on its own clock
# with no leeway, so the relays' and this service's clocks must be kept
# synchronised with skew well under this margin. Read when a port is selected:
# raising it holds back ports already released too. The service refuses to
# start with a value that is not positive.
relay_port_reuse_margin_seconds = 300

# Rate limiting
enable_rate_limiting = false
rate_limit_requests_per_minute = 30
# SSH key encryption: the key the ssh connection codec protects a submitted
# private key with, and the runner decrypts it with. Required to register a host
# whose ssh connection submits a private_key.
# Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
ssh_decryption_key = ""

# Resource pool definitions
# Path to a YAML file of pool definitions under a top-level `pools` list (see
# docs/operator-handbook.md, "Pool definitions"). Reconciled at startup only
# when the document differs from the one last reconciled, like relay
# definitions; a reconciliation disables pools the document does not name. Empty by default: a fresh site is then seeded from pool_seed_path
# (below), and pools are administered through the API. Migration creates no pool
# in either case.
pool_definitions_path = ""

# Pool seed document
# A pool document applied once at startup to a fresh site: only when no
# pool_definitions_path is configured and no pool is stored, and never again
# once it has created pools. No digest is recorded, so it is never reconciled.
# A relative path resolves against this file's directory; the packaged document
# holds `vm-default` and `bare-metal-default`. Empty disables seeding. A seed
# document that is missing or invalid, when it applies, fails startup.
pool_seed_path = "seed/pools.yaml"

# Relay definitions
# Path to a YAML file of relay definitions. Reconciled at startup only when the
# document differs from the one last reconciled: import treats a document as
# authoritative, and re-applying one nobody submitted would revert relays
# administered through the API on any pod restart. Each entry may name which
# key of the secrets profile holds its admission token (token_secret_key), and
# must name the key holding its grant-signing key (grant_key_secret_key): the
# single-line standard base64 of an Ed25519 key's PKCS#8 DER, as
# `openssl genpkey -algorithm ed25519 -outform DER | base64 -w0` prints it. Both
# are read once, when the relay is created; a grant key that is missing or not
# in that form fails the import, naming the relay and the profile key.
relay_definitions_path = ""

# Host definitions
# Path to a YAML file of host definitions under a top-level `hosts` list, each
# entry with the host registration API's field names (see
# docs/operator-handbook.md, "Host definitions").
# Reconciled at startup only when the document differs from the one last
# reconciled, after pool definitions and the stored-pool check and before
# capacity definitions. Each entry declares its whole host: an omitted pool_id
# unplaces it and an omitted enabled enables it. A host the document does not
# name is left as it is and reported. The document names a key by its key_path
# and never carries one. A document that cannot be applied fails startup and
# records nothing, so the next start retries it.
# POST /api/v1/hosts/definitions/import always reconciles, and
# GET /api/v1/hosts/definitions/export writes the registry as such a document.
# Empty by default: hosts are then registered only through the API. The retired
# inventory_ini and inventory_path refuse startup, naming this setting.
host_definitions_path = ""

# Capacity definitions
# Path to a YAML file of capacity declarations under a top-level `resources`
# list. Reconciled at startup only when the document differs from the one last
# reconciled, after pool and host definitions. Each entry replaces the
# declaration it names; a declaration the document does not name is left as it
# is. POST /api/v1/capacity/definitions/import always reconciles.
capacity_definitions_path = ""

# Storefront callback and marketplace service boundary. The service signer
# authenticates outbound callbacks and signs inbound acknowledgements. The
# exact storefront principal authenticates inbound requests and signed callback
# responses. Signing material is supplied only through
# ARKHAI_IDENTITY_CREDENTIAL.
lease_watchdog_enabled = true
lease_watchdog_poll_interval_seconds = 60
lease_watchdog_grace_period_seconds = 300
capacity_reservation_watchdog_enabled = true
capacity_reservation_watchdog_poll_interval_seconds = 60
storefront_url = ""
storefront_site_id = ""

# Durable fulfillment recovery and provider convergence. Defaults for these
# live in config/config.yml, not here -- see that file's comment header.
# Documented here for discoverability only:
#   fulfillment_convergence_watchdog_enabled
#   fulfillment_convergence_watchdog_poll_interval_seconds
#   fulfillment_convergence_batch_size
#   fulfillment_convergence_backoff_initial_seconds
#   fulfillment_convergence_backoff_multiplier
#   fulfillment_convergence_backoff_max_seconds
#   fulfillment_convergence_backoff_jitter_fraction


[identity]
scheme = ""
identifier = ""

[storefront_identity]
scheme = ""
identifier = ""

[admin_identity]
scheme = ""
identifier = ""