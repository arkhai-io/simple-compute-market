# ---------------------------------------------------------------------------
# Profile: seller
# Activated when the provisioning service runs as part of `compose/seller.yml`
# (compose sets ACTIVE_PROFILES=seller). Base defaults — including the
# ansible paths and ansible_cfg/ANSIBLE_CONFIG — come from settings.toml,
# which is baked into the image; this profile only overrides the values
# that differ for the seller compose stack.
#
# Public service, storefront seller, and distinct admin trust-pin settings are
# supplied by the deployment profile. The matching service credential is
# injected only through ARKHAI_IDENTITY_CREDENTIAL.
# ---------------------------------------------------------------------------

# Service name on the seller compose's default network.
storefront_url: "http://seller-storefront:8001"
storefront_site_id: "default"

# SQLite under the seller-provisioning-data named volume (defined in
# compose/seller.yml). The path inside the container is /app/data, the
# volume preserves the DB across `docker compose down`.
database_url: "sqlite:////app/data/provisioning.db"
