# ---------------------------------------------------------------------------
# Profile: docker
# Loaded automatically when the container image runs standalone
# (ACTIVE_PROFILES=docker is baked into the Dockerfile).
#
# Provides the IaC paths that match the image's baked-in directory layout
# and sets ANSIBLE_CONFIG to point at the bundled ansible.cfg.
# Override specific values at runtime via PROVISIONING_* env vars.
# ---------------------------------------------------------------------------

playbook_path: "/opt/domains/vms/provisioning/iac/ansible/playbooks/single-tenant/vm-operations.yaml"
bare_metal_playbook_path: "/opt/domains/vms/provisioning/iac/ansible/playbooks/bare-metal/node-access.yaml"
inventory_path: "/opt/domains/vms/provisioning/iac/ansible/inventory/hosts"
management_vars_path: "/opt/domains/vms/provisioning/iac/ansible/inventory/management-vars.yaml"
ansible_cfg: "/opt/domains/vms/provisioning/iac/ansible/ansible.cfg"

# ---------------------------------------------------------------------------
# Storefront callback target and durable site binding.
#
# Public identity values are required via this profile or PROVISIONING_
# environment overlays:
#   PROVISIONING_IDENTITY__SCHEME / PROVISIONING_IDENTITY__IDENTIFIER
#   PROVISIONING_STOREFRONT_IDENTITY__SCHEME
#   PROVISIONING_STOREFRONT_IDENTITY__IDENTIFIER
#   PROVISIONING_ADMIN_IDENTITY__SCHEME
#   PROVISIONING_ADMIN_IDENTITY__IDENTIFIER
# The service signer credential is injected separately through the
# ARKHAI_IDENTITY_CREDENTIAL Secret environment boundary.
storefront_url: "http://bob-storefront:8001"
storefront_site_id: "default"
