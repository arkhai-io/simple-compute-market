# ---------------------------------------------------------------------------
# Profile: mock
#
# Each domain runs its jobs through the mock Ansible runner instead of the real
# one. No Ansible binary, SSH key, or host is required; returned credentials
# and access facts are deterministic fakes.
#
# Usage:
#   ACTIVE_PROFILES=mock  (docker-compose e2e tests without real hardware)
#   ACTIVE_PROFILES=docker,mock  (Docker container, mock Ansible)
#
# The agent always calls the provisioning service HTTP API regardless of
# this profile — mock mode is a provisioning service concern, not an agent
# concern. Set this profile on the compute provisioning service container; the
# agent container needs no configuration change.
# ---------------------------------------------------------------------------

vm_playbook_path: "/dev/null"
bare_metal_playbook_path: "/dev/null"
# host_definitions_path is not overridden in mock mode: a host definitions
# document a deployment configures registers its hosts as it does without the
# mock, and the mock runner never connects to them.
