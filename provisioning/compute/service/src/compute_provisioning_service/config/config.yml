# ---------------------------------------------------------------------------
# config.yml — base environment config layer
# Placed in the directory pointed to by CONFIG_DIRECTORY.
# Profile-specific overrides go in config-<profile>.yml in the same directory.
#
# Stable service defaults live in this YAML layer so Compose, Helm, and other
# deployment tooling can override the same hierarchy without translating TOML.
#
# Available keys:
#   database_url, playbook_path, bare_metal_playbook_path, inventory_path, management_vars_path
#   bare_metal_reclaim_policy
#   ansible_cfg, ansible_timeout_seconds, default_vm_host
#   golden_root_ssh_filename, golden_root_ssh_password, golden_image_name
#   golden_gcs_bucket, golden_gcs_project
#   frp_server_addr, frp_domain, frp_dashboard_password
#   storefront_url, storefront_admin_key
#   enable_rate_limiting, rate_limit_requests_per_minute, log_level
# ---------------------------------------------------------------------------

# Durable fulfillment recovery and provider convergence.
fulfillment_convergence_watchdog_enabled: true
fulfillment_convergence_watchdog_poll_interval_seconds: 30
fulfillment_convergence_batch_size: 50
retry_backoff_jitter_fraction: 0.1
