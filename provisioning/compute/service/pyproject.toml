[project]
name = "arkhai-compute-provisioning-service"
version = "0.2.0"
license = "MIT"
description = "Deployable cross-domain compute provisioning service"
requires-python = ">=3.12"
dependencies = [
    "arkhai-kit-site>=0.3.0",
    "arkhai-kit-resource-pools>=0.2.0",
    "arkhai-kit-fulfillment>=0.2.0",
    "arkhai-compute-provisioning>=0.6.0",
    "arkhai-core-storefront-client==0.17.0",
    "arkhai-kit-identity==0.3.0",
    "dynaconf>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "dependency-injector>=4.41.0",
    "fastapi-utils>=0.8.0",
    "typing-inspect>=0.9.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.28.1",
    "aiohttp>=3.9",
    "cachetools>=5.3",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
adapters = [
    "arkhai-vms-provisioning-adapter>=0.1.0",
    "arkhai-bare-metal-provisioning-adapter>=0.1.0",
]

[project.scripts]
compute-provisioning-api = "compute_provisioning_service.main:run"
compute-provisioning-worker = "compute_provisioning_service.worker:main"
compute-provisioning-migrate = "compute_provisioning_service.db.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_provisioning_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "arkhai-vms-provisioning-adapter>=0.2.0",
    "arkhai-bare-metal-provisioning-adapter>=0.1.0",
    "arkhai-kit-site-client>=0.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
]

[tool.uv]
find-links = ["../../../.dist"]