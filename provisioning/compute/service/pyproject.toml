[project]
name = "arkhai-compute-provisioning-service"
version = "0.29.0"
license = "MIT"
description = "Deployable cross-domain compute provisioning service"
requires-python = ">=3.12"
dependencies = [
    # The job view carrying its structured failure.
    "arkhai-compute-provisioning-contracts>=0.18.0",
    # The first version exporting the site-declaration reader its tests read the
    # projection through.
    "arkhai-kit-resource-pools-contracts>=0.5.0",
    "arkhai-core>=0.4.0",
    # The service's event store, its schema steps in the chain, and the event
    # reads its administrator routes serve.
    "arkhai-eventing>=0.1.0",
    "arkhai-injected-time>=0.1.0",
    "arkhai-kit-config",
    # The sinks operator events are delivered through, the event-sink consumer,
    # and the Apprise sink an operator's push routes name.
    "arkhai-kit-delivery[events]>=0.3.0",
    "arkhai-kit-delivery-apprise>=0.2.0",
    # The first versions exporting the site's pool-facts port and the pool
    # authority's reader answering it, which this root composes; each also
    # exports its table baseline, which the migration chain composes. The
    # site's events are its transitions' from 0.15.0 too.
    "arkhai-kit-site>=0.15.0",
    "arkhai-kit-resource-pools>=0.11.0",
    # The first version exporting its table baseline, which the migration
    # chain composes.
    "arkhai-kit-fulfillment>=0.8.0",
    # The job record's structured failure and its migration, which the
    # chain composes.
    "arkhai-compute-provisioning>=0.31.0",
    # The engine the chain runs on, over the service's SQLAlchemy engine.
    "arkhai-kit-schema-migrations[sqlalchemy]>=0.2.0",
    # The executor classifying a failed run through the codec's classify.
    "arkhai-compute-provisioning-ansible>=0.10.0",
    "arkhai-core-storefront-client==0.30.0",
    "arkhai-kit-identity==0.5.0",
    "dynaconf>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "dependency-injector>=4.41.0",
    "fastapi-utils>=0.8.0",
    "typing-inspect>=0.9.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.28.1",
    "aiohttp>=3.9",
    "cachetools>=5.3",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
adapters = [
    # Both codecs classify their failures for the executor.
    "arkhai-vms-provisioning-adapter>=0.22.0",
    "arkhai-bare-metal-provisioning-adapter>=0.16.0",
]

[project.scripts]
compute-provisioning-api = "compute_provisioning_service.main:run"
compute-provisioning-worker = "compute_provisioning_service.worker:main"
compute-provisioning-migrate = "compute_provisioning_service.db.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_provisioning_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "arkhai-vms-provisioning-adapter>=0.22.0",
    # VM's typed operator client, which the integration suite drives VM's
    # routes with.
    "arkhai-vms-provisioning-operator-client>=0.12.0",
    "arkhai-bare-metal-provisioning-adapter>=0.16.0",
    # The bare-metal view's contract fixture, which the producer test validates
    # its projected views against.
    "arkhai-bare-metal>=0.13.0",
    # The canonical typed clients the integration suite drives every route with.
    "arkhai-compute-provisioning-client>=0.13.0",
    "arkhai-kit-resource-pools-client>=0.1.0",
    "arkhai-kit-site-client>=0.12.0",
    # The storefront-side projection state and the aggregate it reads sites
    # through, which one integration test composes over the real site client
    # against this service.
    "arkhai-kit-capacity-publication==0.12.1",
    "arkhai-core-storefront>=0.14.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
]
