[project]
name = "arkhai-compute-provisioning-service"
version = "0.1.0"
license = "MIT"
description = "Deployable cross-domain compute provisioning service"
requires-python = ">=3.12"
dependencies = [
    "arkhai-compute-provisioning>=0.5.0",
    "arkhai-kit-resource-pools>=0.1.0",
    "fastapi>=0.115.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_provisioning_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.sources]
arkhai-compute-provisioning = { path = "..", editable = true }
arkhai-kit-resource-pools = { path = "../../../kit/resource-pools", editable = true }
