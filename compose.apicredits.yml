# API-credits market on the local dev chain — standalone bring-up: the shared
# Anvil chain and the API-credits domain stack, with no VM services. See
# domains/apicredits/compose.yml.
#
# This file composes base topology only, and its services refuse to start alone.
# The development identities, configuration, secret overlay, registry profile
# and buyer service live in compose.apicredits-local.yml, layered with `-f`
# because an including file cannot redefine a service it imported:
#
#     docker compose -f compose.apicredits.yml -f compose.apicredits-local.yml up -d
include:
  - compose.dev.yml
  - domains/apicredits/compose.yml
