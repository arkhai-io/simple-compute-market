# API-credits market on the local dev chain — standalone bring-up: the shared
# Anvil chain and the API-credits domain stack, with no VM services. See
# domains/apicredits/compose.yml.
#
# This file composes base topology only. The development signer, wallet, and
# buyer-path bindings live in compose.apicredits-local.yml, layered with `-f`
# because an including file cannot redefine a service it imported:
#
#     make -s --no-print-directory e2e-apicredits-dev-env > .e2e-apicredits.env
#     docker compose --env-file .e2e-apicredits.env \
#       -f compose.apicredits.yml -f compose.apicredits-local.yml up -d
include:
  - compose.dev.yml
  - domains/apicredits/compose.yml
