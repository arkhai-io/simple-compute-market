# What the change workflow assumes about this repository. Every field configures one
# operation of a skill or the engine, and each comment names who uses it. Values Git
# or the invocation supplies are not here: the branch a change lands on, the remote,
# the kube context.

[workflow]
# Engine, every command that reads this file: the change workflow versions this
# repository accepts, checked before anything else here.
version = ">=0.1, <0.2"

[repository]
# Engine, guarded push: refuses to push these, whichever step asks.
protected-branches = ["main", "dev"]
# Engine, next-step computation: after a pre-closeout review, a commit changing only
# these paths or a change's records needs no new validation. Engine, `run
# pre-commit`: a commit changing only these runs only `pre-commit`. An entry with a
# glob character is a pattern over the whole path; `**` spans directories.
inert-paths = ["openspec/", "docs/", "**/README.md", "AGENTS.md"]

[hooks]
# Engine, `run pre-commit` and `run after-functional-change`, for change-implement,
# change-triage, and change-merge, the steps its hook table admits: after the step's
# last functional change (any edit outside `inert-paths`, a merge's resolutions
# included), before the pre-commit hooks.
after-functional-change = ["make lock"]
# Engine, `run pre-commit`, for every step that commits and the review: before each
# commit, after the workflow's default checks.
pre-commit = "make check-repository CHANGE={change} CHANGE_BASE={base}"
# Engine, `run pre-commit`, for change-implement, change-triage, and change-merge:
# also before a commit that changes a path outside `inert-paths`. It clears the
# wheelhouse, checks packaging, and runs every suite on the worktree as it stands,
# leaving the `local` kind's evidence for the tree the commit then holds.
pre-commit-functional = ["make validate-local TREE={tree}"]
# Engine, `run pre-archive`, for change-closeout: once, before the archive.
pre-archive = ["make check-packaging", "make check-architecture-change CHANGE={change}"]
# Engine, guarded push: before anything is sent, under Git's hook contract. The
# repository's own Git hook, scripts/hooks/pre-push, runs the same target.
pre-push = "make pre-push REMOTE={remote}"
# Engine, `clone`: as a clone is made, in the background; implementation and
# validation wait for it.
post-clone = "make init"
# Engine, `run test-before`, for change-implement and change-triage: one test file,
# as HEAD holds it, run in a detached worktree of an earlier commit, to show a test
# fails without the change. The checkout's scripts/test_before.py runs it in the
# environment of the project that owns it, rebuilding only the wheels
# TEST_BEFORE_DIST names; the scripts' suites run with no built environment.
test-before = "python3 \"$(git rev-parse --path-format=absolute --git-common-dir)/../scripts/test_before.py\" {test}"

[defaults]
# Engine, `run pre-commit` and `check change`: the workflow's default checks this
# repository has turned off, each with its reason.
disable = []

[openspec]
# Engine, `scripts/change-workflow openspec` and the default pre-commit's strict
# validation: how the OpenSpec CLI is run.
command = "scripts/openspec"

[load]
# Engine, `config load <step>`: the documents every step's skill reads as it
# starts, after the engineering guidance and the workflow's own; the engine's
# post-compaction hook re-reads them. The root guidance, then
# `docs/guidance/repository/`, a directory entry standing for every Markdown file
# beneath it, so a guidance file added or moved there is read without editing this
# list, then the repository's cross-system documents and its OpenSpec guide, each a
# file.
common = ["AGENTS.md", "docs/guidance/repository/", "docs/development/ARCHITECTURE.md",
          "docs/development/TESTING.md", "docs/development/DEPLOYMENT_AND_CONFIG.md",
          "openspec/README.md"]
# Engine, `config load design`: change-design's own addition.
design = ["docs/development/ROADMAP.md"]

[sandbox]
# Engine, the wrapper and the review: paths each unattended step's sandbox may write
# besides the engine's baseline and its adapter's state; `common` for every step but
# review, a step's own key for that step alone. Relative paths are from the
# checkout's root; `~` is the home directory.
# uv's managed Pythons and tools, the cluster client's cache, the cloud CLI's token
# refresh, Docker's client configuration, and npm's cache for the OpenSpec command
# `npx` runs: the suites, builds, checks and deployments the writing steps and
# validation's new attempts run.
writable.common = ["~/.local/share/uv", "~/.kube/cache", "~/.config/gcloud", "~/.docker",
                   "~/.npm"]
# Design and planning keep this repository's documentation under `docs/` current.
writable.design = ["docs/"]
writable.plan = ["docs/"]
# Paths no step writes, beyond the engine's and the adapters' own: none.
protected = []

[review]
# Engine, the review: how many times a reviewer's draft the format check refuses is
# sent back to the reviewer's session for correction before the run stops; 0 never.
format-retries = 1

[validation]
# Engine, `gather <change>`, for change-validate: before any kind, a failure ending
# validation as environmental.
preflight = ["make check-uv-version"]

# Engine, `evidence` and `gather`, for change-validate: validation's evidence kinds,
# in order, each assessed from its guide; engine, `history`, copies the evidence
# under each pattern's fixed directory, which Git ignores. `local` and `helm`
# describe the tree they ran on; `pipeline` and `ci` the commit, since their runs are
# dispatched for it and CI's baseline is chosen by its ancestry.

[validation.evidence.pipeline]
# Started first, right after the guarded push: it is the slowest kind.
required = "always"
start    = "make run-e2e"
collect  = "make fetch-e2e-logs E2E_AFTER_RUN={after} COMMIT={commit}"
evidence = ".snapshot/evidence/{commit}/pipeline/*/summary.json"
guide    = ".agents/evidence/pipeline.md"

[validation.evidence.ci]
# Started once for each workflow a complete section owes, each run named by its
# workflow (`gather <change> --kind ci --owed <workflow>` for one again).
required = "owed"
start    = "make run-ci WORKFLOW={owed}"
collect  = "make validate-ci WORKFLOW={owed} CI_AFTER_RUN={after} COMMIT={commit}"
evidence = ".snapshot/evidence/{commit}/ci-{owed}/*/summary.json"
guide    = ".agents/evidence/ci.md"

[validation.evidence.local]
# The packaging and every suite, on this machine.
required = "always"
run      = "make validate-local TREE={tree}"
evidence = ".snapshot/evidence/{tree}/local/*/summary.json"
guide    = ".agents/evidence/local.md"

[validation.evidence.helm]
# After local, never beside it: they share Docker and the CPU.
required = "always"
after    = "local"
run      = "make validate-helm CHANGE={change} TREE={tree}"
evidence = ".snapshot/evidence/{tree}/helm/*/summary.json"
guide    = ".agents/evidence/helm.md"
# Engine, `run cleanup <change>`, for change-archive-cleanup: record what the
# release used, then remove the change's namespace and images.
cleanup  = ["make record-capacity CHANGE={change}", "make -C helm teardown CHANGE={change}"]
