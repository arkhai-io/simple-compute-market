# What a checkout's own change workflow settings start from: those developers on
# this repository may give different values, kept in .agents/workflow.local.toml,
# which Git ignores; edit them there. Everything else the workflow assumes is
# committed, in .agents/workflow.toml.

[guidance]
# Engine, `config load <step>`: the engineering guidance every step's skill reads
# first, a directory from the checkout's root or from `~`.
engineering = { path = "docs/guidance/engineering/" }

[models]
# Engine, `start orchestrate`: the orchestrating session's model and effort.
orchestrator = { model = "claude-opus-5-5", effort = "medium" }
# Engine, the wrapper and the review: each step's models in order of preference,
# the steps this repository's work is expected to run on. The review runs on Codex,
# which a confined review runs without its own sandbox, falling back to Claude when
# Codex is unavailable.
review          = [{ harness = "codex",  model = "gpt-6-sol",         effort = "high" },
                   { harness = "claude", model = "claude-opus-5-5",   effort = "high" }]
design          = [{ harness = "claude", model = "claude-opus-5-5",   effort = "high" }]
plan            = [{ harness = "claude", model = "claude-opus-5-5",   effort = "high" }]
triage          = [{ harness = "claude", model = "claude-opus-5-5",   effort = "high" }]
implement       = [{ harness = "claude", model = "claude-opus-5-5",   effort = "high" }]
validate        = [{ harness = "claude", model = "claude-sonnet-5-5", effort = "medium" }]
merge           = [{ harness = "claude", model = "claude-opus-5-5",   effort = "high" }]
closeout        = [{ harness = "claude", model = "claude-opus-5-5",   effort = "high" }]
archive-cleanup = [{ harness = "claude", model = "claude-sonnet-5-5", effort = "medium" }]

# [sandbox]
# Engine, the wrapper: writable paths this checkout's steps add to the committed
# ones, which they extend and never narrow, such as a tool's cache of your own.
# writable.common = ["~/.cache/my-own-tool"]
