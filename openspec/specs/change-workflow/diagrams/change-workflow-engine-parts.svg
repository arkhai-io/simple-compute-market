<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2340">
<text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2340">The change workflow engine: its parts, and the files they read and write</text>
<text x="20" y="50" font-size="12" fill="#4a4f6a">Each small box is a module of the engine&#x27;s package, change_workflow. Each file box below a column names what its modules read and write, and who writes it.</text>
<text x="20" y="66" font-size="12" fill="#4a4f6a">Arrows: a part acts on what it points to. A rail from a column&#x27;s frame reaches each file below it. Dashed: outside the checkout&#x27;s tracked files, or shared by every module. Validation&#x27;s evidence kinds are entries of the configuration, not parts.</text>
<text x="32" y="262" font-size="13" font-weight="bold" fill="#1f2340">Running a step</text>
