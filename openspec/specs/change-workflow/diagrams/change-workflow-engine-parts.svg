<text x="1410.5" y="831">committed: the range, hooks, load,</text>
<text x="1410.5" y="846">sandbox; validation&#x27;s kinds, entries</text>
<text x="1410.5" y="886" font-weight="bold">.agents/workflow.local.toml</text>
<text x="1410.5" y="901">local: the engineering pointer,</text>
<text x="1410.5" y="916">models, added writable paths</text>
