<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2340" text-anchor="middle">
<text x="265" y="108.5" font-weight="bold">the owner · the orchestrating session</text>
<text x="265" y="123.5">start, resume, record, next, note</text>
<text x="265" y="170.5" font-weight="bold">make targets</text>
