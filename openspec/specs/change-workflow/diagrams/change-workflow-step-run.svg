<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2340">
<text x="20" y="28" font-size="16" font-weight="bold">A step run's life: unattended, answered, and interactive</text>
<text x="190" y="67" font-size="13" font-weight="bold">An unattended run, and the answer to its question</text>
<text x="1030" y="67" font-size="13" font-weight="bold">An interactive run</text>
<text x="20" y="846" font-size="12">A run that crashes, or ends without a valid outcome, is logged stopped by the wrapper itself. An answer resumes the waiting run named by its seq; the wrapper refuses one that no longer waits.</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2340" text-anchor="middle">
<text x="95" y="134" font-weight="bold">the owner</text>
<text x="95" y="249" font-weight="bold">relay</text>
<text x="95" y="264">the orchestrating</text>
<text x="95" y="279">session</text>
<text x="95" y="431.5" font-weight="bold">the command</text>
<text x="95" y="446.5">scripts/change-</text>
<text x="95" y="461.5">workflow: cli,</text>
<text x="95" y="476.5">wrapper, log</text>
<text x="95" y="609" font-weight="bold">harness session</text>
<text x="95" y="624">claude -p, or a</text>
<text x="95" y="639">plain claude</text>
<text x="95" y="739" font-weight="bold">files</text>
<text x="95" y="754">the change's</text>
<text x="95" y="769">reviews/</text>
<text x="895" y="112" font-weight="bold">the owner</text>
<text x="895" y="127">reads each message as</text>
<text x="895" y="142">written; answers a</text>
<text x="895" y="157">question</text>
<text x="1122.5" y="112" font-weight="bold">the owner</text>
<text x="1122.5" y="127">start &lt;step&gt; &lt;change&gt;,</text>
<text x="1122.5" y="142">without --unattended</text>
<text x="280" y="207" font-weight="bold">start --unattended</text>
<text x="280" y="222">start &lt;step&gt; &lt;change&gt;</text>
<text x="280" y="237">--unattended, or make</text>
<text x="280" y="252">with UNATTENDED=1</text>
<text x="485" y="207" font-weight="bold">resume</text>
<text x="485" y="222">resume &lt;change&gt; --seq N</text>
<text x="485" y="237">--answer …: the owner's</text>
<text x="485" y="252">answer, relayed</text>
<text x="895" y="207" font-weight="bold">relays</text>
<text x="895" y="222">shows the step's message</text>
<text x="895" y="237">as written; runs the</text>
<text x="895" y="252">step next names</text>
<text x="280" y="369" font-weight="bold">start</text>
<text x="280" y="384">refuses what the step</text>
<text x="280" y="399">cannot take; opens the</text>
<text x="280" y="414">log with its format line</text>
<text x="485" y="369" font-weight="bold">wrapper.resume</text>
<text x="485" y="384">seq N must still wait:</text>
<text x="485" y="399">its step's latest run,</text>
<text x="485" y="414">a question or a stop</text>
<text x="895" y="369" font-weight="bold">next</text>
<text x="895" y="384">the next step, computed</text>
<text x="895" y="399">from the files and</text>
<text x="895" y="414">the log</text>
<text x="1122.5" y="369" font-weight="bold">start</text>
<text x="1122.5" y="384">opens the log with its</text>
<text x="1122.5" y="399">format line; launches</text>
<text x="1122.5" y="414">claude /change-&lt;step&gt;</text>
<text x="280" y="491" font-weight="bold">wrapper</text>
<text x="280" y="506">skill and rules from the</text>
<text x="280" y="521">step table; models from</text>
<text x="280" y="536">the configuration</text>
<text x="690" y="491" font-weight="bold">wrapper</text>
<text x="690" y="506">checks the outcome; logs</text>
<text x="690" y="521">stopped if none or</text>
<text x="690" y="536">bad; adds denials, cost</text>
<text x="1327.5" y="491" font-weight="bold">record</text>
<text x="1327.5" y="506">the session's last act:</text>
<text x="1327.5" y="521">record &lt;change&gt; &lt;step&gt;</text>
<text x="1327.5" y="536">--outcome …</text>
<text x="485" y="602" font-weight="bold">claude -p</text>
<text x="485" y="617">/change-&lt;step&gt; &lt;change&gt;,</text>
<text x="485" y="632">the step's rules, the</text>
<text x="485" y="647">outcome schema</text>
<text x="690" y="602" font-weight="bold">outcome</text>
<text x="690" y="617">finished · question ·</text>
<text x="690" y="632">returned · blocked ·</text>
<text x="690" y="647">stopped</text>
<text x="1122.5" y="602" font-weight="bold">plain session</text>
<text x="1122.5" y="617">the owner's own</text>
<text x="1122.5" y="632">permissions; the owner</text>
<text x="1122.5" y="647">works the step in it</text>
<text x="485" y="717" font-weight="bold">transcript</text>
<text x="485" y="732">reviews/transcripts/</text>
<text x="485" y="747">NN-&lt;step&gt;.jsonl, and a</text>
<text x="485" y="762">.progress line per call</text>
<text x="895" y="717" font-weight="bold">log line</text>
<text x="895" y="732">reviews/workflow.jsonl:</text>
<text x="895" y="747">seq, step, outcome,</text>
<text x="895" y="762">session, commit, model,</text>
<text x="895" y="777">transcript, cost</text>
<text x="1122.5" y="717" font-weight="bold">opening line</text>
<text x="1122.5" y="732">reviews/workflow.jsonl:</text>
<text x="1122.5" y="747">step start, outcome</text>
<text x="1122.5" y="762">opened, format 2,</text>
<text x="1122.5" y="777">interactive: true</text>
<text x="1327.5" y="717" font-weight="bold">outcome line</text>
<text x="1327.5" y="732">the outcome, session id,</text>
<text x="1327.5" y="747">HEAD, interactive: true;</text>
<text x="1327.5" y="762">the id from the harness's</text>
<text x="1327.5" y="777">CLAUDE_CODE_SESSION_ID</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4a4f6a" text-anchor="middle">
<rect x="310.5" y="611" width="58" height="18" fill="#ffffff"/>
<text x="339.5" y="624">launches</text>
<rect x="583" y="121" width="64" height="18" fill="#ffffff"/>
<text x="615" y="134">an answer</text>
<rect x="428.5" y="487.5" width="113" height="32" fill="#ffffff"/>
<text x="485" y="500.5">the same session,</text>
<text x="485" y="514.5">on its model</text>
<rect x="444" y="668.5" width="82" height="18" fill="#ffffff"/>
<text x="485" y="681.5">event stream</text>
<rect x="799.5" y="614.25" width="51" height="18" fill="#ffffff"/>
<text x="825" y="627.25">appends</text>
<rect x="854" y="552" width="82" height="18" fill="#ffffff"/>
<text x="895" y="565">read by next</text>
<rect x="847.5" y="297" width="95" height="18" fill="#ffffff"/>
<text x="895" y="310">names the step</text>
<rect x="490.5" y="291" width="89" height="18" fill="#ffffff"/>
<text x="535" y="304">the next step</text>
<rect x="1097" y="249.5" width="51" height="18" fill="#ffffff"/>
<text x="1122.5" y="262.5">by hand</text>
<rect x="1093.5" y="494.5" width="58" height="18" fill="#ffffff"/>
<text x="1122.5" y="507.5">launches</text>
<rect x="1241" y="610.5" width="82" height="18" fill="#ffffff"/>
<text x="1282" y="623.5">its last act</text>
<rect x="1359.5" y="613" width="51" height="18" fill="#ffffff"/>
<text x="1385" y="626">appends</text>
</g>
</svg>
