<rect x="1328.6" y="459" width="32.8" height="15" fill="#ffffff" stroke="none"/>
<text x="1345" y="470">runs</text>
<rect x="1338.8" y="629" width="82.4" height="15" fill="#ffffff" stroke="none"/>
<text x="1380" y="640">its last act</text>
<rect x="1494.3" y="639" width="51.4" height="15" fill="#ffffff" stroke="none"/>
