<text x="627" y="305">the same session</text>
<rect x="1199.3" y="249" width="51.4" height="15" fill="#ffffff" stroke="none"/>
<text x="1225" y="260">by hand</text>
<rect x="1196.2" y="489" width="57.6" height="15" fill="#ffffff" stroke="none"/>
<text x="1225" y="500">launches</text>
