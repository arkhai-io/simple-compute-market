<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2340" text-anchor="middle">
<text x="90" y="134" font-weight="bold">the owner</text>
<text x="90" y="234" font-weight="bold">relay</text>
<text x="90" y="249">the orchestrating</text>
<text x="90" y="264">session</text>
<text x="90" y="416.5" font-weight="bold">the command</text>
<text x="90" y="431.5">change-workflow:</text>
<text x="90" y="446.5">start, around,</text>
<text x="90" y="461.5">wrapper, log</text>
<text x="90" y="614" font-weight="bold">harness session</text>
<text x="90" y="629">inside the step&#x27;s</text>
<text x="90" y="644">sandbox, or plain</text>
<text x="90" y="754" font-weight="bold">files</text>
<text x="90" y="769">the change&#x27;s</text>
<text x="90" y="784">reviews/</text>
<text x="632.5" y="121" font-weight="bold">the owner</text>
<text x="632.5" y="136">reads each message as</text>
<text x="632.5" y="151">written; answers a question</text>
<text x="262.5" y="222.5" font-weight="bold">start --unattended</text>
<text x="262.5" y="237.5">start &lt;step&gt; &lt;change&gt;</text>
<text x="262.5" y="252.5">--unattended, or make</text>
<text x="262.5" y="267.5">with UNATTENDED=1</text>
<text x="632.5" y="222.5" font-weight="bold">resume</text>
<text x="632.5" y="237.5">resume &lt;change&gt; --seq N</text>
<text x="632.5" y="252.5">--answer …: the owner&#x27;s</text>
<text x="632.5" y="267.5">answer, relayed</text>
<text x="1002.5" y="222.5" font-weight="bold">relays</text>
<text x="1002.5" y="237.5">shows the step&#x27;s message</text>
<text x="1002.5" y="252.5">as written; runs the step</text>
<text x="1002.5" y="267.5">next names</text>
<text x="262.5" y="344" font-weight="bold">start</text>
<text x="262.5" y="359">refuses what the step</text>
<text x="262.5" y="374">can&#x27;t take; checks the</text>
<text x="262.5" y="389">range and the skills;</text>
<text x="262.5" y="404">opens the log</text>
<text x="447.5" y="347.5" font-weight="bold">around: before</text>
<text x="447.5" y="362.5">the engine&#x27;s action, then</text>
<text x="447.5" y="377.5">before-&lt;step&gt;, into the</text>
<text x="447.5" y="392.5">run&#x27;s inputs</text>
<text x="632.5" y="347.5" font-weight="bold">wrapper</text>
<text x="632.5" y="362.5">scope, sandbox, a model;</text>
<text x="632.5" y="377.5">launches, or resumes</text>
<text x="632.5" y="392.5">the waiting session</text>
<text x="1002.5" y="347.5" font-weight="bold">next</text>
<text x="1002.5" y="362.5">the next step, computed</text>
<text x="1002.5" y="377.5">from the files and</text>
<text x="1002.5" y="392.5">the log</text>
<text x="1002.5" y="477.5" font-weight="bold">wrapper: after</text>
<text x="1002.5" y="492.5">the seven checks; the</text>
<text x="1002.5" y="507.5">outcome checked; denials,</text>
<text x="1002.5" y="522.5">refusals, cost</text>
<text x="817.5" y="477.5" font-weight="bold">around: after</text>
<text x="817.5" y="492.5">after-&lt;step&gt; on a finished</text>
<text x="817.5" y="507.5">outcome; a failure</text>
<text x="817.5" y="522.5">resumes once</text>
<text x="632.5" y="602.5" font-weight="bold">harness session</text>
<text x="632.5" y="617.5">bwrap; claude -p or</text>
<text x="632.5" y="632.5">codex, /change-&lt;step&gt;;</text>
<text x="632.5" y="647.5">reads its inputs</text>
<text x="817.5" y="602.5" font-weight="bold">outcome</text>
<text x="817.5" y="617.5">finished · question ·</text>
<text x="817.5" y="632.5">returned · blocked ·</text>
<text x="817.5" y="647.5">stopped</text>
<text x="447.5" y="740.5" font-weight="bold">inputs</text>
<text x="447.5" y="755.5">reviews/runs/&lt;run&gt;/</text>
<text x="447.5" y="770.5">before/ and after/:</text>
<text x="447.5" y="785.5">status.md, messages</text>
<text x="632.5" y="740.5" font-weight="bold">transcript</text>
<text x="632.5" y="755.5">reviews/transcripts/</text>
<text x="632.5" y="770.5">NN-&lt;step&gt;.jsonl, and a</text>
<text x="632.5" y="785.5">.progress line per call</text>
<text x="1002.5" y="740.5" font-weight="bold">log line</text>
<text x="1002.5" y="755.5">reviews/workflow.jsonl:</text>
<text x="1002.5" y="770.5">seq, step, outcome, model,</text>
<text x="1002.5" y="785.5">inputs, cost, workflow</text>
<text x="1225" y="121" font-weight="bold">the owner</text>
<text x="1225" y="136">start &lt;step&gt; &lt;change&gt;,</text>
<text x="1225" y="151">without --unattended</text>
<text x="1225" y="347.5" font-weight="bold">start</text>
<text x="1225" y="362.5">opens the log with its</text>
<text x="1225" y="377.5">format line; launches</text>
<text x="1225" y="392.5">claude /change-&lt;step&gt;</text>
<text x="1465" y="347.5" font-weight="bold">run before | after</text>
<text x="1465" y="362.5">the session runs its</text>
<text x="1465" y="377.5">step&#x27;s actions and</text>
<text x="1465" y="392.5">hooks itself</text>
<text x="1465" y="477.5" font-weight="bold">record</text>
<text x="1465" y="492.5">the session&#x27;s last act:</text>
<text x="1465" y="507.5">record &lt;change&gt; &lt;step&gt;</text>
<text x="1465" y="522.5">--outcome …</text>
<text x="1225" y="610" font-weight="bold">plain session</text>
<text x="1225" y="625">the owner&#x27;s own</text>
<text x="1225" y="640">permissions; no sandbox</text>
<text x="1225" y="740.5" font-weight="bold">opening line</text>
<text x="1225" y="755.5">reviews/workflow.jsonl:</text>
<text x="1225" y="770.5">the step&#x27;s start, format 2,</text>
<text x="1225" y="785.5">interactive: true</text>
<text x="1465" y="740.5" font-weight="bold">outcome line</text>
<text x="1465" y="755.5">the outcome, session id,</text>
<text x="1465" y="770.5">HEAD, interactive: true,</text>
<text x="1465" y="785.5">the hooks it ran</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2340">
<text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2340">A step run&#x27;s life: unattended, answered, and interactive</text>
<text x="175" y="67" font-size="13" font-weight="bold" fill="#1f2340">An unattended run, and the answer to its question</text>
<text x="1140" y="67" font-size="13" font-weight="bold" fill="#1f2340">An interactive run</text>
<text x="20" y="868" font-size="12" fill="#4a4f6a">A run that crashes, or ends without a valid outcome, is logged stopped by the wrapper itself, and so is one a check after it finds broken, with no after-hook run.</text>
<text x="20" y="886" font-size="12" fill="#4a4f6a">A failing before-hook prevents nothing, its failure in the run&#x27;s inputs; a failing after-hook resumes the session once, then the run ends as a question. An answer resumes the waiting run named by its seq.</text>
</g>
