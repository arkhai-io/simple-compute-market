<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="880" viewBox="0 0 1300 880">
<title>Where a change's state lives</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f3350"/></marker>
</defs>
<rect x="0" y="0" width="1300" height="880" fill="#ffffff"/>
<g stroke-width="1.2">
<rect x="30" y="60" width="500" height="380" rx="4" fill="#ffffff" stroke="#c98ac4"/>
<rect x="50" y="120" width="460" height="55" rx="5" fill="#fdf2fb" stroke="#c98ac4"/>
<rect x="50" y="190" width="460" height="70" rx="5" fill="#fdf2fb" stroke="#c98ac4"/>
<rect x="50" y="275" width="460" height="70" rx="5" fill="#fdf2fb" stroke="#c98ac4"/>
<rect x="50" y="360" width="460" height="55" rx="5" fill="#fdf2fb" stroke="#c98ac4"/>
<rect x="770" y="60" width="500" height="525" rx="4" fill="#ffffff" stroke="#e3a765"/>
<rect x="790" y="120" width="460" height="55" rx="5" fill="#fff6ec" stroke="#e3a765"/>
<rect x="790" y="190" width="460" height="55" rx="5" fill="#fff6ec" stroke="#e3a765"/>
<rect x="790" y="275" width="460" height="70" rx="5" fill="#fff6ec" stroke="#e3a765"/>
<rect x="790" y="360" width="460" height="55" rx="5" fill="#fff6ec" stroke="#e3a765"/>
<rect x="790" y="430" width="460" height="40" rx="5" fill="#fff6ec" stroke="#e3a765"/>
<rect x="790" y="480" width="460" height="40" rx="5" fill="#fff6ec" stroke="#e3a765"/>
<rect x="790" y="530" width="460" height="40" rx="5" fill="#fff6ec" stroke="#e3a765"/>
<rect x="30" y="560" width="500" height="180" rx="4" fill="#ffffff" stroke="#6fc2a5"/>
<rect x="50" y="620" width="460" height="55" rx="5" fill="#eefaf6" stroke="#6fc2a5"/>
<rect x="50" y="685" width="460" height="40" rx="5" fill="#eefaf6" stroke="#6fc2a5"/>
<rect x="770" y="640" width="500" height="210" rx="4" fill="#ffffff" stroke="#8a8fa8"/>
<rect x="790" y="700" width="460" height="55" rx="5" fill="#f4f5f9" stroke="#8a8fa8"/>
<rect x="790" y="765" width="460" height="40" rx="5" fill="#f4f5f9" stroke="#8a8fa8"/>
</g>
<g fill="none" stroke="#2f3350" stroke-width="1.2">
<polyline points="510,147.5 790,147.5" marker-end="url(#arrow)"/>
<polyline points="510,217.5 790,217.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<polyline points="790,310 510,310" marker-end="url(#arrow)"/>
<polyline points="790,387.5 510,387.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<polyline points="770,548 650,548 650,647.5 510,647.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<polyline points="280,440 280,560" stroke-dasharray="6 4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<polyline points="1020,585 1020,640" marker-end="url(#arrow)"/>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2340">
<text x="20" y="30" font-size="16" font-weight="bold">Where a change's state lives</text>
<text x="42" y="79" font-size="13" font-weight="bold">The owner's workspace</text>
<text x="42" y="95" font-size="13">their editor project; a change's workflow meets it for reading</text>
<text x="782" y="79" font-size="13" font-weight="bold">The change's clone</text>
<text x="782" y="95" font-size="13">&lt;workspace&gt;.changes/&lt;change&gt;/</text>
<text x="42" y="579" font-size="13" font-weight="bold">the branch's remote</text>
<text x="42" y="595" font-size="13">its upstream's, read from Git</text>
<text x="782" y="659" font-size="13" font-weight="bold">Session transcripts</text>
<text x="782" y="675" font-size="13">on the machine that ran them, in each harness's own store</text>
<text x="790" y="828" font-size="12">keyed to the checkout's path: a run resumes where it ran</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2340" text-anchor="middle">
<text x="280" y="137" font-weight="bold">the owner's checkout</text>
<text x="280" y="152">their own branch and edits</text>
<text x="280" y="207" font-weight="bold">round view</text>
<text x="280" y="222">the change's branch, fast-forwarded from the clone</text>
<text x="280" y="237">and reset to the round's base; one at a time, its</text>
<text x="280" y="252">state in the workspace's Git directory</text>
<text x="280" y="292" font-weight="bold">history of every cleaned-up change</text>
<text x="280" y="307">openspec/changes/archive/&lt;date&gt;-&lt;change&gt;/reviews/</text>
<text x="280" y="322">and the .snapshot/ evidence its records name,</text>
<text x="280" y="337">at the same paths as in the clone</text>
<text x="280" y="377" font-weight="bold">the clone's workspace remote names it</text>
<text x="280" y="392">how every script in a clone finds the workspace</text>
<text x="1020" y="137" font-weight="bold">a clone of the workspace, not a worktree</text>
<text x="1020" y="152">refs of its own; a local clone hard-links objects</text>
<text x="1020" y="207" font-weight="bold">branch feat/&lt;change&gt;, checked out here</text>
<text x="1020" y="222">it tracks its name on the push remote, never the workspace</text>
<text x="1020" y="292" font-weight="bold">openspec/changes/&lt;change&gt;/reviews/</text>
<text x="1020" y="307">records NN-*.md, the log workflow.jsonl,</text>
<text x="1020" y="322">transcripts/ with each run's .progress;</text>
<text x="1020" y="337">untracked, so no merge carries them</text>
<text x="1020" y="377" font-weight="bold">remotes</text>
<text x="1020" y="392">workspace; the upstreams, by the workspace's names</text>
<text x="1020" y="447" font-weight="bold">wheelhouse and environments</text>
<text x="1020" y="462">built by the repository's bootstrap, in the background</text>
<text x="1020" y="497" font-weight="bold">.snapshot/</text>
<text x="1020" y="512">the validation evidence</text>
<text x="1020" y="547" font-weight="bold">the clone's Git directory</text>
<text x="1020" y="562">bootstrap state; the runs in progress</text>
<text x="280" y="637" font-weight="bold">feat/&lt;change&gt;, pushed</text>
<text x="280" y="652">exactly HEAD, never forced; validation and CI run it</text>
<text x="280" y="702" font-weight="bold">the branch a change lands on</text>
<text x="280" y="717">recorded with the clone; where its branch starts</text>
<text x="1020" y="717" font-weight="bold">Claude Code</text>
<text x="1020" y="732">~/.claude/projects/&lt;checkout path&gt;/&lt;session&gt;.jsonl,</text>
<text x="1020" y="747">its subagents' transcripts beside it</text>
<text x="1020" y="782" font-weight="bold">Codex</text>
<text x="1020" y="797">its own session store, where a review resumes</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4a4f6a" text-anchor="middle">
<rect x="587" y="131.5" width="126" height="32" fill="#ffffff"/>
<text x="650" y="144.5">clone: created from</text>
<text x="650" y="158.5">the workspace</text>
<rect x="571.5" y="208.5" width="157" height="18" fill="#ffffff"/>
<text x="650" y="221.5">fetch, fast-forward pull</text>
<rect x="565.5" y="287" width="169" height="46" fill="#ffffff"/>
<text x="650" y="300">history: reviews/ and</text>
<text x="650" y="314">named evidence, at archive</text>
<text x="650" y="328">cleanup and clone removal</text>
<rect x="596.5" y="378.5" width="107" height="18" fill="#ffffff"/>
<text x="650" y="391.5">workspace remote</text>
<rect x="615" y="598.75" width="70" height="18" fill="#ffffff"/>
<text x="650" y="611.75">push, fetch</text>
<rect x="226.5" y="491" width="107" height="18" fill="#ffffff"/>
<text x="280" y="504">the same remotes</text>
<rect x="923" y="603.5" width="194" height="18" fill="#ffffff"/>
<text x="1020" y="616.5">step sessions run in the clone</text>
</g>
</svg>
