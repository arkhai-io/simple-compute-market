# Secret overlay for the bare-metal storefront in the bare-metal end-to-end lane,
# mounted as its storefront.secrets.toml by compose.bare-metal-local.yml.
#
# Well-known deterministic development values. Not secret, never was, and MUST
# NOT be used on a public network. See README.md in this directory.

# Anvil account 2's key, matching [Wallet].address in
# domains/bare_metal/storefront/storefront.dev.toml.
[Wallet]
private_key = "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"

# The seller's bearer token at the payments lane double, restating
# tools/payments-lane-double/fixtures/accounts.toml's seller token; a repository
# test holds the two equal.
[Settlement.arkhai_payments]
api_key = "payments-lane-double-seller-public-development-token"

# The seller's credential toward the dispute authority the bare-metal lane's
# registry recommends, the mediation lane double, bound to its identity and
# restating its seller token (tools/mediation-lane-double/fixtures/authority.toml);
# a repository test holds them equal. ca_bundle_path is where
# compose.bare-metal-local.yml mounts the lane CA, the only authority the
# mediation client trusts for the double. A payment deal's servicing reports it
# repair_required while the storefront holds no usable credential for the deal's
# authority.
[[DisputeCredential]]
interface = "arkhai.mediation.v1"
origin = "https://mediation-double:8443"
account = "00000000-0000-4000-8000-0000000000d1"
record_key = "ed25519:2b8hSHSKhcidparY7gsPwtEF_TnUGkx5ZTY1TwrikAw"
api_key = "mediation-lane-double-seller-public-development-token"
ca_bundle_path = "/run/lane-doubles/lane-ca.pem"
