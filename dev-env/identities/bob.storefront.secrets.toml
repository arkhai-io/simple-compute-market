# Secret overlay for the Bob storefront in the local compose stack.
#
# Well-known deterministic development values. Nothing here is secret, and
# these MUST NOT be used against a public network or a real registry. See
# README.md in this directory.
#
# This file exists because `domains/vms/compose.yml` starts `registry-b` with
# REGISTRY_REQUIRE_READ_API_KEY and REGISTRY_REQUIRE_WRITE_API_KEY both true,
# and `storefront.bob.toml` fans publishes and heartbeats out to both
# registries. The bearer token below must be byte-equal to the
# REGISTRY_BOOTSTRAP_API_KEY that registry-b is seeded with, which the e2e
# identity target supplies from the same constant.
#
# Only the token belongs here. Which registries demand a key is public and is
# declared in `storefront.bob.toml`.

[registry.auth]
"http://registry-b:8080" = "development-registry-bootstrap-key"
