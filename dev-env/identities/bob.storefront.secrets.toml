# Secret overlay for the Bob storefront, mounted as its storefront.secrets.toml by
# compose.vms-local.yml in the VM lane and the full local stack. The local Helm
# release's `make -C helm topology-secrets` copies its [[DisputeCredential]] into
# Bob's runtime Secret, its ca_bundle_path rewritten to the file the storefront
# chart mounts the CA bundle as, refusing the file if it states none or a value
# that is not a string.
#
# Well-known deterministic development values. Nothing here is secret, and
# these MUST NOT be used against a public network or a real registry. See
# README.md in this directory.
#
# Which registries demand a key, and which mechanisms are enabled, is public and
# is declared in Bob's storefront.toml; only the keys belong here.

# registry-b starts with REGISTRY_REQUIRE_READ_API_KEY and
# REGISTRY_REQUIRE_WRITE_API_KEY both true, and Bob fans publishes and heartbeats
# out to both registries. The bearer token must be byte-equal to the
# REGISTRY_BOOTSTRAP_API_KEY registry-b is seeded with, in
# dev-env/registry/config-registry-b.env.
[registry.auth]
"http://registry-b:8080" = "development-registry-bootstrap-key"

# Anvil account 2's key, matching [Wallet].address in Bob's storefront.toml.
[Wallet]
private_key = "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"

# The seller's bearer token at the payments lane double, restating
# tools/payments-lane-double/fixtures/accounts.toml's seller token; a repository
# test holds the two equal. It is used only where Bob's configuration enables
# payments, as the VM lane's storefront.bob.lane.toml does; the full local stack's
# storefront.bob.toml leaves payments off and the key unused.
[Settlement.arkhai_payments]
api_key = "payments-lane-double-seller-public-development-token"

# The seller's credential toward the dispute authority the VM lane's registries
# recommend, the mediation lane double, bound to its identity and restating its
# seller token (tools/mediation-lane-double/fixtures/authority.toml); a
# repository test holds them equal. ca_bundle_path is where compose.vms-lane.yml
# mounts the lane CA, the only authority the mediation client trusts for the
# double. A payment deal's servicing reports it repair_required while the
# storefront holds no usable credential for the deal's authority. The full local
# stack's registries recommend no authority, so there it is never used.
[[DisputeCredential]]
interface = "arkhai.mediation.v1"
origin = "https://mediation-double:8443"
account = "00000000-0000-4000-8000-0000000000d1"
record_key = "ed25519:2b8hSHSKhcidparY7gsPwtEF_TnUGkx5ZTY1TwrikAw"
api_key = "mediation-lane-double-seller-public-development-token"
ca_bundle_path = "/run/lane-doubles/lane-ca.pem"
