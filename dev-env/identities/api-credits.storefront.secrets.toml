# Secret overlay for the API-credit storefront, mounted as its
# storefront.secrets.toml by compose.apicredits-local.yml in the API-credit lane
# and the full local stack.
#
# Well-known deterministic development values. Not secret, never was, and MUST
# NOT be used on a public network. See README.md in this directory.

# Anvil account 3's key, matching [wallet].address in storefront.credits.toml.
# Without it the storefront publishes, negotiates and accepts, then refuses
# `POST /api/v1/settle/...` with `chain 'anvil' not configured`.
[wallet]
private_key = "0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6"

# The seller's bearer token at the payments lane double, restating
# tools/payments-lane-double/fixtures/accounts.toml's seller token; a repository
# test holds the two equal. It is used only where the configuration enables
# payments, as the API-credit lane's storefront.credits.lane.toml does; the full
# local stack's storefront.credits.toml leaves payments off and the key unused.
[settlement.arkhai_payments]
api_key = "payments-lane-double-seller-public-development-token"
