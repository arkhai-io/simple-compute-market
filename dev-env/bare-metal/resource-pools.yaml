# Development fixture, not for a real site. The bare-metal lane mounts it as
# its pool document, and any configured pool document stops the provisioning
# service applying its seed pools, whatever the document names. This one holds
# one inert pool, which offers nothing; a document need not name `default`, or
# any pool. Scenarios declare their own pools through the operator API. Startup
# reconciles this document only when it changes, so those pools survive
# restarts.
pools:
  - id: default
    label: Inert development default
    provider: bare_metal.ansible
    enabled: true
    policy_tags:
      deliverable_modes: []
      advertisable_modes: []
      capacity_backing: backed
    provider_config: {}
