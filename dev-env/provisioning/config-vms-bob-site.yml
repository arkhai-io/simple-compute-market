# Site profile for Bob's provisioning authority, `provisioning`, in the VM lane
# and the full local stack: compose.vms-local.yml binds it into
# CONFIG_DIRECTORY=/app/config beside the packaged config.yml and
# config-docker.yml, and loads ACTIVE_PROFILES=docker,vms-bob-site,<mode>.
#
# Public development identities (standard Anvil accounts), never for a public
# network; see dev-env/identities/README.md. Quoted, so each hex identifier
# stays a string. A repository test holds them to the signer credential the
# service mounts (dev-env/identities/provisioning.identity.env), the storefront
# principal storefront.bob.toml states, and the runner's pins in
# e2e-tests/config/config-docker.yml.

# The service's own signer: Anvil 0.
identity:
  scheme: "eip191"
  identifier: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"

# The storefront whose requests this authority serves: Bob, Anvil 2.
storefront_identity:
  scheme: "eip191"
  identifier: "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"

# The site alias Bob's storefront resolves against this authority.
storefront_site_id: "default"

# The provisioning administrator: Anvil 5.
admin_identity:
  scheme: "eip191"
  identifier: "0x9965507d1a55bcc2695c58ba16fb37d819b0a4dc"
