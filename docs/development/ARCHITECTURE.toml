# Internal distributions declared without an import, each with its reason.
# Declaring a plugin to install it needs no row.
[[declarations]]
project = "arkhai-bare-metal-buyer"
dependency = "arkhai-kit-alkahest"
reason = "Installs Alkahest's named buyer aggregation policies, which the core buyer discovers through market.buyer_aggregation_policies."

[[declarations]]
project = "arkhai-vms-storefront"
dependency = "arkhai-bare-metal"
reason = "Registers the bare-metal storefront domain, which the compute-family shell discovers through market.storefront_domains."

# Divergences the check reports, each owned by the change that removes it. A
# row excuses one finding of the rule it names and fails once it excuses
# nothing; its owner may not be archived while the row stands.
[[exceptions]]
rule = "layer"
project = "arkhai-kit-storefront"
target = "arkhai-core-storefront"
owner = "kit-owned-storefront-auth-and-persistence"
since = 2026-10-13
reason = "The kit composes the storefront role's hook shapes, which move to a storefront contracts kit."

[[exceptions]]
rule = "layer"
project = "arkhai-kit-capacity-publication"
target = "arkhai-core-storefront"
owner = "kit-owned-storefront-auth-and-persistence"
