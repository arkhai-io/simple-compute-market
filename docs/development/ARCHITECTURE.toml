# Divergences the check reports, each owned by the change that removes it. A
# row excuses one finding of the rule it names and fails once it excuses
# nothing; its owner may not be archived while the row stands.
[[exceptions]]
rule = "layer"
project = "arkhai-kit-storefront"
target = "arkhai-core-storefront"
owner = "kit-owned-storefront-auth-and-persistence"
since = 2026-10-13
reason = "The kit composes the storefront role's hook shapes, which move to a storefront contracts kit."

