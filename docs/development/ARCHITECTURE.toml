# The package layer, scope, and kind rules of ARCHITECTURE.md, in the form
# scripts/architecture.py reads. The prose is the contract; this file encodes
# what no one package owns and records every known divergence with the change
# that owns it. What a package owns about itself -- the distributions it may
# depend on, and why it installs one it never imports -- is in its own
# pyproject.toml, under [tool.arkhai.architecture].
# See ARCHITECTURE.md, "Package and dependency layers".

version = 1

# Lowest first. A package may depend on its own layer or a lower one.
[layers]
order = ["core", "kit", "specialization", "composition"]

[conventions]
# A last path segment, or the word after its last hyphen, is read as a kind
# only when it is one of these words. Role words make an executable, which is
# a composition, and are not read under kit/: a kit composes nothing.
kind_words = ["contracts", "client"]
role_words = ["storefront", "buyer", "service", "app"]
# Tooling and test harness projects outside the package architecture.
skip = ["e2e-tests", "tools", "scripts", "dev-env"]

[[families]]
name = "compute"
directory = "domains/compute"
vocabulary = "arkhai-compute"
tokens = []

[[families]]
name = "api"
directory = "domains/api"
vocabulary = "arkhai-api"
tokens = []

[[domains]]
name = "vms"
directory = "domains/vms"
family = "compute"
tokens = ["compute.v1"]

[[domains]]
name = "bare_metal"
directory = "domains/bare_metal"
family = "compute"
tokens = ["bare_metal.v1"]

[[domains]]
name = "apicredits"
directory = "domains/apicredits"
family = "api"
tokens = ["api_credits.v1"]

[[mechanisms]]
name = "alkahest"
kit = "arkhai-kit-alkahest"
tokens = ["alkahest.v1"]

[[mechanisms]]
name = "arkhai-payments"
kit = "arkhai-kit-arkhai-payments"
tokens = ["arkhai.payments.v1"]

[[mechanisms]]
name = "contact-exchange"
kit = "arkhai-kit-contact-exchange"
tokens = ["contact-exchange.v1"]

# Entry-point groups a host discovers at startup. A package registering into
# one is a plugin and is imported by nobody. The owner discovers the group and
# may register its own built-in members without becoming a plugin. Any group
# not listed is an extension point libraries contribute to.
[[plugin_groups]]
name = "market.buyer_domains"

[[plugin_groups]]
name = "market.storefront_contributions"

[[plugin_groups]]
name = "market.delivery_sinks"
owner = "arkhai-kit-delivery"

# The kind allowlists: what a package of each light kind may depend on. A
# dependency is on the allowlist when its layer, kind, or distribution is
# listed, or, with family_vocabulary, when it is the vocabulary of a family in
# the package's scope. enforce = false reports a breach as a warning.
[kind_allowlists.contracts]
layers = ["core"]
distributions = [
    "arkhai-kit-identity",
    "arkhai-kit-capability-shape",
    "arkhai-kit-capability-admissibility",
]
family_vocabulary = true
enforce = true

[kind_allowlists.client]
layers = ["core"]
kinds = ["contracts"]
distributions = ["arkhai-kit-identity"]
enforce = true

[vocabulary]
# Layers in which an out-of-scope identity literal fails; elsewhere it warns.
fail_layers = ["core", "kit"]

# Projects whose path does not yet say what they are. Each row states the
# attributes the path should yield and the change that will make it so. A row
# fails once the path yields the same, or once a mechanism it grants is known
# by none of the project's dependencies.
[[overrides]]
project = "arkhai-core-buyer"
layer = "composition"
kind = "executable"
scope = []
owner = "align-package-paths-with-layers"
since = 2026-10-13
reason = "The buyer role is a composition under the carrier directory."

