# settings.toml — base dynaconf configuration
# Values here serve as defaults and documentation of all supported keys.
# Override via: config.yml, config-<profile>.yml, env vars, or CLI args.

[default]

# ---------------------------------------------------------------------------
# RPC / chain connection
# ---------------------------------------------------------------------------
[default.rpc]
url = "http://localhost:8545"
chain_id = 31337          # Hardhat / Anvil default; override per environment
timeout_seconds = 30
retry_attempts = 3
retry_backoff_seconds = 2

# ---------------------------------------------------------------------------
# Registry (discovery index) service
# ---------------------------------------------------------------------------
[default.registry]
api_url            = ""

# ---------------------------------------------------------------------------
# Buyer wallet
# ---------------------------------------------------------------------------
[default.buyer]
api_url           = ""
base_url_override = ""
marketplace_credential = ""  # exact profile-provider secret, independent of wallet
private_key       = ""
wallet_address    = ""
chain_rpc_url     = ""   # RPC URL for on-chain escrow creation; falls back to rpc.url

# ---------------------------------------------------------------------------
# Seller wallet
# ---------------------------------------------------------------------------
[default.seller]
api_url           = ""
base_url_override = ""
private_key       = ""
wallet_address    = ""
admin_api_key     = ""        # X-Admin-Key for /admin/* and the provisioning service

# ---------------------------------------------------------------------------
# Test behaviour
# ---------------------------------------------------------------------------
[default.tests]
minimum_eth_balance = "0.01"          # ETH — wallets must hold at least this
gas_price_strategy  = "medium"        # low | medium | high
require_checksummed_addresses = true
order_create_timeout = 30             #time in seconds
order_match_timeout = 60
order_close_timeout = 30
e2e_poll_timeout_s = 120
e2e_poll_interval_s = 3

# ---------------------------------------------------------------------------
# Provisioning service
# ---------------------------------------------------------------------------
[default.provisioning]
api_url = ""

# ---------------------------------------------------------------------------
# API-credits topology (item 6)
# ---------------------------------------------------------------------------
[default.api_credits]
registry_url    = ""   # second registry, api_credits schema
service_url     = ""   # credits service (keys/credits/quota)
storefront_url  = ""   # credits seller storefront


# ---------------------------------------------------------------------------
# Bare-metal release-qualified topology
# ---------------------------------------------------------------------------
[default.bare_metal]
registry_url = ""
registry_authority = ""
registry_principals = []
buyer_credential_environment = "ARKHAI_E2E_BARE_METAL_MARKETPLACE_CREDENTIAL"
# Exact public `market bare-metal buy` arguments. Supply duration, one SSH
# public key, settlement selection, and JSON/non-interactive flags. Seller-owned
# site/resource/executor/provider fields and secret/private-key flags are rejected.
buy_args = ""
deal_timeout_seconds = 900
teardown_timeout_seconds = 300
poll_interval_seconds = 2
terminal_teardown_status = "released"

# Absent inputs skip by default so an ordinary suite run may exclude this
# scenario. Set true for a deliberately selected acceptance run: every missing
# input then fails instead, so the lane cannot report success having exercised
# nothing.
require_acceptance_lane = false

# Operator-managed known_hosts for the leased host. When empty the run pins the
# key on first contact and records that the identity was not independently
# verified; set require_verified_host_key to refuse that weaker mode.
known_hosts_file = ""
require_verified_host_key = false

# Operator-owned command proving host management access survived teardown. Runs
# outside the buyer session and may not reference the buyer's credentials.
management_probe_command = ""
management_probe_timeout_seconds = 60

# The seller's own publication round. Republication is an operator action, not
# something the marketplace performs on its own, so relisting is evidenced by
# invoking this and then observing public discovery.
publish_command = ""
publish_timeout_seconds = 300
relist_timeout_seconds = 180

# Bounded page for the public listing read. The buyer CLI caps this at 200; a
# reported total larger than what was read fails rather than judging
# availability from a partial page.
list_page_limit = 200
