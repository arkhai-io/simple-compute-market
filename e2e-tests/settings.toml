# settings.toml — base dynaconf configuration
# Values here serve as defaults and documentation of all supported keys.
# Override via: config.yml, config-<profile>.yml, env vars, or CLI args.

[default]

# ---------------------------------------------------------------------------
# RPC / chain connection
# ---------------------------------------------------------------------------
[default.rpc]
url = "http://localhost:8545"
chain_id = 31337          # Hardhat / Anvil default; override per environment
timeout_seconds = 30
retry_attempts = 3
retry_backoff_seconds = 2

# ---------------------------------------------------------------------------
# Registry (discovery index) service
# ---------------------------------------------------------------------------
[default.registry]
api_url            = ""
authority_id       = ""   # REGISTRY_AUTHORITY_ID the service publishes under
identifier         = ""   # the registry's own signing principal

# ---------------------------------------------------------------------------
# Buyer wallet
# ---------------------------------------------------------------------------
[default.buyer]
api_url           = ""
base_url_override = ""
marketplace_credential = ""  # exact profile-provider secret, independent of wallet
private_key       = ""
wallet_address    = ""
chain_rpc_url     = ""   # RPC URL for on-chain escrow creation; falls back to rpc.url

# ---------------------------------------------------------------------------
# Seller wallet
# ---------------------------------------------------------------------------
[default.seller]
api_url           = ""
base_url_override = ""
private_key       = ""
wallet_address    = ""
# The storefront administrator is a separate principal from the seller: the
# seller publishes listings, the administrator performs the system controls
# that are not part of a normal deal. Both are pinned in the storefront
# config, so a credential for the wrong one authenticates as the wrong caller.
admin_scheme      = "eip191"
admin_credential  = ""

# ---------------------------------------------------------------------------
# Second storefront (multi-registry scenario)
# ---------------------------------------------------------------------------
[default.alice]
api_url           = ""
private_key       = ""
wallet_address    = ""
admin_scheme      = "eip191"
admin_credential  = ""

# ---------------------------------------------------------------------------
# Test behaviour
# ---------------------------------------------------------------------------
[default.tests]
minimum_eth_balance = "0.01"          # ETH — wallets must hold at least this
gas_price_strategy  = "medium"        # low | medium | high
require_checksummed_addresses = true
order_create_timeout = 30             #time in seconds
order_match_timeout = 60
order_close_timeout = 30
e2e_poll_timeout_s = 120
e2e_poll_interval_s = 3

# ---------------------------------------------------------------------------
# Provisioning service
# ---------------------------------------------------------------------------
[default.provisioning]
api_url = ""
# Credential for the principal pinned as the provisioning service's admin
# identity. The operator client asserts the `admin` role on every request and
# the service resolves the trust set from that role, so a credential for any
# other principal authenticates as the wrong caller.
admin_scheme     = "eip191"
admin_credential = ""
# The provisioning service's own signing principal, pinned so the client
# verifies responses. Distinct from both caller principals above.
authority_scheme     = "eip191"
authority_identifier = ""

# ---------------------------------------------------------------------------
# API-credits topology (item 6)
# ---------------------------------------------------------------------------
[default.api_credits]
registry_url    = ""   # second registry, api_credits schema
service_url     = ""   # credits service (keys/credits/quota)
storefront_url  = ""   # credits seller storefront


# ---------------------------------------------------------------------------
# Bare-metal release-qualified topology
# ---------------------------------------------------------------------------
[default.bare_metal]
registry_url = ""
registry_authority = ""
registry_principals = []
buyer_credential_environment = "ARKHAI_E2E_BARE_METAL_MARKETPLACE_CREDENTIAL"
# Exact public `market bare-metal buy` arguments. Supply duration, one SSH
# public key, settlement selection, and JSON/non-interactive flags. Seller-owned
# site/resource/executor/provider fields and secret/private-key flags are rejected.
buy_args = ""
deal_timeout_seconds = 900
teardown_timeout_seconds = 300
poll_interval_seconds = 2
terminal_teardown_status = "released"
