# ---------------------------------------------------------------------------
# Profile: docker
# Targets a prebuilt dev-env Anvil node running on a local container named anvil.
# Addresses and keys are ok to commit
# ---------------------------------------------------------------------------

rpc:
  url: "http://anvil:8545"
  chain_id: 31337

registry:
  api_url: "http://registry:8080"

buyer:
  marketplace_credential: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
  private_key:       "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
  wallet_address:    "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
  chain_rpc_url:     "ws://anvil:8545"

seller:
  api_url:           "http://bob-storefront:8001"
  base_url_override: "http://bob-storefront:8001/"
  private_key:       "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"
  wallet_address:    "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
  admin_api_key:     "test-api-key"  # set to match [seller].admin_api_key in config.toml

provisioning:
  api_url: "http://provisioning:8081"
  # Well-known deterministic development values (standard Anvil accounts), as
  # with the keys above. Not secret, and MUST NOT be used on a public network.
  # `admin_credential` is Anvil 5, the principal the compose stack pins as the
  # provisioning admin identity; `authority_identifier` is Anvil 0, the
  # service's own signer. The compose stack pins both, so they are not
  # interchangeable and a swap fails as an authorisation error.
  admin_scheme:         "eip191"
  admin_credential:     "0x8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba"
  authority_scheme:     "eip191"
  authority_identifier: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"

api_credits:
  registry_url:   "http://api-credits-registry:8080"
  service_url:    "http://credits-service:8082"
  storefront_url: "http://credits-storefront:8000"
