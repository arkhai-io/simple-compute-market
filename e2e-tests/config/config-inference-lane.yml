# ---------------------------------------------------------------------------
# Profile: inference-lane
#
# The inference end-to-end lane's own settings (`make test-e2e-inference`), over
# config-docker.yml and config-payments-lane.yml: what compose.inference-lane.yml
# alone declares, merged key by key into the `inference` section. The lane has
# no payment scenario, since inference settles through Alkahest alone, so it
# states no payments setting. Every value is a public deterministic development
# value, never for a public network; see dev-env/identities/README.md, "The
# inference stack".
# ---------------------------------------------------------------------------

inference:
  # The model stub's pause between streamed chunks.
  stub_chunk_delay_seconds: "0.3"
  # The compute and API-credit registries the scenario's discovery is routed
  # away from. Their signers are the committed `registry-a.eip191` (Anvil 3)
  # and `api-credits-registry.ed25519` development identities.
  compute_registry_url:          "http://compute-registry:8080"
  compute_registry_authority_id: "compute-registry"
  compute_registry_scheme:       "eip191"
  compute_registry_identifier:   "0x90f79bf6eb2c4f870365e785982e1f101e93b906"
  api_credits_registry_url:          "http://api-credits-registry:8080"
  api_credits_registry_authority_id: "api-credits-registry"
  api_credits_registry_scheme:       "ed25519"
  api_credits_registry_identifier:   "_NUDENxVX6u4cMd0xzoYyQAt10QDI47bfnYnu2lTVho"
