# The gitleaks configuration of the secret audit, `make audit-secrets`
# (scripts/check_secrets.py --audit), at the release scripts/gitleaks-pins.toml pins:
# every gitleaks default rule but `private-key`, which the repository's own key rule
# replaces. The audit reports what it finds over HEAD's tracked tree and refuses
# nothing; it is read by hand before an official build ships. The gate the hooks, the
# guarded push and CI run, `.gitleaks.toml`, extends this file and turns three more
# rules off, so the key rule is written once, here.
#
# gitleaks' `private-key` rule accepts any 64 or more characters between a
# `BEGIN ... PRIVATE KEY-----` header and the next `KEY-----`, dashes included. A
# short fixture's END marker comes too soon to end a match, so the match runs on to
# the next block in the same scan and two fixtures read as one key. The rule here
# keeps the 64-character minimum body but admits no run of five dashes in it, so a
# match ends at its own block's END marker and never reaches another header. A real
# key's body — base64 wrapped at any length, or one string with `\n` escapes — is
# far longer than 64 characters and is refused; a fixture whose body is a word, such
# as `fixture`, is passed however many share a file.
# See openspec/specs/market-change-workflow/README.md, "Secret scanning".

[extend]
useDefault = true
disabledRules = ["private-key"]

[[rules]]
id = "private-key-block"
description = "A private key block whose body holds key material"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----(?:[^-]|-{1,4}[^-]){64,}-----END'''
keywords = ["-----begin"]
tags = ["key", "private-key"]
