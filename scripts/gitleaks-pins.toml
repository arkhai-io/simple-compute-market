# The gitleaks release the repository's public-content checks run, and where its
# archives come from. `make install-gitleaks` (scripts/install_gitleaks.py)
# verifies a downloaded archive against its sha256 here before extracting
# anything, and never reads the checksums file published beside the release, so
# an archive replaced after its sha256 was recorded here is refused.
#
# The linux_x64 sha256 matches a download of that archive. The others are copied
# from the release's checksums file, which comes from the same place as the
# archives; they refuse a later replacement, but nobody has downloaded and
# hashed those archives. A platform is added as another [archives.<os>_<arch>]
# table, named as gitleaks names its release archives.

version = "8.30.1"

[archives.linux_x64]
url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
sha256 = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

[archives.linux_arm64]
url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_arm64.tar.gz"
sha256 = "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"

[archives.darwin_x64]
url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_x64.tar.gz"
sha256 = "dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709"

[archives.darwin_arm64]
