# Seller stack — services a seller (someone with compute to sell) runs in production.
#
# Two services:
#   1. seller-storefront     — storefront HTTP server (arkhai:storefront).
#                              Publishes offers, negotiates with buyers,
#                              settles deals on chain.
#   2. seller-provisioning   — runs ansible to create/destroy VMs on the
#                              seller's KVM host (arkhai:compute-provisioning).
#
# Provisioning runs the real Ansible runner against the hosts in the
# inventory baked into its image, over the SSH key mounted below. See
# docs/seller-quickstart.md, "Prepare your KVM hosts".
#
# Operator-provided files:
#   ./config.seller.toml     — seller config; see docs/seller-quickstart.md.
#   ./keys/id_ed25519        — private key authorized on every KVM host in the
#                              provisioning inventory.
#
# Required images (run `make build-seller` from the repo root):
#   arkhai:storefront
#   arkhai:compute-provisioning
#
# Registry: not included. Either run your own (see docs/indexer-quickstart.md)
# or point [registry] urls in the seller TOML at an external indexer.
#
# Usage:
#   docker compose -f compose/seller.yml up -d
#   docker compose -f compose/seller.yml logs -f seller-storefront
#
# Environment:
#   SELLER_SSH_PRIVKEY       — required: path to the KVM-host SSH private key.
#                              Required rather than defaulted, since a missing
#                              bind-mount source would be created as a directory.
#   SELLER_CONFIG_PATH       — optional: path to seller TOML (default: ../config.seller.toml,
#                              i.e. ./config.seller.toml relative to the project root)

services:
  # One-shot init containers that chown the named volumes to the
  # appuser baked into each image. Docker creates fresh named volumes
  # as root-owned; without this, sqlite init crashes at first start
  # with "unable to open database file".
  #
  # Split per-image because `make build-seller-for-host` builds the
  # provisioning image with the host's `ubuntu` uid/gid (often != 1000)
  # to match the bind-mounted SSH key, while the storefront image
  # stays on the default 1000:1000. Chowning by username (appuser)
  # picks up the right uid in each image's /etc/passwd.
  #
  # Both exit successfully after one run; idempotent (chown -R no-ops
  # on already-correct ownership).
  seller-storefront-data-init:
    image: arkhai:storefront
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R appuser:appuser /data"]
    volumes:
      - seller-storefront-data:/data
    restart: "no"

  seller-provisioning-data-init:
    image: arkhai:compute-provisioning
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R appuser:appuser /data"]
    volumes:
      - seller-provisioning-data:/data
    restart: "no"

  seller-storefront:
    image: arkhai:storefront
    ports:
      - "8001:8001"
    # cap_add / devices / zerotier-seller volume below are for optional
    # ZeroTier overlay networking. Harmless when [seller].zerotier_network
    # is unset — the entrypoint fail-softs and continues.
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      seller-storefront-data-init:
        condition: service_completed_successfully
    env_file:
      - ${SELLER_IDENTITY_ENV_FILE:?set marketplace signer credential environment file}
    volumes:
      - ${SELLER_CONFIG_PATH:-../config.seller.toml}:/etc/arkhai/storefront.toml:ro
      - seller-storefront-data:/app/src/market_storefront/data/storefront
      - zerotier-seller:/var/lib/zerotier-one
    restart: unless-stopped

  seller-provisioning:
    image: arkhai:compute-provisioning
    command: ["sh", "-c", "compute-provisioning-migrate && exec compute-provisioning-api"]
    ports:
      - "8081:8081"
    # Lets an inventory use `host.docker.internal` as `ansible_host` when the
    # storefront box is itself the KVM host; multi-host inventories use real
    # addresses and never need it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      seller-provisioning-data-init:
        condition: service_completed_successfully
    env_file:
      - ${SELLER_PROVISIONING_IDENTITY_ENV_FILE:?set provisioning signer credential environment file}
    environment:
      - ACTIVE_PROFILES=seller
      - PROVISIONING_IDENTITY__PRINCIPAL__SCHEME=${SELLER_PROVISIONING_IDENTITY_SCHEME:?set provisioning public identity scheme}
      - PROVISIONING_IDENTITY__PRINCIPAL__IDENTIFIER=${SELLER_PROVISIONING_IDENTITY_IDENTIFIER:?set provisioning public identity identifier}
      - 'PROVISIONING_STOREFRONT_IDENTITY__PRINCIPALS=[{"scheme":"${SELLER_IDENTITY_SCHEME:?set storefront public identity scheme}","identifier":"${SELLER_IDENTITY_IDENTIFIER:?set storefront public identity identifier}"}]'
      - PROVISIONING_STOREFRONT_SITE_ID=default
      - 'PROVISIONING_ADMIN_IDENTITY__PRINCIPALS=[{"scheme":"${SELLER_PROVISIONING_ADMIN_IDENTITY_SCHEME:?set provisioning admin public identity scheme}","identifier":"${SELLER_PROVISIONING_ADMIN_IDENTITY_IDENTIFIER:?set provisioning admin public identity identifier}"}]'
    volumes:
      - seller-provisioning-data:/app/data
      - ${SELLER_SSH_PRIVKEY:?set the path to the KVM-host SSH private key}:/home/appuser/.ssh/id_ed25519:ro
    restart: unless-stopped

volumes:
  seller-storefront-data:
  seller-provisioning-data:
  zerotier-seller:
