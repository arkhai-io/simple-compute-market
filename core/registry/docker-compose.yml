version: '3.8'

services:
  registry:
    image: arkhai:registry
    # Uncomment to build locally instead
    # build: .
    # The migration before the application, which refuses a database it has
    # not migrated.
    command: ["sh", "-c", "registry-migrate && exec uvicorn core_registry.main:app --host 0.0.0.0 --port 8080"]
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Load from .env file (never commit .env to git!)
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT:-8080}
      - HOST=${HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file:
      - .env  # Create this file from .env.sample
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
